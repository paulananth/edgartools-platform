version: 2

sources:
  - name: edgartools_source
    database: "{{ env_var('DBT_SNOWFLAKE_DATABASE', 'EDGARTOOLS_DEV') }}"
    schema: "{{ env_var('DBT_SOURCE_SCHEMA', 'EDGARTOOLS_SOURCE') }}"
    tables:
      - name: COMPANY
        description: Current company source table loaded from serving Parquet exports.
      - name: FILING_ACTIVITY
        description: Current filing-activity source table loaded from serving Parquet exports.
      - name: OWNERSHIP_ACTIVITY
        description: Current ownership-activity source table loaded from serving Parquet exports.
      - name: OWNERSHIP_HOLDINGS
        description: Current ownership-holdings source table loaded from serving Parquet exports.
      - name: ADVISER_OFFICES
        description: Current adviser-office source table loaded from serving Parquet exports.
      - name: ADVISER_DISCLOSURES
        description: Current adviser-disclosure source table loaded from serving Parquet exports.
      - name: PRIVATE_FUNDS
        description: Current private-fund source table loaded from serving Parquet exports.
      - name: FILING_DETAIL
        description: Current filing-detail source table loaded from serving Parquet exports.
      - name: TICKER_REFERENCE
        description: CIK-to-ticker reference table loaded from serving Parquet exports.
      - name: SERVING_REFRESH_STATUS
        identifier: "{{ env_var('DBT_REFRESH_STATUS_IDENTIFIER', 'SNOWFLAKE_REFRESH_STATUS') }}"
        description: Per-run serving load and refresh status table for the active warehouse target.
      # ── Fundamentals silver exports (Branch B, isolated DAG branch) ──────────
      # PR-1 split (Q1-C hybrid):
      #   PASSTHROUGH (>1M rows, composite natural keys, retain SEC_ prefix):
      - name: SEC_FINANCIAL_FACT
        description: XBRL us-gaap fact per (cik, accession, concept, fiscal_period, segment, period_end, period_start). Composite-key passthrough from silver.
      - name: SEC_FINANCIAL_DERIVED
        description: Derived per-period metrics and accounting line items per (cik, accession, fiscal_period, period_end). Passthrough from silver. Forensic scores live on ACCOUNTING_FLAG.
      - name: SEC_THIRTEENF_HOLDING
        description: 13F INFORMATION TABLE holding per (cik, accession, holding_index). Passthrough from silver.
      #   DIMENSIONAL (<1M rows, surrogate fact_key, joined to COMPANY+DATE+FORM in the build step):
      - name: EARNINGS_RELEASE
        description: 8-K earnings release fact per (cik, accession). Dimensional — COMPANY+DATE×2+FORM joins.
      # ERDP-02 — Guidance facts (Gold Explore; SEC-preferred, firm_manual override)
      - name: GUIDANCE_FACTS
        description: >
          Structured guidance values (value_low/value_mid/value_high) per
          (cik, metric, fiscal_year, fiscal_quarter, as_of, accession_number,
          is_non_gaap, source_system). Explore-only — not pure-SEC
          Agent-Grade. SEC-derived (sec_8k/sec_10q/sec_10k) preferred;
          firm_manual coexists via source_system. Built from silver
          sec_guidance_fact by edgar_warehouse.serving.gold_models.
      - name: EXECUTIVE_RECORD
        description: DEF 14A executive compensation fact per (cik, accession, exec_name). Dimensional — COMPANY+DATE joins.
      - name: ACCOUNTING_FLAG
        description: 10-K accounting-flag fact per (cik, accession). Dimensional — COMPANY+DATE+FORM joins; auditor identity retained as natural-key columns (AUDIT_FIRM dim deferred).
      # Agent neighborhood evidence (ticket 08) — passthrough from silver
      - name: SEC_SUBSIDIARY_EVIDENCE
        description: Exhibit 21 / EX-8 subsidiary rows for HAS_PARENT_COMPANY (parent_scope=registrant_disclosed).
      - name: SEC_AUDITOR_REPORT_EVIDENCE
        description: Principal auditor evidence per annual filing for AUDITED_BY derivation.
      - name: SEC_EMPLOYMENT_EVENT
        description: Item 5.02 / employment events for EMPLOYED_BY temporal updates.
      # ERDP-03 — Earnings calendar (Gold Explore; external pilot sources)
      - name: EARNINGS_CALENDAR
        description: >
          Forward-looking expected earnings print dates per
          (cik, fiscal_year, fiscal_quarter, source_system, as_of).
          Explore-only — not pure-SEC Agent-Grade. Pilot sources finnhub /
          yahoo / firm_manual via edgar_warehouse.explore.earnings_calendar.
