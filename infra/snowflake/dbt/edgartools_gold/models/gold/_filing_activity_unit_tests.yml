version: 2

# dbt-gold-silver-rewiring map, Ticket 01 (.scratch/dbt-gold-silver-rewiring/
# issues/01-establish-snowflake-native-surrogate-keys.md): proves the
# surrogate_key() macro is deterministic (same accession_number -> same
# filing_key, always) and independent of every other column on the row.
# Expected filing_key values below are BITAND(HASH(accession_number),
# 9223372036854775807)::BIGINT, computed live against Snowflake -- not
# guessed, since Snowflake's HASH() has no reference implementation to
# compute offline against.
#
# Ticket 03 updated given.input to ref('sec_company_filing') (the model's
# new source) and added filing_date (now required -- date_key derives from
# it) and fact_key to the expected output: fact_key and filing_key use the
# identical surrogate_key(['accession_number']) call in the rewired model,
# so they must come out numerically equal, matching
# _build_fact_filing_activity's original behavior (both derived from
# hash(accession_number)).
unit_tests:
  - name: filing_activity_filing_key_is_deterministic_per_accession
    description: >
      Two rows sharing the same accession_number (but differing on every
      other column) get the identical filing_key and fact_key (the two use
      the same derivation); a different accession_number gets different
      keys.
    model: filing_activity
    given:
      - input: ref('sec_company_filing')
        rows:
          - accession_number: "0001111111-26-000001"
            cik: 320193
            form: "10-K"
            filing_date: "2026-01-15"
          - accession_number: "0001111111-26-000001"
            cik: 789019
            form: "10-K/A"
            filing_date: "2026-02-01"
          - accession_number: "0002222222-26-000002"
            cik: 320193
            form: "8-K"
            filing_date: "2026-03-01"
    expect:
      rows:
        - accession_number: "0001111111-26-000001"
          filing_key: 5518306488236362277
          fact_key: 5518306488236362277
        - accession_number: "0001111111-26-000001"
          filing_key: 5518306488236362277
          fact_key: 5518306488236362277
        - accession_number: "0002222222-26-000002"
          filing_key: 3991365530149477314
          fact_key: 3991365530149477314
