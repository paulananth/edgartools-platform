# The write login's key-pair service user and role come from the private environment, never from this file. The role reads only the
# mirror database and writes only the Gold destination (an approved destination, ticket 05).
# The `database` and `schema` lines are written from rules/snowflake.yaml by `python -m edgar_warehouse.gold.views write infra/dbt/gold`.
edgartools_gold:
  target: prod
  outputs:
    prod:
      type: snowflake
      account: "{{ env_var('GOLD_SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('GOLD_SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('GOLD_SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('GOLD_SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('GOLD_SNOWFLAKE_WAREHOUSE') }}"
      database: DB_EDGARTOOLS_GOLD
      schema: GOLD
      threads: 4
