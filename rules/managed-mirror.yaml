# The managed mirror: the tables Snowflake replicates from the data database, and nothing else.
# This file is the system of record for them. A table is mirrored only if it is listed here, and it may be listed only
# if rules/exposure.yaml lets it leave the stores. The mirror's SQL (skills/data-platform/scripts/exposure/mirror_sql.py)
# is written from this list, so the live mirror and this list cannot differ without a read-back that says so; Gold
# (rules/gold) may read only what is listed. The target database comes from snowflake.yaml (`mirror.database`).
# A change to the list is a change to the mirror (ALTER_MIRROR), approved like a new mirror: it costs per table.
mirror: edgartools_mirror         # the name given to CREATE_MIRROR
postgres_database: data           # the one database the mirror reads (its schemas are the exposure layers' source_schema)
refresh_interval: 60 minutes
target_table_type: ICEBERG        # Snowflake-managed storage, serverless apply
approval:
  date: "2026-11-20"
  words:
  - first i need a system of record for tables included in the mirror
  # The list is the 19 tables the first mirror carried (the masters, the published RDM codes, every registered silver table).
verified: false                   # becomes true when a read-back (mirror_sql.py verify) shows every table REPLICATING with equal counts
tables:
- layer: mdm
  table: mastering_identifier
- layer: mdm
  table: mastering_master
- layer: rdm
  table: published_code
- layer: silver
  table: adv_custody
- layer: silver
  table: company_fact
- layer: silver
  table: company_line_item
- layer: silver
  table: company_measure
- layer: silver
  table: insider_position
- layer: silver
  table: insider_reporting_owner
- layer: silver
  table: ipo_filing
- layer: silver
  table: nport_holding
- layer: silver
  table: prospectus_cover_line
- layer: silver
  table: prospectus_offering
- layer: silver
  table: prospectus_underwriter
- layer: silver
  table: registration_offering
- layer: silver
  table: registration_statement_line
- layer: silver
  table: relationship
- layer: silver
  table: thirteenf_filing
- layer: silver
  table: thirteenf_holding
