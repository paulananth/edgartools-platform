# SEC EDGAR state and country codes: the codes SEC writes in a filer's
# `stateOfIncorporation` and in each address's `stateOrCountry` and
# `countryCode`, with the place SEC names and its ISO 3166 code as GLEIF writes
# a jurisdiction (US-DE, CA-ON, NL).
#
# The codes, places and types are SEC's list as edgartools 5.30.0 ships it
# (edgar/reference/data/place_codes.csv, sha256 1daf0cc6...ab14); no SEC
# request was made. The ISO codes of the 169 codes seen in bronze were built in
# company mastering ticket 08 from the description SEC writes beside each code
# across 76,230 filers. The other 140 were added on 2026-09-26 by country name
# and checked by hand; no filer in bronze uses any of them. XX is SEC's
# "unknown" and has no ISO code.
#
# SEC writes a US state as its postal code (DE) and a territory the same way
# (PR, GU, VI); both read as US-<code>. X1 is the United States with no state.
