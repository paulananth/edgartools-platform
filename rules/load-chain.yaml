# The order a fresh store is loaded in: every captured source and target, each one's capture, facts, revision and
# workers, read by `skills/data-operations/scripts/load_chain.py` (RUNBOOK, "Load a fresh store"). A source's later
# delivery is a new publication and carries the next `revision`. `capture` is a folder under the captures root (or the
# proving root where `capture_root: proving`); `{run}` in a fact is the chain's run label. `minutes` bounds one attempt,
# which carries on where the last stopped.
# Steps that may run at the same time are in different `lane`s, and `waits_for` names a step of another lane that must
# be done first. Each lane runs its steps in file order (`load_chain.py --lane <name>`), so every lane can start at once.
# Every `waits_for` comes from `infer_dependencies.py` (what the rules declare; a test holds the two equal), never from
# a machine's size: a load waits only for the source whose golden records its own records join. Links set no order:
# the links table is built once, after the last load (`load_chain.py --finish`).
# Eight lanes: A the Companies the others follow; P the Persons; S the Securities; C the other Companies; L funds, share
# classes, N-PORT Securities and GLEIF; O ownership; D the other silver-only sources; F company-facts.
