# The order a fresh store is loaded in: every captured source and target, each one's capture, facts, revision and
# workers, read by `skills/data-operations/scripts/load_chain.py` (RUNBOOK, "Load a fresh store"). Masters come first and
# each source's silver target last, so silver rows find their masters as they land. A source's later delivery is a new
# publication and carries the next `revision`. `capture` is a folder under the captures root (or the proving root where
# `capture_root: proving`); `{run}` in a fact is the chain's run label. `minutes` bounds one attempt, which carries on
# where the last stopped.
# Steps that may run at the same time are in different `lane`s, and `waits_for` names a step of another lane that must be
# done first. Each lane runs its steps in file order (`load_chain.py --lane <name>`), so every lane can start at once. What
# may overlap, from how the store works: merges of one kind of master data take turns (a lane of Securities and a lane of
# Persons overlap; two lanes of one kind only queue), every step that builds the links table shares one lease (those are one
# lane), and a silver-only load merges nothing. A the Companies every other lane needs; P persons; S securities (OpenFIGI,
# 13F); C companies (ADV, N-CEN registrants and advisers); L the steps that build links, then GLEIF, which waits for the
# Companies; O ownership, which waits for the Persons; D the silver-only sources.
version: 1
steps:
