source: sec.prospectus
pass:
  name: read
  files: '*.capture.zip'
  units:
    slices:
      bytes: 33554432
execution:
  profile: source.read
  workers: 1
  max_artifacts: 512
  max_input_bytes: 134217728
read:
  format: html
  container: zip
  member: payload
  encoding:
  - utf-8
  - windows-1252
  context:
    accession_number:
      type: text
      zip_json:
        member: metadata.json
        path: scope.accession_number
    cik:
      type: text
      zip_json:
        member: metadata.json
        path: scope.cik
    captured_at:
      type: text
      zip_json:
        member: metadata.json
        path: captured_at
  limits:
    max_bytes: 134217728
    max_member_bytes: 134217728
    max_records: 5000000
  tables:
    offering:
      each: .
      columns:
        accession_number:
          context:
            name: accession_number
        cik:
          context:
            name: cik
        captured_at:
          context:
            name: captured_at
        title:
          text:
            path: title.$
            from: document
            null_if:
            - ''
        shares_offered:
          first_found:
            path: block
            from: document
            within: 120
            transforms:
            - regex_extract:
                pattern: (?i)\b([0-9][0-9,]{4,}) (?:class [a-z] )?(?:shares|ordinary shares|american depositary shares|ads|units)\b
                group: 1
            - regex_replace:
                pattern: ','
                with: ''
        price_per_share:
          first_found:
            path: block
            from: document
            within: 200
            transforms:
            - regex_extract:
                pattern: (?i)offering price (?:is |of |will be )?\$\s?([0-9][0-9,]*(?:\.[0-9]+)?) per
                group: 1
            - regex_replace:
                pattern: ','
                with: ''
        over_allotment_shares:
          first_found:
            path: block
            from: document
            within: 200
            transforms:
            - regex_extract:
                pattern: (?i)(?:option|right) to purchase up to (?:an additional )?([0-9][0-9,]*) (?:additional )?(?:shares|ordinary shares|ads|american depositary shares|units)
                group: 1
            - regex_replace:
                pattern: ','
                with: ''
        ticker:
          first_found:
            path: block
            from: document
            within: 200
            transforms:
            - regex_extract:
                pattern: (?i)\b(?:under|the|trading) symbols?\s*[“"'‘]\s?([A-Za-z]{1,5})\b
                group: 1
        exchange:
          first_found:
            path: block
            from: document
            within: 200
            transforms:
            - regex_extract:
                pattern: (?i)\b(?:to list|(?:are|is|be|been) (?:listed|traded|quoted))\b[^.]{0,80}?\bon (?:the )?(nasdaq global select market|nasdaq global market|nasdaq capital market|nasdaq stock market|nyse
                  american|new york stock exchange|nyse|nasdaq)
                group: 1
    cover_line:
      each: row
      select:
        choose:
          condition:
            found:
              path: c1.$
              transforms:
              - regex_extract:
                  pattern: (?i)^(?:(?:initial |original )?(?:public offering price|price to (?:the )?public|offering price|issue price)(?:\s*\(?\d+\)?)*[\s.]*$|(?:underwriting|agent'?s?|placement agent'?s?)
                    (?:discounts?|commissions?|fees?)|(?:net )?proceeds(?:,? before expenses,?)? to\b)
                  group: 0
          then:
            found:
              path: '@cells'
              transforms:
              - regex_extract:
                  pattern: ^[^|]*\|.*[0-9]
                  group: 0
          else:
            const:
              value: null
      columns:
        accession_number:
          context:
            name: accession_number
        cik:
          context:
            name: cik
        captured_at:
          context:
            name: captured_at
        table_number:
          text:
            path: '@table'
            null_if:
            - ''
        row_number:
          text:
            path: '@row'
            null_if:
            - ''
        label:
          text:
            path: c1.$
            trim: true
            null_if:
            - ''
        line:
          coalesce:
            skip: 'null'
            values:
            - choose:
                condition:
                  found:
                    path: c1.$
                    transforms:
                    - regex_extract:
                        pattern: (?i)^(?:initial |original )?(?:public offering price|price to (?:the )?public|offering price|issue price)(?:\s*\(?\d+\)?)*[\s.]*$
                        group: 0
                then:
                  const:
                    value: offering_price
                else:
                  const:
                    value: null
            - choose:
                condition:
                  found:
                    path: c1.$
                    transforms:
                    - regex_extract:
                        pattern: (?i)^(?:underwriting|agent'?s?|placement agent'?s?) (?:discounts?|commissions?|fees?)
                        group: 0
                then:
                  const:
                    value: underwriting_discount
                else:
                  const:
                    value: null
            - choose:
                condition:
                  found:
                    path: c1.$
                    transforms:
                    - regex_extract:
                        pattern: (?i)^(?:net )?proceeds(?:,? before expenses,?)? to\b
                        group: 0
                then:
                  const:
                    value: proceeds
                else:
                  const:
                    value: null
        per_unit:
          text:
            path: '@cells'
            null_if:
            - ''
            transforms:
            - regex_extract:
                pattern: ^[^|]*\|\s*(?:\$\s*\|\s*)?\$?\s*\(?([0-9][0-9,]*(?:\.[0-9]+)?)
                group: 1
            - regex_replace:
                pattern: ','
                with: ''
        total:
          text:
            path: '@cells'
            null_if:
            - ''
            transforms:
            - regex_extract:
                pattern: ^[^|]*\|\s*(?:\$\s*\|\s*)?[^|]*\|\s*(?:\$\s*\|\s*)?\$?\s*\(?([0-9][0-9,]*(?:\.[0-9]+)?)
                group: 1
            - regex_replace:
                pattern: ','
                with: ''
    turned_price:
