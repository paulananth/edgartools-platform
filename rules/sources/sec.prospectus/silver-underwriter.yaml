# The silver table of a final prospectus's underwriters: one row per firm the underwriting table names ("Name | Number of
# Shares"), with the shares it agreed to buy. Rows are the `underwriter` table of prospectus-page.yaml.
# Rulings: operator ("Look-up on mdm then silver"; "424B1 to 424B5, cover terms"). A term
# the page does not state is empty, never zero; numbers land as exact decimals or whole numbers from the text as filed.
# A firm is named as filed; it is not mastered here.
table: prospectus_underwriter
definition: One underwriter of a final prospectus and the shares it agreed to buy, as the underwriting table states.
grain: one row per accession number, table and row
columns:
- name: accession_number
  type: VARCHAR
  nullable: false
  definition: The filing's accession number.
  source: capture metadata scope.accession_number
  sensitivity: none
- name: cik
  type: VARCHAR
  nullable: false
  definition: The registrant's CIK, by which its Company is found.
  source: capture metadata scope.cik
  sensitivity: none
- name: captured_at
  type: TIMESTAMP WITH TIME ZONE
  nullable: false
  definition: 'The moment the page was captured from the SEC archive: the row''s time in silver; the filing''s own date is not on the page.'
  source: capture metadata captured_at
  sensitivity: none
- name: table_number
  type: BIGINT
  nullable: false
  definition: The table's number in the page.
  source: page order
  sensitivity: none
- name: row_number
  type: BIGINT
  nullable: false
  definition: The row's number in its table.
  source: page order
  sensitivity: none
- name: underwriter
  type: VARCHAR
  nullable: true
  definition: The firm's name as filed, without the dot leaders and footnote marks.
  source: first cell
  sensitivity: none
- name: shares
  type: BIGINT
  nullable: true
  definition: The number of shares the firm agreed to buy.
  source: last cell
  sensitivity: none
key:
- accession_number
- table_number
- row_number
links:
- columns:
  - cik
  kind: company
  source_code: sec.company.v1
  to_part: registrant
  source_key: cik
  mdm_id_column: registrant_mdm_id
time:
  as_of: null
  as_at: captured_at
  event_time: null
partition: []
load_mode: append
why: 'An underwriter line is a fact of a filed document: transaction data keyed by its place in the page, linked to the registrant Company by lookup. Append, since a filed document never
  changes.'
checks: []
