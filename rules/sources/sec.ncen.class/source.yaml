# SEC Form N-CEN's fund share classes, read for the Security master (part 3 of
# the N-CEN onboarding, .scratch/onboarding/sec.ncen/onboarding-log.md; ticket
# 234). Rulings it rests on (operator, 2026-11-14):
# - "we need to model reality as close as possible so yes and yes": a share
#   class is a Security of its fund series;
# - "Yes" (after the research): a share class is issued by its fund series,
#   and the series reaches its trust by IS_SUBFUND_OF;
# - "Class id, then ticker (Recommended)": a class joins the Security holding
#   its SEC class id, else the one Security holding its ticker, else creates a
#   Security by its class id; a ticker held by several Securities goes to
#   review.
# One record per share class (its SEC class id) over the quarter, from the row
# of its latest filing, in two steps: this reading streams SHARES_OUTSTANDING.tsv
# once, each row dated and given its series by sec.ncen.fund's own reading of
# the filing rows (FUND_ID); combine.yaml gives each row its class's latest row;
# the Merge Stage takes one record per class (`distinct_on`).
# Left out: the shares outstanding a class reports (none: N-CEN's table holds
# the class's name, id and ticker only).
source: sec.ncen.class
pass:
  name: classes
  units: {each: file}
  lookups:
    filed: {column: fund_id, from: sec.ncen.fund/fund-keys.yaml, max_input_bytes: 268435456, max_input_rows: 1000000, table: fund_filed, value_column: filed_at}
    series: {column: fund_id, from: sec.ncen.fund/fund-keys.yaml, max_input_bytes: 268435456, max_input_rows: 1000000, table: fund_series, value_column: series_id}
bronze:
  family: sec.ncen-datasets
bookkeeping:
  version: 2
  targets:
    mastering:
      grain: run
      # The combine's rows are the records, one per class; no record step.
      extract: combine.yaml
      master: {keys: {dataset: sec.ncen.class.v1, distinct_on: [class_id], table: share_class}}
execution:
  profile: source.read
  workers: 1
  max_artifacts: 1
read:
  format: json
  limits:
    max_bytes: 1048576
    max_records: 1
  lookup_sets:
    filed:
      max_values: 1000000
      max_bytes: 67108864
      max_value_bytes: 64
      pairs: true
    series:
      max_values: 1000000
      max_bytes: 67108864
      max_value_bytes: 64
      pairs: true
  tables:
    share_class:
      each: .
      # Every row names a class id, one letter and nine digits (four quarters).
      select: {test: {path: CLASS_ID, kind: truthy}}
      columns:
        class_id: {text: {path: CLASS_ID, transforms: [{case: upper}]}}
        fund_id: {text: {path: FUND_ID}}
        filed_at:
          member_value: {lookup: filed, key: {text: {path: FUND_ID}}, on_many: error}
        # A fund row naming no series (44 class rows over four quarters) is the
        # registrant's own fund: its class has no series to be issued by.
        series_id:
          member_value: {lookup: series, key: {text: {path: FUND_ID}}, on_many: error}
        name: {text: {path: CLASS_NAME, default: "", null_if: [""]}}
        # The ticker keeps letters and digits; a filed "N/A" (3,382 rows over
        # four quarters) is no ticker, as a Form 4 symbol's is. Longer than a
        # ticker's nine characters (one class in 2026q1 files a word) is none
        # either: the class keeps its class id and finds no Security by it.
        ticker:
          text:
            path: TICKER
            default: ""
            transforms:
            - {case: upper}
            - {regex_replace: {pattern: '^\s*(NONE|N/A|N\.A\.|NOT APPLICABLE)\s*$', with: ''}}
            - {regex_replace: {pattern: '[^A-Z0-9]', with: ''}}
            - {regex_replace: {pattern: '^.{10,}$', with: ''}}
            null_if: [""]
  stream:
    framing: delimited
    delimited: {format: tsv, encoding: utf-8}
    container: zip
    member: SHARES_OUTSTANDING.tsv
    # Profiling, four quarters: 31,265 rows, 29,008 classes.
    max_input_bytes: 1000000000
    max_bytes: 100000000
    max_record: 1048576
    max_records: 1000000
    max_depth: 64
    ordinal_context: null
    partition_bytes: 8388608
    partition_records: 100000
    max_partitions: 1000
    max_spool_bytes: 1073741824
    max_output_rows: 1000000
dataset_contracts:
  sec.ncen.class.v1:
    contract:
      provider: SEC
      family: sec.ncen-datasets
      schema_version: sec-ncen-class-v1
      record_key: the share class's SEC class id; one record per class over the quarter, from the row of its latest filing
      publication_key: the quarter's N-CEN data set file and the reduction and combine contracts
      effective_time: the latest filing date that names the class, as an observation
      semantics: patch
      completeness: the share classes named in one quarter's N-CEN filings; no retirement by absence
      nonblocking_deferred_reasons:
      - missing_record_identity
      - missing_provisional_file_date
      - invalid_time
      - invalid_field_shape
      adapter:
        reading:
          source: sec.ncen.class
          read:
            format: json
            limits:
              max_bytes: 33554432
              max_records: 1
            assertions:
            - test:
                test:
                  path: .
                  kind: object
              reason: Mapped input must be an object
            - test: {test: {path: latest.filed_at, kind: truthy}}
              reason: missing_provisional_file_date
            tables:
              mapped:
                each: .
                columns:
                  fields:
                    object:
                      fields:
                        # The class's own name ("Admiral Shares", "Class A"): the title of its class.
                        title_of_class: {value: {path: latest.name, type: text, null_if_blank: true}}
                  matching:
                    object:
                      fields: {}
          input_fields:
          - class_id
          - latest
        version: sec-ncen-class-2026-11-14.class-id-then-ticker
        retain_deferred: true
        source_record_provenance: true
        kind: security
        effective_at: latest.filed_at
        record_key:
        - class_id
        record_key_format: sec_class_id
        # The class id joins the Security holding it, or creates it. The
        # ticker is lookup only: it finds the one Security OpenFIGI or N-PORT
        # gave it to (rule ncen-class-ticker), and is never this record's
        # identifier.
        identifiers:
          sec_class_id: class_id
        identifier_formats:
          sec_class_id: sec_class_id
        cross_references:
          ticker: latest.ticker
        cross_reference_formats:
          ticker: ticker
        # A share class is issued by its fund series (sec.ncen.fund's record
        # of it), seen at the class's latest filing in the quarter: the filing
        # that also dates the series' own record, so the link falls inside it.
        relationships:
        - type: ISSUED_BY
          target_key: [latest.series_id]
          target_source: sec.ncen.fund.v1
          valid_from: latest.filed_at
          date_basis: observed
          time_format: instant
          scope: SEC N-CEN share class
