# SEC Form N-CEN registrants, read for the Company master (part 4 of the N-CEN
# onboarding, .scratch/onboarding/sec.ncen/onboarding-log.md; ticket 234).
# Operator, 2026-11-14: "we need to model reality as close as possible so yes
# and yes" (a fund series ties to its registrant trust, from N-CEN). N-CEN's
# REGISTRANT.tsv carries N-PORT's registrant columns, so this reading is
# sec.nport.registrant's. A registrant joins its Company by CIK, or creates it;
# its stated LEI is lookup only (several registrants file one sponsor's LEI).
# Each N-CEN series
# links to it (IS_SUBFUND_OF, from sec.ncen.fund), the registrants that file no
# N-PORT included (closed-end funds and unit trusts).
# The run, in two steps: sec.nport.registrant's submissions reading gives each
# filing its date (`filed`); this reading streams REGISTRANT.tsv once, each
# row dated; combine.yaml gives each row its CIK's latest row and first filing
# date; the Merge Stage takes one record per CIK.
# Left out: the phone number (personal). An LEI of all zeros is none.
source: sec.ncen.registrant
pass:
  name: registrant_rows
  units: {each: file}
  lookups:
    filed: {column: accession_number, from: sec.nport.registrant/submissions.yaml, max_input_bytes: 67108864, max_input_rows: 1000000, table: filed, value_column: filed}
bronze:
  family: sec.ncen-datasets
bookkeeping:
  version: 2
  targets:
    mastering:
      grain: run
      # The quarter in the data set's file name is the delivery's date: it orders the publications.
      delivered: {key: '(?P<year>\d{4})q(?P<quarter>[1-4])_ncen\.zip$'}
      # The combine's rows are the records, one per CIK (`distinct_on`); no record step.
      extract: combine.yaml
      master: {keys: {dataset: sec.ncen.registrant.v1, distinct_on: [cik], table: filing}}
execution:
  profile: source.read
  workers: 1
  max_artifacts: 1
read:
  format: json
  limits:
    max_bytes: 1048576
    max_records: 1
  lookup_sets:
    filed:
      max_values: 1000000
      max_bytes: 67108864
      max_value_bytes: 64
      pairs: true
  tables:
    filing:
      each: .
      columns:
        cik: {text: {path: CIK}}
        accession_number: {text: {path: ACCESSION_NUMBER}}
        # N-CEN's filing date ("YYYY MM DD" in the filing pairs) as an instant.
        filed_at:
          transform:
            value: {member_value: {lookup: filed, key: {text: {path: ACCESSION_NUMBER}}, on_many: error}}
            transforms:
            - {regex_replace: {pattern: ' ', with: '-'}}
            - {pad: {left: '', right: 'T00:00:00+00:00'}}
        name: {text: {path: REGISTRANT_NAME, default: "", null_if: [""]}}
        file_number: {text: {path: FILE_NUM, default: "", null_if: [""]}}
        lei:
          text:
            path: LEI
            default: ""
            transforms:
            - {case: upper}
            null_if: ["", "00000000000000000000"]
        street: {text: {path: ADDRESS1, default: "", null_if: [""]}}
        # "NULL" written as the second address line (79 filings, profiling).
        street2: {text: {path: ADDRESS2, default: "", null_if: ["", "NULL"]}}
        city: {text: {path: CITY, default: "", null_if: [""]}}
        region: {text: {path: STATE, default: "", null_if: [""]}}
        postcode: {text: {path: ZIP, default: "", null_if: [""]}}
        country: {text: {path: COUNTRY, default: "", null_if: [""]}}
  stream:
    framing: delimited
    delimited: {format: tsv, encoding: utf-8}
    container: zip
    member: REGISTRANT.tsv
    # Profiling, N-CEN 2026q1: 1,927 filings, 1,796 registrants.
    max_input_bytes: 1000000000
    max_bytes: 100000000
    max_record: 1048576
    max_records: 1000000
    max_depth: 64
    ordinal_context: null
    partition_bytes: 8388608
    partition_records: 100000
    max_partitions: 1000
    max_spool_bytes: 1073741824
    max_output_rows: 1000000
dataset_contracts:
  sec.ncen.registrant.v1:
    contract:
      provider: SEC
      family: sec.ncen-datasets
      schema_version: sec-ncen-registrant-v1
      record_key: the registrant's CIK; one record per CIK over the quarter, from its latest filing
      publication_key: the quarter's N-CEN data set file and the combine contract
      effective_time: the latest filing date as an observation, not incorporation or registration inception
      semantics: patch
      completeness: the registrants of one quarter's N-CEN filings; no retirement by absence
      nonblocking_deferred_reasons:
      - missing_record_identity
      - missing_provisional_file_date
      - invalid_time
      adapter:
        reading:
          source: sec.ncen.registrant
          read:
            format: json
            limits:
              max_bytes: 33554432
              max_records: 1
            assertions:
            - test:
                test:
                  path: .
                  kind: object
              reason: Mapped input must be an object
            - test: {test: {path: latest.filed_at, kind: truthy}}
              reason: missing_provisional_file_date
            tables:
              mapped:
                each: .
                columns:
                  fields:
                    object:
                      fields:
                        name: {value: {path: latest.name, type: text, null_if_blank: true}}
                        address:
                          object:
                            fields:
                              street: {value: {path: latest.street, type: text, trim: true, null_if_blank: true}}
                              street2: {value: {path: latest.street2, type: text, trim: true, null_if_blank: true}}
                              city: {value: {path: latest.city, type: text, trim: true, null_if_blank: true}}
                              region: {value: {path: latest.region, type: text, trim: true, null_if_blank: true}}
                              postcode: {value: {path: latest.postcode, type: text, trim: true, null_if_blank: true}}
                              country: {value: {path: latest.country, type: text, trim: true, null_if_blank: true}}
                            omit_nulls: true
                            null_if_empty: true
                  matching:
                    object:
                      fields: {}
          input_fields:
          - cik
          - latest
          - first_filed_at
        version: sec-ncen-registrant-2026-11-14.cik-lei-lookup-only
        retain_deferred: true
        source_record_provenance: true
        kind: company
        effective_at: latest.filed_at
        record_key:
        - cik
        record_key_format: sec_cik
        # The CIK joins the registrant's Company, or creates it. The LEI it
        # states is lookup only, kept as filed: in 2026q1, 25 LEIs are each
        # filed by several registrants (120 CIKs; up to 23 on one sponsor's
        # LEI), and 19 fail their check digits, which must not cost a trust its
        # Company.
        identifiers:
          cik: cik
        identifier_formats:
          cik: sec_cik
        cross_references:
          sec_file_number: latest.file_number
          ncen_registrant_lei: latest.lei
        # The fund role from its first filing in the quarter, so the series
        # that link to it fall inside it.
        profiles:
        - role: fund
          authority: SEC EDGAR
          registration: cik
          valid_from: first_filed_at
