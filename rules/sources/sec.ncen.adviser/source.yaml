# SEC Form N-CEN's investment advisers and sub-advisers, read for the Company
# master (part 2 of the N-CEN onboarding, .scratch/onboarding/sec.ncen/
# onboarding-log.md; ticket 234). Operator, 2026-11-14: "we need to model
# reality as close as possible so yes and yes" (a fund ties to its adviser,
# from N-CEN). One record per adviser (its CRD number) over the quarter, from
# the row of its latest filing; the series it advises link to it from
# sec.ncen.fund (INVESTMENT_ADVISER_TO, in capacity advisor or subadvisor).
# The run, in two steps: sec.ncen.fund's own reading gives each filing row
# (FUND_ID) its filing date (`filed_at`); this reading streams ADVISER.tsv once;
# combine.yaml gives each row its adviser's latest row and first filing date;
# the Merge Stage takes one record per CRD.
# Left out: the adviser's state, country and affiliation (detail of one
# filing's row) and its start and end dates, which only 1,245 and 527 rows of
# 23,859 state (the links are dated by the filing instead).
source: sec.ncen.adviser
pass:
  name: advisers
  units: {each: file}
  lookups:
    filed: {column: fund_id, from: sec.ncen.fund/source.yaml, max_input_bytes: 268435456, max_input_rows: 1000000, table: fund_filed, value_column: filed_at}
bronze:
  family: sec.ncen-datasets
bookkeeping:
  version: 2
  targets:
    mastering:
      # The combine's rows are the records, one per adviser (`distinct_on`); no reduce or record step.
      extract: combine.yaml
      master: {keys: {dataset: sec.ncen.adviser.v1, distinct_on: [crd], table: adviser}}
execution:
  profile: source.read
  workers: 1
  max_artifacts: 1
read:
  format: json
  limits:
    max_bytes: 1048576
    max_records: 1
  lookup_sets:
    filed:
      max_values: 1000000
      max_bytes: 67108864
      max_value_bytes: 64
      pairs: true
  tables:
    adviser:
      each: .
      # Every row names a CRD (four quarters); a row with none is not read.
      select: {test: {path: CRD_NUM, kind: truthy}}
      columns:
        crd: {text: {path: CRD_NUM}}
        fund_id: {text: {path: FUND_ID}}
        filed_at:
          member_value: {lookup: filed, key: {text: {path: FUND_ID}}, on_many: error}
        name: {text: {path: ADVISER_NAME, default: "", null_if: [""]}}
        lei:
          text:
            path: ADVISER_LEI
            default: ""
            transforms:
            - {case: upper}
            null_if: ["", "N/A", "00000000000000000000"]
  stream:
    framing: delimited
    delimited: {format: tsv, encoding: utf-8}
    container: zip
    member: ADVISER.tsv
    # Profiling, 2026q1: 12,268 rows; four quarters 23,859.
    max_input_bytes: 1000000000
    max_bytes: 100000000
    max_record: 1048576
    max_records: 1000000
    max_depth: 64
    ordinal_context: null
    partition_bytes: 8388608
    partition_records: 100000
    max_partitions: 1000
    max_spool_bytes: 1073741824
    max_output_rows: 1000000
dataset_contracts:
  sec.ncen.adviser.v1:
    contract:
      provider: SEC
      family: sec.ncen-datasets
      schema_version: sec-ncen-adviser-v1
      record_key: the adviser's CRD number as filed; one record per adviser over the quarter, from the row of its latest filing
      publication_key: the quarter's N-CEN data set file and the reduction and combine contracts
      effective_time: the latest filing date that names the adviser, as an observation
      semantics: patch
      completeness: the advisers named in one quarter's N-CEN filings; no retirement by absence
      nonblocking_deferred_reasons:
      - missing_record_identity
      - missing_provisional_file_date
      - invalid_time
      adapter:
        reading:
          source: sec.ncen.adviser
          read:
            format: json
            limits:
              max_bytes: 33554432
              max_records: 1
            assertions:
            - test:
                test:
                  path: .
                  kind: object
              reason: Mapped input must be an object
            - test: {test: {path: latest.filed_at, kind: truthy}}
              reason: missing_provisional_file_date
            tables:
              mapped:
                each: .
                columns:
                  fields:
                    object:
                      fields:
                        name: {value: {path: latest.name, type: text, null_if_blank: true}}
                  matching:
                    object:
                      fields: {}
          input_fields:
          - crd
          - latest
          - first_filed_at
        version: sec-ncen-adviser-2026-11-14.crd
        retain_deferred: true
        source_record_provenance: true
        kind: company
        effective_at: latest.filed_at
        record_key:
        - crd
        # The CRD joins the adviser's Form ADV Company (crd-v2 compares it
        # without N-CEN's leading zeros), or creates it. The LEI an adviser
        # reports is lookup only, as Form ADV's is (operator, 2026-10-09:
        # "Keep LEI, lookup only (Recommended)").
        identifiers:
          crd: crd
        cross_references:
          ncen_adviser_lei: latest.lei
        cross_reference_formats:
          ncen_adviser_lei: lei
        # The adviser role from its first filing in the quarter, so every link
        # the quarter's series state falls inside it.
        profiles:
        - role: adviser
          authority: SEC EDGAR
          registration: crd
          valid_from: first_filed_at
