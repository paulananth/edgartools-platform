pass:
  name: crds
  readings: {advisers: {all: source.yaml}}
# Each adviser (CRD) of the quarter's N-CEN rows, with how many rows name it.
# Pin canonical JSON of this file as the source.combine contract.
execution:
  profile: source.combine
reduce:
  # Profiling, four quarters: 23,859 rows, 1,495 advisers.
  max_rows: 1000000
  max_input_bytes: 1073741824
  max_state_bytes: 268435456
  max_keys: 1000000
  max_members: 1000000
  max_output_rows: 1000000
  max_output_bytes: 268435456
  groups:
    crds:
      source: advisers
      table: adviser
      keys: [crd]
      mode: count
      count: rows
      sample: null
      sample_limit: 0
