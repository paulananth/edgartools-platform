pass:
  pieces: {step: combine.yaml}
# Each adviser row of combine.yaml's output as one record (`record`), for
# mdm.prepare (`record_column: record`). N-CEN writes a filing date as
# day, month and year; sec.nport.registrant/submissions.yaml gives it as
# "YYYY MM DD", turned here into an instant.
execution: {profile: source.read, workers: 1, max_artifacts: 1}
read:
  format: json
  limits: {max_bytes: 16777216, max_records: 1000000}
  tables:
    adviser:
      each: tables.adviser
      columns:
        record:
          object:
            fields:
              crd: {value: {path: crd}}
              latest: {value: {path: latest}}
              filed_at:
                choose:
                  condition: {test: {path: latest.filed, kind: truthy}}
                  then:
                    concat:
                    - text: {path: latest.filed, transforms: [{regex_replace: {pattern: ' ', with: '-'}}]}
                    - const: {value: 'T00:00:00+00:00'}
                  else: {const: {value: null}}
              first_filed_at:
                choose:
                  condition: {test: {path: first_filed, kind: truthy}}
                  then:
                    concat:
                    - text: {path: first_filed, transforms: [{regex_replace: {pattern: ' ', with: '-'}}]}
                    - const: {value: 'T00:00:00+00:00'}
                  else: {const: {value: null}}
