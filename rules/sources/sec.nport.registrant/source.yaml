# SEC Form N-PORT registrants, read for the Company master (ticket 79, part 2),
# from the approved N-PORT findings (profiling/sec.nport-2026q2-final,
# approved 2026-10-15 06:29 ET; part REGISTRANT.CIK, master by CIK: 1,947
# registrants over 14,416 filings). Rulings it rests on (operator):
# - "Registrant yes, issuer later (Recommended)" (2026-10-14): the registrant
#   joins the Company master by CIK; each Fund links to it (part 3).
# - "agreed" (2026-10-15), to: when a registrant's CIK is not yet a Company,
#   the N-PORT registrant creates it. Evidence: all 1,947 CIKs are SEC filers,
#   but SEC's own Company record sets about 1,945 aside (1,251 typed
#   "investment", 688 "other" with no category), so none would exist.
# The run, in order: submissions.yaml gives the pair set `filed` (filing to
# its date); this reading streams REGISTRANT.tsv once, one row per filing,
# with its date; reduce.yaml lists each CIK; combine.yaml keeps each CIK's
# latest filing whole (by date, then accession number), so a name and an address
# never mix two filings; record.yaml makes each `registrant` row one record; mdm.prepare,
# the merge and the processed record follow (the `mastering` target below).
# Left out: the phone number (personal, profiling). An LEI of all zeros is a
# stand-in for none (4 registrants, profiling) and is blank here.
source: sec.nport.registrant
catalog:
  pipelines:
    mastering:
      display_name: N-PORT registrants to Company
bronze:
  family: sec.nport-datasets
# The quarter's registrants through the Merge Stage (ticket 118): the filing
# dates, the registrant rows with them, each CIK, its latest filing, one record
# each. A bundle is the quarter's data set (one file).
bookkeeping:
  version: 2
  targets:
    mastering:
      steps:
        - name: submissions
          operation: source.read
          requires: []
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {each: file}
          input: {contract: submissions.yaml}
        - name: filings
          operation: source.read
          requires: [submissions]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {each: file}
          input:
            lookups:
              filed: {from: submissions, table: filed, column: accession_number, value_column: filed,
                      max_input_bytes: 67108864, max_input_rows: 1000000}
        - name: ciks
          operation: source.combine
          requires: [filings]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input: {contract: reduce.yaml, readings: {filings: {all: filings}}}
        - name: combine
          operation: source.combine
          requires: [ciks, filings]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input: {contract: combine.yaml, readings: {ciks: {step: ciks}, filings: {all: filings}}}
        - name: record
          operation: source.read
          requires: [combine]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          input: {contract: record.yaml, pieces: {step: combine}}
        - name: prepare
          operation: mdm.prepare
          requires: [record]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, mdm.prepared]
          input:
            keys: {table: registrant, record_column: record, dataset: sec.nport.registrant.v2}
            readings: {record: {all: record}}
        - name: merge
          operation: mastering.merge
          requires: [prepare]
          key: "{batch_id}"
          leases: ["mdm:consumer:{consumer}"]
          checks: [input.hash, output.receipt, mdm.committed]
        - name: processed
          operation: journal.record
          requires: [merge]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, journal.recorded]
      checks: [manifest.hash, work.accounting, journal.delivered]
execution:
  profile: source.read
  workers: 1
  max_artifacts: 1
read:
  format: json
  limits:
    max_bytes: 1048576
    max_records: 1
  lookup_sets:
    filed:
      max_values: 1000000
      max_bytes: 67108864
      max_value_bytes: 64
      pairs: true
  tables:
    filing:
      each: .
      columns:
        cik: {text: {path: CIK}}
        accession_number: {text: {path: ACCESSION_NUMBER}}
        filed:
          member_value: {lookup: filed, key: {text: {path: ACCESSION_NUMBER}}, on_many: error}
        name: {text: {path: REGISTRANT_NAME, default: "", null_if: [""]}}
        file_number: {text: {path: FILE_NUM, default: "", null_if: [""]}}
        lei:
          text:
            path: LEI
            default: ""
            transforms:
            - {case: upper}
            null_if: ["", "00000000000000000000"]
        street: {text: {path: ADDRESS1, default: "", null_if: [""]}}
        # "NULL" written as the second address line (79 filings, profiling).
        street2: {text: {path: ADDRESS2, default: "", null_if: ["", "NULL"]}}
        city: {text: {path: CITY, default: "", null_if: [""]}}
        region: {text: {path: STATE, default: "", null_if: [""]}}
        postcode: {text: {path: ZIP, default: "", null_if: [""]}}
        country: {text: {path: COUNTRY, default: "", null_if: [""]}}
  stream:
    framing: delimited
    delimited: {format: tsv, encoding: utf-8}
    container: zip
    member: REGISTRANT.tsv
    # Profiling, 2026q2: 14,416 rows.
    max_input_bytes: 1000000000
    max_bytes: 100000000
    max_record: 1048576
    max_records: 1000000
    max_depth: 64
    ordinal_context: null
    partition_bytes: 8388608
    partition_records: 100000
    max_partitions: 1000
    max_spool_bytes: 1073741824
    max_output_rows: 1000000
dataset_contracts:
  sec.nport.registrant.v2:
    contract:
      provider: SEC
      family: sec.nport-datasets
      schema_version: sec-nport-registrant-v1
      record_key: the registrant's CIK; one record per CIK over the quarter, from its latest filing
      publication_key: the quarter's N-PORT data set file and the reduction and combine contracts
      effective_time: the latest filing date as an observation, not incorporation or registration inception
      semantics: patch
      completeness: the registrants of one quarter's N-PORT filings; no retirement by absence
      nonblocking_deferred_reasons:
      - missing_record_identity
      - missing_provisional_file_date
      - invalid_time
      adapter:
        reading:
          source: sec.nport.registrant
          read:
            format: json
            limits:
              max_bytes: 33554432
              max_records: 1
            assertions:
            - test:
                test:
                  path: .
                  kind: object
              reason: Mapped input must be an object
            - test: {test: {path: filed_at, kind: truthy}}
              reason: missing_provisional_file_date
            - test: {test: {path: profile_start, kind: truthy}}
              reason: missing_provisional_file_date
            tables:
              mapped:
                each: .
                columns:
                  fields:
                    object:
                      fields:
                        name: {value: {path: latest.name, type: text, null_if_blank: true}}
                        address:
                          object:
                            fields:
                              street: {value: {path: latest.street, type: text, trim: true, null_if_blank: true}}
                              street2: {value: {path: latest.street2, type: text, trim: true, null_if_blank: true}}
                              city: {value: {path: latest.city, type: text, trim: true, null_if_blank: true}}
                              region: {value: {path: latest.region, type: text, trim: true, null_if_blank: true}}
                              postcode: {value: {path: latest.postcode, type: text, trim: true, null_if_blank: true}}
                              country: {value: {path: latest.country, type: text, trim: true, null_if_blank: true}}
                            omit_nulls: true
                            null_if_empty: true
                  matching:
                    object:
                      fields:
                        registration_start_date_basis: {value: {path: date_basis, type: text}}
          input_fields:
          - cik
          - latest
          - first
          - filed_at
          - profile_start
          - date_basis
          - date_is_provisional
        version: sec-nport-registrant-2026-11-10.lei-searched
        retain_deferred: true
        source_record_provenance: true
        kind: company
        effective_at: filed_at
        record_key:
        - cik
        record_key_format: sec_cik
        # CIK joins the one Company holding it, or creates it (operator,
        # 2026-10-15: "agreed"). The LEI the registrant states is searched
        # like any source's identifier (operator, 2026-11-10: "Master it
        # ;consider it a source", reversing the "lookup only" of 2026-09-26):
        # it finds the Company that holds it and is held by the Company it
        # joins. A registrant whose LEI fails its check digits is still
        # mastered by its CIK; the bad value is set aside and flagged. The
        # SEC file number (811-) stays a cross-reference.
        identifiers:
          cik: cik
          lei: latest.lei
        identifier_formats:
          cik: sec_cik
          lei: lei
        set_aside_invalid: [lei]
        cross_references:
          sec_file_number: latest.file_number
        # N-PORT establishes the registrant's fund role. Its earliest retained
        # filing is a provisional observation, not the true registration start.
        profiles:
        - role: fund
          authority: SEC EDGAR
          registration: cik
          valid_from: profile_start
          fields:
            source_start_date_basis: date_basis
            source_start_date_is_provisional: date_is_provisional
