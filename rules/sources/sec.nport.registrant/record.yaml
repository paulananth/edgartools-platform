# Each registrant row of combine.yaml's output as one record (`record`), read
# over the combine's pieces, for mdm.prepare (`record_column: record`): the
# record is the row itself, as the Dataset Contract reads it (ticket 118).
execution: {profile: source.read, workers: 1, max_artifacts: 1}
read:
  format: json
  limits: {max_bytes: 16777216, max_records: 1000000}
  tables:
    registrant:
      each: tables.registrant
      columns:
        record:
          object:
            fields:
              cik: {value: {path: cik}}
              latest: {value: {path: latest}}
              first: {value: {path: first}}
              filed_at:
                choose:
                  condition: {test: {path: latest.filed, kind: truthy}}
                  then:
                    concat:
                    - text: {path: latest.filed, transforms: [{regex_replace: {pattern: ' ', with: '-'}}]}
                    - const: {value: 'T00:00:00+00:00'}
                  else: {const: {value: null}}
              profile_start:
                choose:
                  condition: {test: {path: first.filed, kind: truthy}}
                  then:
                    concat:
                    - text: {path: first.filed, transforms: [{regex_replace: {pattern: ' ', with: '-'}}]}
                    - const: {value: 'T00:00:00+00:00'}
                  else: {const: {value: null}}
              date_basis: {const: {value: observed}}
              date_is_provisional: {const: {value: true}}
