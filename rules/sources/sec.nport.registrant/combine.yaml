pass:
  readings: {filings: {all: source.yaml}}
# Each filing's CIK with that CIK's first and latest filing whole (`latest`: name, file number, LEI and address of
# one filing), first and latest by filing date, then accession number; the filing's own columns
# are dropped, so every filing of a CIK gives the same row and mdm.prepare keeps one per CIK. Input: source.yaml's
# reading (`filings`). Pin canonical JSON of this file as the source.combine contract.
execution:
  profile: source.combine
combine:
  max_rows: 1000000
  groups:
    first_filing: {source: filings, table: filing, key: cik, value: ., mode: first, order_by: [filed, accession_number], distinct: false, skip_null_values: true, checks: {}, where: {}}
    latest_filing: {source: filings, table: filing, key: cik, value: ., mode: last, order_by: [filed, accession_number], distinct: false, skip_null_values: true, checks: {}, where: {}}
  tables:
    registrant:
      source: filings
      table: filing
      checks: {}
      where: {}
      joins:
        first: {group: first_filing, key: cik, on_missing: error, replace: false}
        latest: {group: latest_filing, key: cik, on_missing: error, replace: false}
      drop: [accession_number, filed, filed_at, date_basis, date_is_provisional, name, file_number, lei, street, street2, city, region, postcode, country]
