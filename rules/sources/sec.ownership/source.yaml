# SEC insider ownership filings (Forms 3, 4 and 5), drafted from the profiling
# findings approved by the operator on 2026-10-12 (`.scratch/profiling/trials/
# readers/ownership/cohort/findings.yaml`; profiling ticket 07). This file names the
# source; it reads nothing itself. Each filing is read by one of two readings, by
# the shape it was captured in, both with the same tables and columns:
#   ownership-xml.yaml: the filing's primary document, bare XML (the accession number
#     from the capture's path, given by the caller);
#   ownership-sgml.yaml: the SGML submission file (the accession number from its header).
# The issuer is the existing Company (by CIK); the owner is master data, a Person
# or Company (by CIK), and the owner on a filing is a relationship onboarded
# with both masters (operator, 2026-10-12, "approved"). The owner's Dataset
# Contract is below (profiling ticket 07, 2026-10-13); the transaction tables'
# silver specs and a Bookkeeping target come in a later change. Its bronze
# family is named with its capture: today's local copies sit in two (the cohort's
# primary documents and the filing_artifact submission files).
source: sec.ownership
execution: {profile: source.read, workers: 1, max_artifacts: 512}
bronze:
  # Bronze: filing_artifact/sec/cik=<issuer>/<accession_number>/<accession_number>.txt (the SGML
  # submission file); the cohort's bare primary documents sit under filings/.
  family: filing_artifact
# Bookkeeping (ticket 176): read the SEC submission files, master each reporting owner (a Person, or a
# Company by its CIK), then land the owners and the lines in silver once the merge has made the masters
# their rows link to, and record each file in the Change Journal. Landing waits for the merge, not for
# the owners' rows alone, so a new owner's Person id is there when its silver row lands.
bookkeeping:
  version: 2
  targets:
    mastering:
      steps:
        - name: read
          operation: source.read
          requires: []
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {slices: {bytes: 8388608}}
          input: {contract: ownership-sgml.yaml, files: "*.txt"}
        - name: prepare
          operation: mdm.prepare
          requires: [read]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, mdm.prepared]
          input:
            keys: {table: owner_record, record_column: record, dataset: sec.ownership.reporting_owner.v1}
            readings: {read: {all: read}}
        - name: merge
          operation: mdm.merge
          requires: [prepare]
          key: "{batch_id}"
          leases: ["mdm:consumer:{consumer}"]
          checks: [input.hash, output.receipt, mdm.committed]
        - name: land_owner
          operation: silver.land
          requires: [read, merge]
          key: "{unit}"
          leases: ["silver:{silver}"]
          checks: [input.hash, output.receipt, silver.landed]
          input: {keys: {table: reporting_owner, silver: insider_ownership}}
        - name: land_nd_transaction
          operation: silver.land
          requires: [read, merge]
          key: "{unit}"
          leases: ["silver:{silver}"]
          checks: [input.hash, output.receipt, silver.landed]
          input: {keys: {table: non_derivative_transaction, silver: insider_position}}
        - name: land_nd_holding
          operation: silver.land
          requires: [read, merge]
          key: "{unit}"
          leases: ["silver:{silver}"]
          checks: [input.hash, output.receipt, silver.landed]
          input: {keys: {table: non_derivative_holding, silver: insider_position}}
        - name: land_d_transaction
          operation: silver.land
          requires: [read, merge]
          key: "{unit}"
          leases: ["silver:{silver}"]
          checks: [input.hash, output.receipt, silver.landed]
          input: {keys: {table: derivative_transaction, silver: insider_position}}
        - name: land_d_holding
          operation: silver.land
          requires: [read, merge]
          key: "{unit}"
          leases: ["silver:{silver}"]
          checks: [input.hash, output.receipt, silver.landed]
          input: {keys: {table: derivative_holding, silver: insider_position}}
        - name: processed
          operation: journal.record
          requires: [land_owner, land_nd_transaction, land_nd_holding, land_d_transaction, land_d_holding]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, journal.recorded]
      checks: [manifest.hash, work.accounting, journal.delivered]
dataset_contracts:
  sec.ownership.reporting_owner.v1:
    contract:
      provider: SEC
      family: filing_artifact
      schema_version: sec-ownership-reporting-owner-v1
      record_key: one reporting owner on one filing (accession number, the owner's CIK); each
        filing is its own record (mastering-to-done 02, D3), so its capacities are a dated
        sighting
      publication_key: the filing's accession number
      effective_time: the filing's period of report (the event date)
      semantics: patch
      completeness: the owners one filing names; no retirement by absence
      # The ownership feed masters its own owners (operator, 2026-10-13 20:30 ET,
      # "Create its own (Recommended)"), first only the owners a filing proves are
      # people: a person-shaped name the filing names a director or officer (operator,
      # 2026-10-13, "Persons by role first (Recommended)"). Every other owner is held
      # back and never stops the run: the submissions feeds master it by the same CIK.
      nonblocking_deferred_reasons:
      - classification_deferred
      - classification_entity_undetermined
      - quality_legal_name_present
      - quality_legal_name_has_letter
      # A CIK that is not one, or none, sets the record aside and never stops
      # the run (rebuild ticket 10; operator, 2026-10-02, "Proposed set").
      - invalid_cik
      - missing_record_identity
      # A link with no issuer, or no date or one that is not a date (ticket 10):
      # the filing waits, the run goes on.
      - relationship_end_missing
      - invalid_relationship_interval
      - invalid_time
      adapter:
        # The owner's name, as the filing states it: blank text is no value. The
        # owner's address is never captured into MDM for a reporting owner (Person
        # consumer spec, The Person projection).
        reading:
          source: sec.ownership
          read:
            format: json
            limits: {max_bytes: 33554432, max_records: 1}
            assertions:
            - test: {test: {path: ., kind: object}}
              reason: Mapped input must be an object
            tables:
              mapped:
                each: .
                columns:
                  fields:
                    object:
                      fields:
                        legal_name: {value: {path: rpt_owner_name, path_mode: literal, type: text, null_if_blank: true}}
                  matching:
                    object:
                      fields: {}
        version: sec-ownership-reporting-owner-v1
        retain_deferred: true
        source_record_provenance: true
        record_key:
        - accession_number
        - rpt_owner_cik
        classification:
          kind: person
          rule_id: sec-ownership-person
          version: 2026-10-13.1
        identifiers:
          cik: rpt_owner_cik
        identifier_formats:
          cik: sec_cik
        # The owner's capacities at the issuer, restated on every filing: each filing
        # is a dated sighting (held, or dropped), and the Merge Stage folds them into
        # periods. The issuer is the Company mastered from its submissions document.
        relationships:
        - type: EMPLOYED_BY
          capacity: director
          target_key: [issuer_cik]
          target_source: sec.company.v1
          on: period_of_report
          held: is_director
          time_format: date
          ends: {reason: relationship_end_missing}
          interval: {reason: invalid_relationship_interval}
          scope: SEC ownership
        - type: EMPLOYED_BY
          capacity: officer
          target_key: [issuer_cik]
          target_source: sec.company.v1
          on: period_of_report
          held: is_officer
          title: officer_title
          time_format: date
          ends: {reason: relationship_end_missing}
          interval: {reason: invalid_relationship_interval}
          scope: SEC ownership
        - type: BENEFICIAL_OWNER_OF
          capacity: ten_percent_owner
          target_key: [issuer_cik]
          target_source: sec.company.v1
          on: period_of_report
          held: is_ten_percent_owner
          time_format: date
          ends: {reason: relationship_end_missing}
          interval: {reason: invalid_relationship_interval}
          scope: SEC ownership
