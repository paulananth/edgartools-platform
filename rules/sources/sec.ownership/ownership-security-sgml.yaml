# The issuer and trading symbol of a Form 3, 4 or 5 inside the SEC's SGML submission file
# (ticket 24), for the Dataset Contract sec.ownership.security.v1: one row per filing, read apart
# from the lines because a target prepares one publication and this one needs two fields. The
# symbol keeps letters and digits (a class ticker is written BRK/B, BRK-B or BRK.B) and a filed
# "NONE" or "N/A" is no symbol. The root, the accession number and the limits are
# ownership-sgml.yaml's (a test holds them equal).
source: sec.ownership
execution: {profile: source.read, workers: 1, max_artifacts: 512}
read:
  format: xml
  container: sgml
  root: ownershipDocument
  context:
    accession_number: {type: text, sgml_header: ACCESSION NUMBER}
  limits: {max_bytes: 33554432, max_member_bytes: 33554432, max_records: 100000}
  tables:
    security_record:
      each: .
      columns:
        record:
          object:
            fields:
              accession_number: {context: {name: accession_number}}
              issuer_cik: {text: {path: issuer.issuerCik.$}}
              symbol:
                text:
                  path: issuer.issuerTradingSymbol.$
                  transforms:
                  - {case: upper}
                  - {regex_replace: {pattern: '^(NONE|N/A|N\.A\.|NOT APPLICABLE)$', with: ''}}
                  - {regex_replace: {pattern: '[^A-Z0-9]', with: ''}}
                  null_if: [""]
