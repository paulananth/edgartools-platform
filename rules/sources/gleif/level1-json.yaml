# Qualification template; fill approved_scope from an approved immutable cohort.
# This does not activate a Dataset, source Rules or a mastering policy.
source: gleif.level1
execution: {profile: source.read, workers: 1, max_artifacts: 1}
read:
  format: json
  limits: {max_bytes: 1048576, max_records: 100}
  context:
    source_index: {type: integer}
    publication_count: {type: integer}
  references:
    approved_scope: {}  # LEI: {selected: true}; never infer scope from this file.
  # The LEIs an N-PORT holding names as its issuer (ticket 22), supplied with the
  # input as a lookup receipt (tens of thousands: too many for a reference in
  # the contract, which is read within 1 MiB); an empty set flags no record.
  lookup_sets:
    nport_issuers: {max_values: 10000000, max_bytes: 268435456, max_value_bytes: 64}
  tables:
    level1:
      each: '.'
      select:
        lookup:
          reference: approved_scope
          column: selected
          key: {text: {path: LEI.$}}
          on_missing: 'null'
      columns:
        record: {value: {path: '.'}}
        # Carried into the record by mdm.prepare's record_extras (ticket 97).
        nport_issuer:
          choose:
            condition: {member: {lookup: nport_issuers, key: {text: {path: LEI.$}}}}
            then: {const: {value: true}}
            else: {value: {path: NO_SUCH_FIELD}}
        source_index: {context: {name: source_index}}
  stream:
    wrapper: records
    container: zip
    max_input_bytes: 1073741824
    max_bytes: 17179869184
    max_record: 1048576
    max_records: 10000000
    max_depth: 64
    min_integer: -9223372036854775807
    record_encoding: python
    ordinal_context: source_index
    expected_records_context: publication_count
    partition_bytes: 8388608
    partition_records: 100000
    max_partitions: 4096
    max_spool_bytes: 1073741824
    max_output_rows: 100000

# Full-source attestation covers every record, independent of mastering scope.
attestation:
  table: level1
  record_column: record
  ordinal_column: source_index
