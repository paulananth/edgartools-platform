# Read only after a legal name matches the wanted census population.
source: gleif.level1
execution:
  profile: source.read
  workers: 1
  max_artifacts: 1
read:
  format: json
  limits:
    max_bytes: 1048576
    max_records: 100000
  tables:
    mapped:
      each: .
      columns:
        updated:
          object:
            fields:
              value:
                choose:
                  condition:
                    test:
                      path: Registration
                      kind: object
                  then:
                    choose:
                      condition:
                        test:
                          path: Registration.LastUpdateDate
                          kind: object
                      then:
                        choose:
                          condition:
                            test:
                              path: Registration.LastUpdateDate.$
                              kind: text
                          then:
                            value:
                              path: Registration.LastUpdateDate.$
                              type: text
                              trim: true
                              null_if_blank: true
                          else:
                            const:
                              value: null
                      else:
                        choose:
                          condition:
                            test:
                              path: Registration.LastUpdateDate
                              kind: text
                          then:
                            value:
                              path: Registration.LastUpdateDate
                              type: text
                              trim: true
                              null_if_blank: true
                          else:
                            const:
                              value: null
                  else:
                    choose:
                      condition:
                        test:
                          path: Registration
                          kind: truthy
                      then:
                        value:
                          path: Registration
                          type: object
                      else:
                        const:
                          value: null
