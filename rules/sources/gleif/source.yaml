# GLEIF: the MDM mappings of the three native Golden Copy members, one Dataset
# Contract each. Native archive reading and mapped values use bundled
# configuration. Publication checks live in gleif_publication.py;
# field ranks live in the merge rules, not here.
source: gleif
bookkeeping:
  version: 1
  targets:
    mdm:
      steps:
        - name: merge
          operation: mdm.merge
          requires: []
          key: "{batch_id}"
          leases: ["mdm:consumer:{consumer}"]
          checks: [input.hash, output.receipt, mdm.committed]
      checks: [manifest.hash, work.accounting, journal.delivered]
bronze:
  family: gleif
mdm:
  gleif.level1.v1:
    contract:
      provider: GLEIF
      # quality_name_present: a data quality exception never stops the run
      # (operator, 2026-09-28). invalid_lei, invalid_lei_checksum: an LEI
      # that fails its format can never be one of our Companies (the Company
      # scope is checked when a release is validated), so it never stops the
      # run (ticket 18, operator 2026-09-29; the same for all three members).
      nonblocking_deferred_reasons:
      - outside_approved_company_scope
      - unsupported_identity_kind
      - reported_parent_exception
      - invalid_lei
      - invalid_lei_checksum
      - quality_name_present
      family: gleif
      schema_version: gleif-native-record-v1
      publication_families:
      - golden_copy
      record_key: native LEI or composite source key
      publication_key: verified GLEIF release
      effective_time: LastUpdateDate or unknown
      semantics: patch; absence never retires an identity
      adapter:
        reading:
          source: gleif
          read:
            format: json
            limits:
              max_bytes: 33554432
              max_records: 1
            assertions:
            - test:
                test:
                  path: .
                  kind: object
              reason: Mapped input must be an object
            tables:
              mapped:
                each: .
                checks:
                # The checks the older reader made before mapping (`gleif_source.record_evidence`, retired in Issue 20 L6), in its
                # order, now the contract's own (L6; operator, 2026-10-10: refusals live in the MDM
                # contract). A record a check sets aside defers in the Stage with that reason.
                - check: lei
                  column: _lei
                  on_fail: defer
                # GLEIF flags a deletion in delta files only; in a full file the field is present and empty
                # on 4% of reporting exceptions (ticket 18). A flag with a value blocks until someone decides.
                - check: absent
                  column: _deletion
                  reason: gleif_deletion_flag
                  on_fail: defer
                # GLEIF's categories; one outside them is invalid, not "not a Company".
                - check: in_set
                  column: _category
                  values: [GENERAL, BRANCH, FUND, SOLE_PROPRIETOR, INTERNATIONAL_ORGANIZATION, RESIDENT_GOVERNMENT_ENTITY]
                  reason: invalid_identity_kind
                  on_fail: defer
                columns:
                  _lei:
                    value:
                      path: LEI.$
                      type: text
                      path_mode: literal
                  _deletion:
                    # The older reader read a non-object Extension as the flag itself (operator, 2026-10-10:
                    # keep failing closed): an object holds the flag, anything else is it.
                    choose:
                      condition:
                        test:
                          path: Extension
                          kind: object
                      then:
                        value:
                          path: Extension.gleif:Deletion
                          path_mode: literal
                      else:
                        value:
                          path: Extension
                          path_mode: literal
                  _category:
                    value:
                      path: Entity.EntityCategory.$
                      type: text
                      path_mode: literal
                  # `name` is shared with SEC, SEC first where both supply it.
                  # `jurisdiction` is GLEIF's alone (operator, 2026-09-24).
                  fields:
                    object:
                      fields:
                        name:
                          value:
                            path: Entity.LegalName.$
                            null_if_blank: true
                            type: text
                            path_mode: literal
                        address:
                          object:
                            fields:
                              street:
                                value:
                                  path: Entity.LegalAddress.FirstAddressLine.$
                                  type: text
                                  trim: true
                                  null_if_blank: true
                                  path_mode: literal
                              street2:
                                join:
                                  path: Entity.LegalAddress.AdditionalAddressLine
                                  item_path: $
                                  item_type: object
                                  separator: '

                                    '
                                  trim: true
                                  skip_empty: true
                                  null_if_empty: true
                                  max_items: 100000
                                  path_mode: literal
                              city:
                                value:
                                  path: Entity.LegalAddress.City.$
                                  type: text
                                  trim: true
                                  null_if_blank: true
                                  path_mode: literal
                              region:
                                value:
                                  path: Entity.LegalAddress.Region.$
                                  type: text
                                  trim: true
                                  null_if_blank: true
                                  path_mode: literal
                              postcode:
                                value:
                                  path: Entity.LegalAddress.PostalCode.$
                                  type: text
                                  trim: true
                                  null_if_blank: true
                                  path_mode: literal
                              country:
                                value:
                                  path: Entity.LegalAddress.Country.$
                                  type: text
                                  trim: true
                                  null_if_blank: true
                                  path_mode: literal
                            omit_nulls: true
                            null_if_empty: true
                        jurisdiction:
                          value:
                            path: Entity.LegalJurisdiction.$
                            null_if_blank: true
                            type: text
                            path_mode: literal
                        gleif_legal_form:
                          value:
                            path: Entity.LegalForm.EntityLegalFormCode.$
                            null_if_blank: true
                            type: text
                            path_mode: literal
                        gleif_entity_status:
                          value:
                            path: Entity.EntityStatus.$
                            null_if_blank: true
                            type: text
                            path_mode: literal
                        gleif_registration_status:
                          value:
                            path: Registration.RegistrationStatus.$
                            null_if_blank: true
                            type: text
                            path_mode: literal
                        gleif_initial_registration:
                          value:
                            path: Registration.InitialRegistrationDate.$
                            null_if_blank: true
                            type: text
                            path_mode: literal
                        gleif_last_update:
                          value:
                            path: Registration.LastUpdateDate.$
                            null_if_blank: true
                            type: text
                            path_mode: literal
                        gleif_next_renewal:
                          value:
                            path: Registration.NextRenewalDate.$
                            null_if_blank: true
                            type: text
                            path_mode: literal
                        gleif_managing_lou:
                          value:
                            path: Registration.ManagingLOU.$
                            null_if_blank: true
                            type: text
                            path_mode: literal
                        gleif_validation_source:
                          value:
                            path: Registration.ValidationSources.$
                            null_if_blank: true
                            type: text
                            path_mode: literal
                        gleif_registration_authority:
                          value:
                            path: Entity.RegistrationAuthority.RegistrationAuthorityID.$
                            null_if_blank: true
                            type: text
                            path_mode: literal
                        gleif_registration_authority_entity_id:
                          value:
                            path: Entity.RegistrationAuthority.RegistrationAuthorityEntityID.$
                            null_if_blank: true
                            type: text
                            path_mode: literal
                        gleif_entity_creation_date:
                          value:
                            path: Entity.EntityCreationDate.$
                            null_if_blank: true
                            type: text
                            path_mode: literal
                  matching:
                    object:
                      # The matching values every record has, kept as they were (nulls too), and
                      # `nport_issuer` beside them only when set: true when an N-PORT holding names
                      # this LEI as its issuer (the Level 1 reading's column, carried in by
                      # mdm.prepare's record_extras, ticket 97); the issuer LEI rule tests it.
                      base:
                        object:
                          fields:
                            headquarters_postal_code:
                              value:
                                path: Entity.HeadquartersAddress.PostalCode.$
                                path_mode: literal
                            headquarters_country:
                              value:
                                path: Entity.HeadquartersAddress.Country.$
                                path_mode: literal
                            # The whole headquarters address, for matching only (ticket 22): the
                            # legal address is often a registered agent's, and the headquarters
                            # address then is the company's own (108,392 of 124,830 such LEIs).
                            headquarters_address:
                              object:
                                fields:
                                  street:
                                    value:
                                      path: Entity.HeadquartersAddress.FirstAddressLine.$
                                      type: text
                                      trim: true
                                      null_if_blank: true
                                      path_mode: literal
                                  street2:
                                    join:
                                      path: Entity.HeadquartersAddress.AdditionalAddressLine
                                      item_path: $
                                      item_type: object
                                      separator: '

                                        '
                                      trim: true
                                      skip_empty: true
                                      null_if_empty: true
                                      max_items: 100000
                                      path_mode: literal
                                  city:
                                    value:
                                      path: Entity.HeadquartersAddress.City.$
                                      type: text
                                      trim: true
                                      null_if_blank: true
                                      path_mode: literal
                                  region:
                                    value:
                                      path: Entity.HeadquartersAddress.Region.$
                                      type: text
                                      trim: true
                                      null_if_blank: true
                                      path_mode: literal
                                  postcode:
                                    value:
                                      path: Entity.HeadquartersAddress.PostalCode.$
                                      type: text
                                      trim: true
                                      null_if_blank: true
                                      path_mode: literal
                                  country:
                                    value:
                                      path: Entity.HeadquartersAddress.Country.$
                                      type: text
                                      trim: true
                                      null_if_blank: true
                                      path_mode: literal
                                omit_nulls: true
                                null_if_empty: true
                      fields:
                        nport_issuer:
                          value:
                            path: nport_issuer
                            path_mode: literal
                      omit_nulls: true
        version: gleif-native-record-v1
        native_member: level1
        retain_deferred: true
        source_record_provenance: true
        # The record as GLEIF published it, and the time it states for itself
        # (L6: what the older reader kept and stamped, now the contract's own).
        provenance:
          native_record: .
        effective_at: Registration.LastUpdateDate.$
        kind_field: Entity.EntityCategory.$
        kind_values:
          GENERAL: company
        # What a record in each other GLEIF category probably is, so the Stage can
        # sort it; none of these creates an identity. A sole proprietor is left
        # unnamed: it is not settled as Person.
        probable_kind_values:
          FUND: fund_structure
          BRANCH: branch
          RESIDENT_GOVERNMENT_ENTITY: government
          INTERNATIONAL_ORGANIZATION: international_organization
        record_key:
        - LEI.$
        record_key_format: lei
        identifiers:
          lei: LEI.$
        identifier_formats:
          lei: lei
        relationships:
        # GLEIF's SuccessorEntity (profiling ticket 04c): one link per
        # successor LEI (a demerger lists several; a successor named only, with
        # no LEI, makes none), dated by the completed succession event that
        # names it (operator, 2026-10-07: succession types only). Without one,
        # MDM starts the link when it was first seen (operator, same day).
        - type: SUCCESSOR_ENTITY
          each: Entity.SuccessorEntity
          target_key:
          - item.SuccessorLEI.$
          target_source: gleif.level1.v1
          find:
            event:
              in: Entity.LegalEntityEvents.LegalEntityEvent
              where:
                '@event_status': COMPLETED
                LegalEntityEventType.$: [MERGERS_AND_ACQUISITIONS, ABSORPTION, DEMERGER, BREAKUP, SPINOFF,
                                         ACQUISITION_BRANCH]
                AffectedFields.AffectedField.$: {path: item.SuccessorLEI.$}
          valid_from: event.LegalEntityEventEffectiveDate.$
          scope: GLEIF corporate action
          properties:
            source_event_type: event.LegalEntityEventType.$
            source_event_status: event.@event_status
            source_entity_status: Entity.EntityStatus.$
  gleif.relationships.v1:
    contract:
      provider: GLEIF
      nonblocking_deferred_reasons:
      - outside_approved_company_scope
      - unsupported_identity_kind
      - reported_parent_exception
      - invalid_lei
      - invalid_lei_checksum
      family: gleif
      schema_version: gleif-native-record-v1
      publication_families:
      - golden_copy
      record_key: native LEI or composite source key
      publication_key: verified GLEIF release
      effective_time: LastUpdateDate or unknown
      semantics: patch; absence never retires an identity
      adapter:
        reading:
          source: gleif
          read:
            format: json
            limits:
              max_bytes: 33554432
              max_records: 1
            assertions:
            - test:
                test:
                  path: .
                  kind: object
              reason: Mapped input must be an object
            tables:
              mapped:
                each: .
                checks:
                # The checks the older reader made before mapping (`gleif_source.record_evidence`, retired in Issue 20 L6), in its
                # order, now the contract's own (L6; operator, 2026-10-10: refusals live in the MDM contract).
                - check: lei
                  column: _start
                  on_fail: defer
                - check: lei
                  column: _end
                  on_fail: defer
                - check: in_set
                  column: _start_type
                  values: [LEI]
                  reason: unsupported_relationship_endpoint
                  on_fail: defer
                - check: in_set
                  column: _end_type
                  values: [LEI]
                  reason: unsupported_relationship_endpoint
                  on_fail: defer
                # A flag with a value blocks until someone decides (ticket 18).
                - check: absent
                  column: _deletion
                  reason: gleif_deletion_flag
                  on_fail: defer
                columns:
                  _start:
                    value:
                      path: RelationshipRecord.Relationship.StartNode.NodeID.$
                      type: text
                      path_mode: literal
                  _end:
                    value:
                      path: RelationshipRecord.Relationship.EndNode.NodeID.$
                      type: text
                      path_mode: literal
                  _start_type:
                    value:
                      path: RelationshipRecord.Relationship.StartNode.NodeIDType.$
                      type: text
                      path_mode: literal
                  _end_type:
                    value:
                      path: RelationshipRecord.Relationship.EndNode.NodeIDType.$
                      type: text
                      path_mode: literal
                  _deletion:
                    # The older reader read a non-object Extension as the flag itself (operator, 2026-10-10:
                    # keep failing closed): an object holds the flag, anything else is it.
                    choose:
                      condition:
                        test:
                          path: RelationshipRecord.Extension
                          kind: object
                      then:
                        value:
                          path: RelationshipRecord.Extension.gleif:Deletion
                          path_mode: literal
                      else:
                        value:
                          path: RelationshipRecord.Extension
                          path_mode: literal
                  fields:
                    object:
                      fields: {}
                  matching:
                    object:
                      fields: {}
        version: gleif-native-record-v1
        native_member: relationships
        retain_deferred: true
        source_record_provenance: true
        provenance:
          native_record: .
        kind: company
        # Read from the GLEIF record as published (L6: what the older reader built
        # first, now the contract's own paths, with the record's own time).
        effective_at: RelationshipRecord.Registration.LastUpdateDate.$
        record_key:
        - RelationshipRecord.Relationship.StartNode.NodeID.$
        - RelationshipRecord.Relationship.EndNode.NodeID.$
        - RelationshipRecord.Relationship.RelationshipType.$
        relationships:
        - type_field: RelationshipRecord.Relationship.RelationshipType.$
          type_values:
            IS_DIRECTLY_CONSOLIDATED_BY: IS_DIRECTLY_CONSOLIDATED_BY
            IS_ULTIMATELY_CONSOLIDATED_BY: IS_ULTIMATELY_CONSOLIDATED_BY
          # The link starts at the child's Level 1 record, not at this
          # relationship record (platform validation 06a).
          source_key:
          - RelationshipRecord.Relationship.StartNode.NodeID.$
          source_source: gleif.level1.v1
          target_key:
          - RelationshipRecord.Relationship.EndNode.NodeID.$
          target_source: gleif.level1.v1
          # GLEIF lists several periods; the relationship's own is the one
          # RELATIONSHIP_PERIOD, and a record with none or several waits.
          find:
            period:
              in: RelationshipRecord.Relationship.RelationshipPeriods.RelationshipPeriod
              where:
                PeriodType.$: RELATIONSHIP_PERIOD
              one: ambiguous_relationship_period
          valid_from: period.StartDate.$
          valid_to: period.EndDate.$
          time_format: instant
          interval:
            reason: invalid_relationship_interval
          status:
            path: RelationshipRecord.Relationship.RelationshipStatus.$
            values: [ACTIVE, INACTIVE]
            need_end: [INACTIVE]
            reason: invalid_relationship_status_interval
          scope: GLEIF accounting consolidation
          properties:
            source_relationship_status: RelationshipRecord.Relationship.RelationshipStatus.$
            source_registration_status: RelationshipRecord.Registration.RegistrationStatus.$
  gleif.reporting_exceptions.v1:
    contract:
      provider: GLEIF
      nonblocking_deferred_reasons:
      - outside_approved_company_scope
      - unsupported_identity_kind
      - reported_parent_exception
      - invalid_lei
      - invalid_lei_checksum
      family: gleif
      schema_version: gleif-native-record-v1
      publication_families:
      - golden_copy
      record_key: native LEI or composite source key
      publication_key: verified GLEIF release
      effective_time: LastUpdateDate or unknown
      semantics: patch; absence never retires an identity
      adapter:
        reading:
          source: gleif
          read:
            format: json
            limits:
              max_bytes: 33554432
              max_records: 1
            assertions:
            - test:
                test:
                  path: .
                  kind: object
              reason: Mapped input must be an object
            tables:
              mapped:
                each: .
                checks:
                # The checks the older reader made before mapping (`gleif_source.record_evidence`, retired in Issue 20 L6), in its
                # order, now the contract's own (L6; operator, 2026-10-10: refusals live in the MDM contract).
                - check: lei
                  column: _lei
                  on_fail: defer
                # A flag with a value blocks until someone decides (ticket 18).
                - check: absent
                  column: _deletion
                  reason: gleif_deletion_flag
                  on_fail: defer
                - check: in_set
                  column: _category
                  values: [DIRECT_ACCOUNTING_CONSOLIDATION_PARENT, ULTIMATE_ACCOUNTING_CONSOLIDATION_PARENT]
                  reason: unsupported_exception_category
                  on_fail: defer
                columns:
                  _lei:
                    value:
                      path: LEI.$
                      type: text
                      path_mode: literal
                  _deletion:
                    # The older reader read a non-object Extension as the flag itself (operator, 2026-10-10:
                    # keep failing closed): an object holds the flag, anything else is it.
                    choose:
                      condition:
                        test:
                          path: Extension
                          kind: object
                      then:
                        value:
                          path: Extension.gleif:Deletion
                          path_mode: literal
                      else:
                        value:
                          path: Extension
                          path_mode: literal
                  _category:
                    value:
                      path: ExceptionCategory.$
                      type: text
                      path_mode: literal
                  fields:
                    object:
                      fields: {}
                  matching:
                    object:
                      fields: {}
        version: gleif-native-record-v1
        native_member: reporting_exceptions
        retain_deferred: true
        source_record_provenance: true
        provenance:
          native_record: .
        # GLEIF's reasons for not reporting a parent (REPEX 2.1 ExceptionReasonEnum, with its
        # deprecated values); each must be one, and a record states at least one.
        every_in:
        - path: ExceptionReason
          item: $
          values: [NO_LEI, NATURAL_PERSONS, NON_CONSOLIDATING, NO_KNOWN_PERSON, NON_PUBLIC,
                   BINDING_LEGAL_COMMITMENTS, LEGAL_OBSTACLES, DISCLOSURE_DETRIMENTAL,
                   DETRIMENT_NOT_EXCLUDED, CONSENT_NOT_OBTAINED]
          missing: missing_exception_reason
          reason: invalid_exception_reason
        # An exception is retained source evidence, not a new Company binding or a
        # fabricated parent edge: every record waits with this reason.
        retained_as: reported_parent_exception
        kind: company
        record_key:
        - LEI.$
        - ExceptionCategory.$
