# Other names only, after identity eligibility and wanted legal-name timestamp.
source: gleif.level1
execution:
  profile: source.read
  workers: 1
  max_artifacts: 1
read:
  format: json
  limits:
    max_bytes: 1048576
    max_records: 100000
  tables:
    other:
      each:
        choose:
          condition:
            test:
              path: Entity
              kind: object
          then:
            choose:
              condition:
                test:
                  path: Entity.OtherEntityNames
                  kind: truthy
              then:
                choose:
                  condition:
                    test:
                      path: Entity.OtherEntityNames
                      kind: object
                  then:
                    values:
                      path: Entity.OtherEntityNames.OtherEntityName
                  else:
                    objects:
                      path: Entity.OtherEntityNames
              else:
                objects:
                  path: Entity.OtherEntityNames
                  on_invalid: empty
          else:
            objects:
              path: Entity
              on_invalid: empty
      columns:
        key:
          choose:
            condition:
              test:
                path: .
                kind: object
            then:
              choose:
                condition:
                  test:
                    path: $
                    kind: text
                then:
                  text:
                    path: $
                    coerce: python
                    trim: false
                    default: ''
                    transforms:
                    - unicode: nfkd
                    - strip_combining: true
                    - case: upper
                    - replace:
                        from: '&'
                        to: ' AND '
                    - regex_replace:
                        pattern: '[^A-Z0-9]+'
                        with: ' '
                    - trim: true
                    - pad:
                        left: ' '
                        right: ' '
                    - replace:
                        from: ' L L C '
                        to: ' LLC '
                    - replace:
                        from: ' L L P '
                        to: ' LLP '
                    - replace:
                        from: ' L P '
                        to: ' LP '
                    - replace:
                        from: ' P L C '
                        to: ' PLC '
                    - replace:
                        from: ' N V '
                        to: ' NV '
                    - replace:
                        from: ' S A '
                        to: ' SA '
                    - replace:
                        from: ' A G '
                        to: ' AG '
                    - replace:
                        from: ' S E '
                        to: ' SE '
                    - replace:
                        from: ' B V '
                        to: ' BV '
                    - replace:
                        from: ' CORPORATION '
                        to: ' CORP '
                    - replace:
                        from: ' INCORPORATED '
                        to: ' INC '
                    - replace:
                        from: ' COMPANY '
                        to: ' CO '
                    - replace:
                        from: ' LIMITED '
                        to: ' LTD '
                    - replace:
                        from: ' HOLDINGS '
                        to: ' HLDGS '
                    - replace:
                        from: ' INTERNATIONAL '
                        to: ' INTL '
                    - trim: true
                    - remove_prefix: 'THE '
                else:
                  const:
                    value: ''
            else:
              choose:
                condition:
                  test:
                    path: .
                    kind: text
                then:
