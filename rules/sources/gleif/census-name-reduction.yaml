# Name Frequency's GLEIF half, counted (ticket 148): each name key's legal holders
# (their count and the five smallest LEIs with each one's last update in source
# order) and its other-name holders who do not also hold it as their legal name.
# It reads the verified `census-complete-stream.yaml` reading, whose rows are
# only the names the SEC population holds; every table of it counts toward
# `max_rows` (measured 2026-10-09: 3,021,317 rows, 13,423 legal keys, 752 other).
execution:
  profile: source.combine
reduce:
  max_rows: 4000000
  max_input_bytes: 1073741824
  max_state_bytes: 67108864
  max_keys: 300000
  max_members: 1000000
  max_output_rows: 100000
  max_output_bytes: 33554432
  groups:
    legal:
      source: names
      table: a_legal
      keys: [key]
      mode: members
      member: lei
      last: updated
      last_null: ''
      count: count
      sample: holders
      sample_limit: 5
    other:
      source: names
      table: [b_other, c_transliterated]
      keys: [key]
      mode: members
      member: lei
      exclude: legal
      count: count
      sample: holders
      sample_limit: 5
