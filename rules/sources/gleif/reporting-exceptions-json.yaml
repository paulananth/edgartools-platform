# Qualification template: pin approved scope and captured publication metadata before use.
source: gleif.reporting_exceptions
execution:
  profile: source.read
  workers: 1
  max_artifacts: 1
read:
  format: json
  limits:
    max_bytes: 1048576
    max_records: 100
  context:
    source_index:
      type: integer
    publication_count:
      type: integer
  references:
    approved_scope: {}
  tables:
    reporting_exceptions:
      each: .
      select:
        lookup:
          reference: approved_scope
          column: selected
          key:
            text:
              path: LEI.$
              coerce: python
          on_missing: "null"
      columns:
        record:
          value:
            path: .
        source_index:
          context:
            name: source_index
  stream:
    wrapper: exceptions
    container: zip
    max_input_bytes: 1073741824
    max_bytes: 17179869184
    max_record: 1048576
    max_records: 10000000
    max_depth: 64
    min_integer: -9223372036854775807
    record_encoding: python
    ordinal_context: source_index
    expected_records_context: publication_count
    partition_bytes: 8388608
    partition_records: 100000
    max_partitions: 4096
    max_spool_bytes: 1073741824
    max_output_rows: 100000

# Full-source attestation covers every record, independent of mastering scope.
attestation:
  table: reporting_exceptions
  record_column: record
  ordinal_column: source_index
