pass:
  readings: {series: {step: reduce.yaml}, pairs: {step: lei-pairs.yaml}, filings: {all: source.yaml}}
# One row per fund series (table `fund`) with its latest filing whole
# (`latest`: name, LEI and registrant CIK of one filing), latest by filing
# date, then accession number, and its LEI (`lei`) only when the series files
# one LEI and no other series files it. Inputs:
# reduce.yaml's output (`series`), lei-pairs.yaml's output (`pairs`) and
# source.yaml's reading (`filings`). Pin canonical JSON
# of this file as the source.combine contract.
execution:
  profile: source.combine
combine:
  max_rows: 1000000
  groups:
    # One to one, so `one` never chooses; an empty LEI is never one to one
    # (a series filing none).
    lei_once: {source: pairs, table: pairs, key: series_id, value: lei_key, mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {lei_series: 1, series_leis: 1}}
    # The latest filing's own row id, as a column, so its advisers can join it
    # (advisers-combine.yaml): a join reads its key from the row it joins.
    latest_fund_id: {source: filings, table: filing, key: series_id, value: fund_id, mode: last, order_by: [filed, accession_number], distinct: false, skip_null_values: true, checks: {}, where: {}}
    latest_filing: {source: filings, table: filing, key: series_id, value: ., mode: last, order_by: [filed, accession_number], distinct: false, skip_null_values: true, checks: {}, where: {}}
  tables:
    fund:
      source: series
      table: series
      checks: {}
      where: {}
      joins:
        latest: {group: latest_filing, key: series_id, on_missing: error, replace: false}
        lei: {group: lei_once, key: series_id, on_missing: skip, replace: false}
        fund_id: {group: latest_fund_id, key: series_id, on_missing: error, replace: false}
