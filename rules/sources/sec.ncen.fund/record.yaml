pass:
  pieces: {step: combine.yaml}
# Each fund row of combine.yaml's output as one record (`record`), read over
# the combine's pieces, for mdm.prepare (`record_column: record`): the record
# is the row itself, as the Dataset Contract reads it.
execution: {profile: source.read, workers: 1, max_artifacts: 1}
read:
  format: json
  limits: {max_bytes: 16777216, max_records: 1000000}
  tables:
    fund:
      each: tables.fund
      columns:
        record:
          object:
            fields:
              series_id: {value: {path: series_id}}
              lei: {value: {path: lei}}
              latest: {value: {path: latest}}
              filed_at:
                choose:
                  condition: {test: {path: latest.filed, kind: truthy}}
                  then:
                    concat:
                    - text: {path: latest.filed, transforms: [{regex_replace: {pattern: ' ', with: '-'}}]}
                    - const: {value: 'T00:00:00+00:00'}
                  else: {const: {value: null}}
