# Name Frequency's SEC population, its name keys read directly (ticket 148): each
# raw main submissions document gives its filer's current name key and each
# former name key, beside the filer's ten-digit CIK. The keys are
# `census-filer.yaml`'s, transform for transform; `census-sec-reduction.yaml`
# then counts who holds each key.
execution:
  profile: source.read
  workers: 1
  # 256 documents a unit: the whole capture (43,338 filers) is 170 readings, within
  # the 256 one combination name may list.
  max_artifacts: 256
read:
  format: json
  context:
    cik:
      type: integer
  assertions:
  - test: {test: {path: '.', kind: object}}
    reason: Company submissions must be a JSON object
  limits:
    max_bytes: 33554432
    max_records: 100000
  tables:
    current:
      each: .
      columns:
        cik:
          transform:
            value: {concat: [{const: {value: '0000000000'}}, {context: {name: cik}}]}
            transforms: [{keep_last: 10}]
        key:
          text:
            path: name
            coerce: python
            trim: false
            default: ''
            transforms:
            - case: upper
            - regex_replace:
                pattern: '[\s\x1c-\x1f]*/[A-Z0-9 .]{1,6}/?[\s\x1c-\x1f]*$'
                with: ''
            - unicode: nfkd
            - strip_combining: true
            - case: upper
            - replace:
                from: '&'
                to: ' AND '
            - regex_replace:
                pattern: '[^A-Z0-9]+'
                with: ' '
            - trim: true
            - pad:
                left: ' '
                right: ' '
            - replace:
                from: ' L L C '
                to: ' LLC '
            - replace:
                from: ' L L P '
                to: ' LLP '
            - replace:
                from: ' L P '
                to: ' LP '
            - replace:
                from: ' P L C '
                to: ' PLC '
            - replace:
                from: ' N V '
                to: ' NV '
            - replace:
                from: ' S A '
                to: ' SA '
            - replace:
                from: ' A G '
                to: ' AG '
            - replace:
                from: ' S E '
                to: ' SE '
            - replace:
                from: ' B V '
                to: ' BV '
            - replace:
                from: ' CORPORATION '
                to: ' CORP '
            - replace:
                from: ' INCORPORATED '
                to: ' INC '
            - replace:
                from: ' COMPANY '
                to: ' CO '
            - replace:
                from: ' LIMITED '
                to: ' LTD '
            - replace:
                from: ' HOLDINGS '
                to: ' HLDGS '
            - replace:
                from: ' INTERNATIONAL '
                to: ' INTL '
            - trim: true
            - remove_prefix: 'THE '
    former:
      each: formerNames
      columns:
        cik:
          transform:
            value: {concat: [{const: {value: '0000000000'}}, {context: {name: cik}}]}
            transforms: [{keep_last: 10}]
        key:
          text:
            path: name
            coerce: python
            trim: false
            default: ''
            transforms:
            - case: upper
            - regex_replace:
                pattern: '[\s\x1c-\x1f]*/[A-Z0-9 .]{1,6}/?[\s\x1c-\x1f]*$'
                with: ''
            - unicode: nfkd
            - strip_combining: true
            - case: upper
            - replace:
                from: '&'
                to: ' AND '
            - regex_replace:
                pattern: '[^A-Z0-9]+'
                with: ' '
            - trim: true
            - pad:
                left: ' '
                right: ' '
            - replace:
                from: ' L L C '
                to: ' LLC '
            - replace:
                from: ' L L P '
                to: ' LLP '
            - replace:
                from: ' L P '
                to: ' LP '
            - replace:
                from: ' P L C '
                to: ' PLC '
            - replace:
                from: ' N V '
                to: ' NV '
            - replace:
                from: ' S A '
                to: ' SA '
            - replace:
                from: ' A G '
                to: ' AG '
            - replace:
                from: ' S E '
                to: ' SE '
            - replace:
                from: ' B V '
                to: ' BV '
            - replace:
                from: ' CORPORATION '
                to: ' CORP '
            - replace:
                from: ' INCORPORATED '
                to: ' INC '
            - replace:
                from: ' COMPANY '
                to: ' CO '
            - replace:
                from: ' LIMITED '
                to: ' LTD '
            - replace:
                from: ' HOLDINGS '
                to: ' HLDGS '
            - replace:
                from: ' INTERNATIONAL '
                to: ' INTL '
            - trim: true
            - remove_prefix: 'THE '
