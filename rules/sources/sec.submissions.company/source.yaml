# SEC Company: the MDM mapping of SEC submissions records (the Dataset Contract
# registered as sec.submissions.company.v1). The Company target reuses the
# retained Silver/MDM preparation pending census, catalog, pagination and full
# installed qualification. The read block below is locally qualified only.
source: sec.submissions.company
acquisition:
  version: 1
  feeds:
    submissions:
      family: submissions
      datasets:
      - sec.submissions.company.v1
      scope:
      - cik
      - file
      capabilities:
        capture: provider.capture
        fetch: sec.conditional
      completeness:
        format: json
        required:
        - cik
        - filings
        allow_empty: false
        max_bytes: 134217728
      required_producers:
      - capture
      - sec_company
      - sec_company_filing
      page_completeness:
        format: json
        required:
        - filings
        allow_empty: true
        max_bytes: 134217728
      url_prefixes:
      - https://data.sec.gov/submissions/
bookkeeping:
  version: 1
  targets:
    company:
      steps:
      - name: capture_main
        operation: provider.capture
        requires: []
        key: '{candidate_id}'
        leases:
        - source:{source}:{feed}:{cik}
        checks:
        - input.hash
        - output.receipt
      - name: expand_pages
        operation: company.expand
        requires: [capture_main]
        key: '{cik}'
        leases:
        - source:sec.submissions.company:submissions:{cik}
        checks: [input.hash, output.receipt]
      - name: capture_page
        operation: provider.capture
        requires: [expand_pages]
        key: '{candidate_id}'
        leases:
        - source:{source}:{feed}:{cik}
        checks: [input.hash, output.receipt]
      - name: revision
        operation: source.evidence
        requires: [capture_main, capture_page]
        key: '{cik}'
        leases:
        - source:sec.submissions.company:submissions:{cik}
        checks: [input.hash, output.receipt]
      - name: silver
        operation: company.silver
        requires: [capture_main, revision, capture_page]
        key: '{cik}'
        leases:
        - silver:sec.submissions.company:{cik}
        checks: [input.hash, output.receipt]
      - name: capture
        operation: source.evidence
        requires: [capture_main, revision]
        key: '{cik}'
        leases:
        - source:sec.submissions.company:submissions:{cik}
        checks: [input.hash, output.receipt]
      - name: sec_company
        operation: source.evidence
        requires: [silver]
        key: '{cik}'
        leases:
        - silver:sec.submissions.company:{cik}
        checks: [input.hash, output.receipt]
      - name: sec_company_filing
        operation: source.evidence
        requires: [silver]
        key: '{cik}'
        leases:
        - silver:sec.submissions.company:{cik}
        checks: [input.hash, output.receipt]
      - name: prepare_mdm
        operation: company.prepare
        requires: [silver, sec_company, sec_company_filing]
        key: '{cik}'
        leases:
        - mdm:company-prepare:{cik}
        checks: [input.hash, output.receipt]
      - name: ingest
        operation: mdm.merge
        requires: [prepare_mdm]
        key: '{batch_id}'
        leases:
        - mdm:consumer:{consumer}
        checks: [input.hash, output.receipt, mdm.committed]
      - name: expand_publish
        operation: company.publish_expand
        requires: [prepare_mdm, ingest]
        key: '{cik}'
        leases:
        - mdm:publication-plan:{cik}
        checks: [input.hash, output.receipt]
      - name: publish
        operation: mdm.publish
        requires: [expand_publish]
        key: '{batch_id}:{consumer}'
        leases:
        - mdm:publication:{consumer}
        checks: [input.hash, output.receipt, mdm.published]
      allow_zero_work: true
      checks:
      - manifest.hash
      - work.accounting
      - journal.delivered
    capture:
      steps:
        - name: capture
          operation: artifact.copy
          requires: []
          key: "{artifact_id}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt]
      checks: [manifest.hash, work.accounting, journal.delivered]
    mdm:
      steps:
        - name: merge
          operation: mdm.merge
          requires: []
          key: "{batch_id}"
          leases: ["mdm:consumer:{consumer}"]
          checks: [input.hash, output.receipt, mdm.committed]
      checks: [manifest.hash, work.accounting, journal.delivered]
bronze:
  family: submissions
mdm:
  sec.submissions.company.v1:
    contract:
      provider: SEC
      family: submissions
      schema_version: silver-company-v1
      record_key: zero-padded 10-digit CIK
      publication_key: capture run plus exact company landing member digest, plus the exact
        filing-list, business-address and ticker catalog member digests, plus the Name Census
        digest
      effective_time: unknown; last_synced_at is observation time only
      semantics: patch
      completeness: explicit bounded Company sample; no retirement by absence
      # A data quality exception (quality.yaml) never stops the run (operator,
      # 2026-09-28).
      nonblocking_deferred_reasons:
      - quality_name_present
      adapter:
        reading:
          source: sec.submissions.company
          read:
            format: json
            limits:
              max_bytes: 33554432
              max_records: 1
            assertions:
            - test:
                test:
                  path: .
                  kind: object
              reason: Mapped input must be an object
            tables:
              mapped:
                each: .
                columns:
                  fields:
                    object:
                      fields:
                        name:
                          value:
                            path: entity_name
                            path_mode: literal
                            type: text
                            null_if_blank: true
                        sic:
                          value:
                            path: sic
                            path_mode: literal
                            type: text
                            null_if_blank: true
                        sic_description:
                          value:
                            path: sic_description
                            path_mode: literal
                            type: text
                            null_if_blank: true
                        state_of_incorporation:
                          value:
                            path: state_of_incorporation
                            path_mode: literal
                            type: text
                            null_if_blank: true
                        fiscal_year_end:
                          value:
                            path: fiscal_year_end
                            path_mode: literal
                            type: text
                            null_if_blank: true
                        description:
                          value:
                            path: description
                            path_mode: literal
                            type: text
                            null_if_blank: true
                        address:
                          object:
                            fields:
                              street:
                                value:
                                  path: business_address.street
                                  path_mode: literal
                                  type: text
                                  trim: true
                                  null_if_blank: true
                              street2:
                                value:
                                  path: business_address.street2
                                  path_mode: literal
                                  type: text
                                  trim: true
                                  null_if_blank: true
                              city:
                                value:
                                  path: business_address.city
                                  path_mode: literal
                                  type: text
                                  trim: true
                                  null_if_blank: true
                              region:
                                value:
                                  path: business_address.region
                                  path_mode: literal
                                  type: text
                                  trim: true
                                  null_if_blank: true
                              postcode:
                                value:
                                  path: business_address.postal_code
                                  path_mode: literal
                                  type: text
                                  trim: true
                                  null_if_blank: true
                              country:
                                value:
                                  path: business_address.country
                                  path_mode: literal
                                  type: text
                                  trim: true
                                  null_if_blank: true
                            omit_nulls: true
                            null_if_empty: true
                  matching:
                    object:
                      fields:
                        business_postal_code:
                          value:
                            path: business_address.postal_code
                            path_mode: literal
                        business_country:
                          value:
                            path: business_address.country
                            path_mode: literal
                        name_census:
                          value:
                            path: name_census
                            path_mode: literal
          input_fields:
          - business_address
          - description
          - entity_name
          - fiscal_year_end
          - name_census
          - sic
          - sic_description
          - state_of_incorporation
        version: sec-company-landing-v7
        retain_deferred: true
        source_record_provenance: true
        field_shape: nullable_text
        record_key:
        - cik
        record_key_format: sec_cik
        # The measured Company classification rule, not a lookup table: SEC
        # types a foreign issuer "other", as it does an individual (ticket 12).
        classification:
          kind: company
          rule_id: sec-company-candidate
          version: 2026-09-25.13
        # Behind the operator's decision (2026-09-26): EIN and SEC's stated LEI
        # are kept as lookup-only identifiers. Identifiers are fixed within a
        # source code, so they wait for a new one (sec.submissions.company.v2);
        # do not copy this list as an example.
        identifiers:
          cik: cik
        identifier_formats:
          cik: sec_cik
        fields:
          name: entity_name
          sic: sic
          sic_description: sic_description
          # SEC's own field, as SEC writes it ("CA", "DC", "E9"). Jurisdiction is
          # GLEIF's, a separate field, so the two never compete (operator, 2026-09-24).
          state_of_incorporation: state_of_incorporation
          fiscal_year_end: fiscal_year_end
          description: description
          address:
            components:
              street: business_address.street
              street2: business_address.street2
              city: business_address.city
              region: business_address.region
              postcode: business_address.postal_code
              country: business_address.country
        # Behind the operator's decision (2026-09-27): capture hashes, run id and
        # sync time stay beside the record, not in it. The next SEC mapping
        # drops them; do not copy this block as an example.
        provenance:
          landing_sha256: _origin.sha256
          landing_manifest_sha256: _origin.manifest_sha256
          raw_object_id: raw_object_id
          capture_run_id: last_sync_run_id
          observed_at: last_synced_at
          filing_landing_sha256: _origin.forms.sha256
          ticker_landing_sha256: _origin.tickers.sha256
          ticker_run_id: _origin.tickers.run_id
          address_landing_sha256: _origin.business_address.sha256
        # What the SEC-to-GLEIF matching rules compare, kept with the record and
        # out of its fields (company mastering ticket 08).
        matching:
          business_postal_code: business_address.postal_code
          business_country: business_address.country
          name_census: name_census

# Generic reading of a receipt-bound main document; no source activation.
execution:
  profile: source.read
  workers: 1
  max_artifacts: 2
read:
  format: json
  context:
    cik:
      type: integer
    sync_run_id:
      type: text
    raw_object_id:
      type: text
    load_mode:
      type: text
    recent_limit:
      type: integer
      nullable: true
    last_synced_at:
      type: text
  assertions:
  - test: {test: {path: '.', kind: object}}
    reason: Company submissions must be a JSON object
  - test:
      choose:
        condition: {test: {path: addresses, kind: missing}}
        then: {test: {path: addresses, kind: missing}}
        else: {test: {path: addresses, kind: object}}
    reason: An explicit addresses member must be a JSON object
  limits:
    max_bytes: 33554432
    max_records: 100000
  tables:
    filings:
      take:
        context:
          name: recent_limit
      each:
        parallel:
          path: filings.recent
          anchor: accessionNumber
          fields:
            accession_number: accessionNumber
            form: form
            filing_date: filingDate
            report_date: reportDate
            acceptance_datetime: acceptanceDateTime
            act: act
            file_number: fileNumber
            film_number: filmNumber
            items: items
            primary_document: primaryDocument
            primary_doc_desc: primaryDocDescription
            size: size
            is_xbrl: isXBRL
            is_inline_xbrl: isInlineXBRL
          lengths: anchor
          on_invalid_object: empty
          strings: characters
          on_empty_anchor: ignore_fields
          objects: indexed
          validation: selected
      columns:
        accession_number:
          text:
            path: accession_number
            trim: false
            null_if:
            - ""
            coerce: python
        form:
          text:
            path: form
            trim: false
            null_if:
            - ""
            coerce: python
        filing_date:
          date:
            path: filing_date
            kind: calendar
            basic_suffix: ignore
            prefix_length: 10
            on_invalid: null
            coerce: python
        report_date:
          date:
            path: report_date
            kind: calendar
            basic_suffix: ignore
            prefix_length: 10
            on_invalid: null
            coerce: python
        acceptance_datetime:
          text:
            path: acceptance_datetime
            trim: false
            null_if:
            - ""
            coerce: python
        act:
          text:
            path: act
            trim: false
            null_if:
            - ""
            coerce: python
        file_number:
          text:
            path: file_number
            trim: false
            null_if:
            - ""
            coerce: python
        film_number:
          text:
            path: film_number
            trim: false
            null_if:
            - ""
            coerce: python
        items:
          text:
            path: items
            trim: false
            null_if:
            - ""
            coerce: python
        primary_document:
          text:
            path: primary_document
            trim: false
            null_if:
            - ""
            coerce: python
        primary_doc_desc:
          text:
            path: primary_doc_desc
            trim: false
            null_if:
            - ""
            coerce: python
        size:
          integer:
            path: size
            on_invalid: null
        is_xbrl:
          integer:
            path: is_xbrl
            as: boolean
            default: false
            on_invalid: default
        is_inline_xbrl:
          integer:
            path: is_inline_xbrl
            as: boolean
            default: false
            on_invalid: default
        cik:
          context:
            name: cik
        sync_run_id:
          context:
            name: sync_run_id
        raw_object_id:
          context:
            name: raw_object_id
        load_mode:
          context:
            name: load_mode
    company:
      each: .
      columns:
        entity_name:
          value:
            path: name
        entity_type:
          value:
            path: entityType
        sic:
          value:
            path: sic
        sic_description:
          value:
            path: sicDescription
        state_of_incorporation:
          value:
            path: stateOfIncorporation
        state_of_incorporation_desc:
          value:
            path: stateOfIncorporationDescription
        fiscal_year_end:
          value:
            path: fiscalYearEnd
        ein:
          value:
            path: ein
        description:
          value:
            path: description
        category:
          value:
            path: category
        cik:
          context:
            name: cik
        sync_run_id:
          context:
            name: sync_run_id
        raw_object_id:
          context:
            name: raw_object_id
        load_mode:
          context:
            name: load_mode
        last_sync_run_id:
          context:
            name: sync_run_id
        last_synced_at:
          context:
            name: last_synced_at
    addresses:
      each:
        choose:
          condition: {test: {path: addresses.business, kind: object}}
          then: addresses.business
          else: {objects: {path: addresses.business, on_invalid: empty}}
      columns:
        business_address:
          object:
            fields:
              street:
                coalesce:
                  values:
                  - value:
                      path: street1
                  skip: falsey
              street2:
                coalesce:
                  values:
                  - value:
                      path: street2
                  skip: falsey
              city:
                coalesce:
                  values:
                  - value:
                      path: city
                  skip: falsey
              postal_code:
                coalesce:
                  values:
                  - value:
                      path: zipCode
                  skip: falsey
              country:
                lookup:
                  reference: places
                  column: country
                  trim: true
                  case: upper
                  on_missing: "null"
                  key:
                    choose:
                      condition: {test: {path: stateOrCountry, kind: truthy}}
                      then: {text: {path: stateOrCountry, coerce: python, trim: false}}
                      else: {text: {path: countryCode, coerce: python, trim: false}}
              region:
                choose:
                  condition:
                    lookup:
                      reference: places
                      column: subdivision
                      trim: true
                      case: upper
                      on_missing: "null"
                      key:
                        choose:
                          condition: {test: {path: stateOrCountry, kind: truthy}}
                          then: {text: {path: stateOrCountry, coerce: python, trim: false}}
                          else: {text: {path: countryCode, coerce: python, trim: false}}
                  then:
                    coalesce:
                      values:
                      - value:
                          path: stateOrCountry
                      skip: falsey
                  else:
                    const:
                      value: null
        cik:
          context:
            name: cik
        last_sync_run_id:
          context:
            name: sync_run_id
