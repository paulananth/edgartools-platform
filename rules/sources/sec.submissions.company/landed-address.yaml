# Landed business-address projection; no source-specific executable derivation.
source: sec.submissions.company
input_fields:
- street1
- street2
- city
- zip_code
- state_or_country
- country_code
read:
  format: json
  limits:
    max_bytes: 1048576
    max_records: 1
  tables:
    mapped:
      each: .
      columns:
        fields:
          object:
            fields:
              street:
                coalesce:
                  values:
                  - value:
                      path: street1
                  skip: falsey
              street2:
                coalesce:
                  values:
                  - value:
                      path: street2
                  skip: falsey
              city:
                coalesce:
                  values:
                  - value:
                      path: city
                  skip: falsey
              postal_code:
                coalesce:
                  values:
                  - value:
                      path: zip_code
                  skip: falsey
              country:
                lookup:
                  reference: places
                  column: country
                  trim: true
                  case: upper
                  on_missing: 'null'
                  key:
                    choose:
                      condition:
                        test:
                          path: state_or_country
                          kind: truthy
                      then:
                        text:
                          path: state_or_country
                          coerce: python
                          trim: false
                      else:
                        text:
                          path: country_code
                          coerce: python
                          trim: false
              region:
                choose:
                  condition:
                    lookup:
                      reference: places
                      column: subdivision
                      trim: true
                      case: upper
                      on_missing: 'null'
                      key:
                        choose:
                          condition:
                            test:
                              path: state_or_country
                              kind: truthy
                          then:
                            text:
                              path: state_or_country
                              coerce: python
                              trim: false
                          else:
                            text:
                              path: country_code
                              coerce: python
                              trim: false
                  then:
                    coalesce:
                      values:
                      - value:
                          path: state_or_country
                      skip: falsey
                  else:
                    const:
                      value: null
  references:
