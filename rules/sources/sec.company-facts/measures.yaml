# The fundamental measures (ticket 47; the rulings of tickets 39 and 42 in
# skills/company-financials/SKILL.md, "Measures"). Built by SQL over silver's
# company_line_item (edgar_warehouse/financials/measures.py) into
# company_measure: one row per company, measure, fiscal year and window.
#
# Each name below is a line item of financial-line-items, or `fcf`: operating
# cash flow less capital expenditure, computed per year and flagged non-GAAP.
# A ratio is null, in this order, when the measure is not meaningful for
# financial services, when an input is missing ("no concept filed"), when its
# inputs are in two currencies, or when its denominator is zero or negative.
version: measures-2026-10-29.first-build

# Ticket 42: not meaningful for a financial-services filer (SIC 6000-6199,
# 6300-6411), which presents no gross profit, total debt or current balance.
not_for_financial_services:
- gross_margin
- debt_to_assets
- debt_to_equity
- current_ratio
- roic_average
- roic_beginning

# One fiscal year's numerator over its denominator.
ratios:
  gross_margin: [gross_profit, revenue]
  operating_margin: [operating_income, revenue]
  net_margin: [net_income, revenue]
  fcf_margin: [fcf, revenue]
  debt_to_assets: [total_debt, assets]
  debt_to_equity: [total_debt, book_value]
  liabilities_to_assets: [liabilities, assets]
  current_ratio: [current_assets, current_liabilities]
  book_value_per_share: [book_value, shares_outstanding]
  fcf_per_share: [fcf, diluted_shares]

# A year's return over a balance, in two forms (ticket 39, "can we have both"):
# `<name>_average` on the mean of the year's and the prior year's balance (WRDS),
# `<name>_beginning` on the prior year's balance (Damodaran). `roic` is after
# tax: operating income x (1 - tax rate) over debt + equity - cash, the tax rate
# income tax over pretax income, else the country's statutory rate.
returns:
  roe: [net_income, book_value]
  roa: [net_income, assets]
  roic: [operating_income_after_tax, invested_capital]

# Compound annual growth over exactly these many years, by fiscal year.
growth:
  series: [revenue, net_income, eps_diluted, ocf, fcf, book_value]
  windows: [1, 3, 5, 10]
