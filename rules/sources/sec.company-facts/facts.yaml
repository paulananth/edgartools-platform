# One SEC company facts file: every XBRL fact a filer reported, one JSON object per
# filer (`facts.<taxonomy>.<concept>.units.<unit>[]`). Configured source extract only
# (ticket 40; operator, 2026-10-22: "configure only"). One table per taxonomy, one row
# per concept, its `units` kept whole as one value. Built from the trial contract
# (research 03), ticket 45. `company_fact` gives one row per filed fact, the rows
# silver lands (silver-company-fact.yaml, ticket 46).
source: sec.company-facts
read:
  format: json
  limits: {max_bytes: 134217728, max_records: 100000}
  # Nothing is dropped silently (ticket 40): a file is refused when its shape is
  # not the one read below. A filer with no facts (an empty object) lands nothing.
  assertions:
  - test: {test: {path: '.', kind: object}}
    reason: A company facts file must be a JSON object
  - test:
      choose:
        condition: {test: {path: facts, kind: missing}}
        then: {test: {path: facts, kind: missing}}
        else: {test: {path: facts, kind: object}}
    reason: Facts must be a JSON object of taxonomies
  - test:
      choose:
        condition: {test: {path: facts, kind: missing}}
        then: {test: {path: facts, kind: missing}}
        else: {test: {path: cik, kind: not_null}}
    reason: A file with facts must name its filer's CIK
  - test:
      choose:
        condition: {test: {path: facts.dei, kind: missing}}
        then: {test: {path: facts.dei, kind: missing}}
        else: {test: {path: facts.dei, kind: object}}
    reason: Taxonomy dei must be a JSON object of concepts
  - test:
      choose:
        condition: {test: {path: facts.ecd, kind: missing}}
        then: {test: {path: facts.ecd, kind: missing}}
        else: {test: {path: facts.ecd, kind: object}}
    reason: Taxonomy ecd must be a JSON object of concepts
  - test:
      choose:
        condition: {test: {path: facts.ffd, kind: missing}}
        then: {test: {path: facts.ffd, kind: missing}}
        else: {test: {path: facts.ffd, kind: object}}
    reason: Taxonomy ffd must be a JSON object of concepts
  - test:
      choose:
        condition: {test: {path: facts.ifrs-full, kind: missing}}
        then: {test: {path: facts.ifrs-full, kind: missing}}
        else: {test: {path: facts.ifrs-full, kind: object}}
    reason: Taxonomy ifrs-full must be a JSON object of concepts
  - test:
      choose:
        condition: {test: {path: facts.invest, kind: missing}}
        then: {test: {path: facts.invest, kind: missing}}
        else: {test: {path: facts.invest, kind: object}}
    reason: Taxonomy invest must be a JSON object of concepts
  - test:
      choose:
        condition: {test: {path: facts.rxp, kind: missing}}
        then: {test: {path: facts.rxp, kind: missing}}
        else: {test: {path: facts.rxp, kind: object}}
    reason: Taxonomy rxp must be a JSON object of concepts
  - test:
      choose:
        condition: {test: {path: facts.srt, kind: missing}}
        then: {test: {path: facts.srt, kind: missing}}
        else: {test: {path: facts.srt, kind: object}}
    reason: Taxonomy srt must be a JSON object of concepts
  - test:
      choose:
        condition: {test: {path: facts.us-gaap, kind: missing}}
        then: {test: {path: facts.us-gaap, kind: missing}}
        else: {test: {path: facts.us-gaap, kind: object}}
    reason: Taxonomy us-gaap must be a JSON object of concepts
  - test:
      choose:
        condition: {test: {path: facts.vip, kind: missing}}
        then: {test: {path: facts.vip, kind: missing}}
        else: {test: {path: facts.vip, kind: object}}
    reason: Taxonomy vip must be a JSON object of concepts
  references:
    # The taxonomies with a table below. A taxonomy not listed refuses the file
    # (lookup_missing), never drops silently: add its table and its line here.
    taxonomies:
      dei: {known: true}
      ecd: {known: true}
      ffd: {known: true}
      ifrs-full: {known: true}
      invest: {known: true}
      rxp: {known: true}
      srt: {known: true}
      us-gaap: {known: true}
      vip: {known: true}
  tables:
    taxonomies:
      each: {entries: {path: facts, key_field: taxonomy, value_field: concepts, on_invalid: empty}}
      columns:
        taxonomy: {text: {path: taxonomy, trim: false}}
        known:
          lookup: {reference: taxonomies, column: known, key: {text: {path: taxonomy, trim: false}}, on_missing: error}
    # Each concept row carries the filer's CIK. The SEC files it as a JSON number in
    # some files and as digit text (zero-padded) in others; `integer` reads both exactly.
    # Every figure stays exact: an integer beyond 64-bit (ticket 128) and every decimal
    # (ticket 134) as its filed digits, a big decimal, never a float.
    concepts_dei:
      each: {entries: {path: facts.dei, key_field: concept, value_field: body, on_invalid: empty}}
      columns:
        cik: {integer: {path: cik, from: document}}
        concept: {text: {path: concept, trim: false}}
        label: {value: {path: body.label, type: text}}
        description: {value: {path: body.description, type: text}}
        units: {value: {path: body.units, type: object, nullable: false, big_numbers: text, decimals: text}}
    concepts_ecd:
      each: {entries: {path: facts.ecd, key_field: concept, value_field: body, on_invalid: empty}}
      columns:
        cik: {integer: {path: cik, from: document}}
        concept: {text: {path: concept, trim: false}}
        label: {value: {path: body.label, type: text}}
        description: {value: {path: body.description, type: text}}
        units: {value: {path: body.units, type: object, nullable: false, big_numbers: text, decimals: text}}
    concepts_ffd:
      each: {entries: {path: facts.ffd, key_field: concept, value_field: body, on_invalid: empty}}
      columns:
        cik: {integer: {path: cik, from: document}}
        concept: {text: {path: concept, trim: false}}
        label: {value: {path: body.label, type: text}}
        description: {value: {path: body.description, type: text}}
        units: {value: {path: body.units, type: object, nullable: false, big_numbers: text, decimals: text}}
    concepts_ifrs_full:
      each: {entries: {path: facts.ifrs-full, key_field: concept, value_field: body, on_invalid: empty}}
      columns:
        cik: {integer: {path: cik, from: document}}
        concept: {text: {path: concept, trim: false}}
        label: {value: {path: body.label, type: text}}
        description: {value: {path: body.description, type: text}}
        units: {value: {path: body.units, type: object, nullable: false, big_numbers: text, decimals: text}}
    concepts_invest:
      each: {entries: {path: facts.invest, key_field: concept, value_field: body, on_invalid: empty}}
      columns:
        cik: {integer: {path: cik, from: document}}
        concept: {text: {path: concept, trim: false}}
        label: {value: {path: body.label, type: text}}
        description: {value: {path: body.description, type: text}}
        units: {value: {path: body.units, type: object, nullable: false, big_numbers: text, decimals: text}}
    concepts_rxp:
      each: {entries: {path: facts.rxp, key_field: concept, value_field: body, on_invalid: empty}}
      columns:
        cik: {integer: {path: cik, from: document}}
        concept: {text: {path: concept, trim: false}}
        label: {value: {path: body.label, type: text}}
        description: {value: {path: body.description, type: text}}
        units: {value: {path: body.units, type: object, nullable: false, big_numbers: text, decimals: text}}
    concepts_srt:
      each: {entries: {path: facts.srt, key_field: concept, value_field: body, on_invalid: empty}}
      columns:
        cik: {integer: {path: cik, from: document}}
        concept: {text: {path: concept, trim: false}}
        label: {value: {path: body.label, type: text}}
        description: {value: {path: body.description, type: text}}
        units: {value: {path: body.units, type: object, nullable: false, big_numbers: text, decimals: text}}
    concepts_us_gaap:
      each: {entries: {path: facts.us-gaap, key_field: concept, value_field: body, on_invalid: empty}}
      columns:
        cik: {integer: {path: cik, from: document}}
        concept: {text: {path: concept, trim: false}}
        label: {value: {path: body.label, type: text}}
        description: {value: {path: body.description, type: text}}
        units: {value: {path: body.units, type: object, nullable: false, big_numbers: text, decimals: text}}
    concepts_vip:
      each: {entries: {path: facts.vip, key_field: concept, value_field: body, on_invalid: empty}}
      columns:
        cik: {integer: {path: cik, from: document}}
        concept: {text: {path: concept, trim: false}}
        label: {value: {path: body.label, type: text}}
        description: {value: {path: body.description, type: text}}
        units: {value: {path: body.units, type: object, nullable: false, big_numbers: text, decimals: text}}
    # One row per filed fact, the rows of silver's `company_fact` (ticket 46): each
    # taxonomy, concept and unit carried onto its facts by `nest`. The figure stays
    # its exact filed digits (a big decimal). `period` keys a fact's period without
    # an empty part: start/end for a duration (ISO 8601), the date for an instant.
    company_fact:
      each:
        nest:
          each: {entries: {path: facts, key_field: taxonomy, value_field: concepts, on_invalid: empty}}
          keep: {taxonomy: taxonomy}
          then:
            nest:
              each: {entries: {path: concepts, key_field: concept, value_field: body}}
              keep: {concept: concept}
              then:
                nest:
                  each: {entries: {path: body.units, key_field: unit, value_field: facts}}
                  keep: {unit: unit}
                  then: {values: {path: facts}}
      columns:
        company_key:
          transform:
            value: {concat: [{const: {value: '0000000000'}}, {integer: {path: cik, from: document}}]}
            transforms: [{keep_last: 10}]
        taxonomy: {text: {path: taxonomy, trim: false}}
        concept: {text: {path: concept, trim: false}}
        unit: {text: {path: unit, trim: false}}
        # The ISO 4217 code when the unit is a currency or a currency per share
        # (USD, EUR/shares), else empty.
        currency:
          text:
            path: unit
            trim: false
            transforms:
            - {regex_replace: {pattern: '/.*$', with: ''}}
            - {regex_replace: {pattern: '^.*[^A-Z].*$|^[A-Z]{0,2}$|^[A-Z]{4,}$', with: ''}}
            null_if: ['']
        period:
          choose:
            condition: {test: {path: start, kind: not_null}}
            then: {concat: [{text: {path: start, trim: false}}, {const: {value: /}}, {text: {path: end, trim: false}}]}
            else: {text: {path: end, trim: false}}
        period_start: {date: {path: start, kind: calendar}}
        period_end: {date: {path: end, kind: calendar}}
        value: {value: {path: val, nullable: false, big_numbers: text, decimals: text}}
        accession: {text: {path: accn, trim: false}}
        filed: {date: {path: filed, kind: calendar}}
        form: {text: {path: form, trim: false}}
        fiscal_year_filed: {integer: {path: fy}}
        fiscal_period_filed: {text: {path: fp, trim: false}}
        frame: {text: {path: frame, trim: false}}
