  # v2 because a Rules database already held v1, and this contract also issues a CUSIP.
  # An identifier cannot be added on an existing source code (2026-10-24).
  openfigi.security_isin.v2:
    contract:
      provider: OpenFIGI
      family: openfigi
      schema_version: openfigi-security-isin-v3
      record_key: the ISIN asked, upper-cased; one record per ISIN asked
      publication_key: the capture's mapping answer files and the reduce, combine and record
        contracts
      effective_time: 'none: an answer states no date'
      semantics: patch
      completeness: the ISINs asked of OpenFIGI; no retirement by absence
      nonblocking_deferred_reasons:
      - invalid_isin
      - invalid_isin_checksum
      - missing_record_identity
      - not_found_by_openfigi
      # Not listed, so blocking: an ISIN sharing a listing FIGI with two or
      # more CUSIP answers waits for review (ticket 120; operator, 2026-10-23,
      # "agreed").
      adapter:
        reading:
          source: openfigi
          read:
            format: json
            limits:
              max_bytes: 1048576
              max_records: 1
            assertions:
            - test:
                test:
                  path: .
                  kind: object
              reason: Mapped input must be an object
            tables:
              mapped:
                each: .
                checks:
                - check: required
                  column: _found
                  reason: not_found_by_openfigi
                  on_fail: defer
                - check: absent
                  column: _several_cusips
                  reason: isin_shares_figi_with_several_cusips
                  on_fail: defer
                columns:
                  # The CUSIPs sharing a listing FIGI with this ISIN (record.yaml),
                  # kept only when there are two or more.
                  _several_cusips:
                    choose:
                      condition:
                        equal:
                          left:
                            transform:
                              value: {value: {path: figi_cusips}}
                              transforms: [{regex_replace: {pattern: "^[^ ]*$", with: ""}}]
                          right: {const: {value: ""}}
                      then: {value: {path: NO_SUCH_FIELD}}
                      else: {value: {path: figi_cusips}}
                  _found:
                    text:
                      path: found
                      null_if:
                      - not found
                  fields:
                    object:
                      fields:
                        # OpenFIGI's own name, the one it states for the
                        # identifier (ticket 84; operator, 2026-10-18: "Name
                        # only (Recommended)"); kept only when its listings
                        # state one name (combine.yaml).
                        name_of_issuer:
                          value:
                            path: name
                        # The other security-level fields (ticket 120; operator,
                        # 2026-10-20: "all fields from open figi must be in the
                        # security master"): the one value the listings state, else
                        # the primary listing's (record.yaml).
                        security_type:
                          value:
                            path: security_type
                        security_type2:
                          value:
                            path: security_type2
                        market_sector:
                          value:
                            path: market_sector
                        # No share_class_figi field: it is the Security's
                        # cross-reference below (lookup only), one place, not
                        # two (ticket 129; operator, 2026-10-22: "Fix 4").
                  matching:
                    object:
                      fields: {}
                  # Every listing, one detail row per FIGI (ticket 120).
                  details:
                    object:
                      fields:
                        listings:
                          value:
                            path: listings
          input_fields:
          - id
