# The silver table of OpenFIGI's listings (ticket 80): `edgar-warehouse silver
# register` reads this spec (docs/specs/profiling/findings.md, section 6).
# Rulings it rests on (operator):
# - "(c) MDM + silver listings (Recommended)" (2026-10-17 08:56 ET): every
#   listing lands in silver; the MDM record keeps only the single levels.
# - "auto merge and not ask for approval" (2026-10-17): this spec change is
#   recorded as approved under that standing rule. Profiling proposed a table
#   keyed by its own row number and linked to the three FIGI levels; under the
#   rulings the FIGIs are lookup-only cross-references, so a listing is keyed
#   by the identifier asked and its FIGI, and links to the Security that
#   identifier joined. Evidence (the 2026-10-15 capture, read by the full
#   configured run): 0 duplicate keys over 872,383 CUSIP and 1,312,316 ISIN
#   listings.
# Profiling found every listing with a ticker and a market sector, so both are
# never empty: a delivery without one is refused, not landed.
# Rows are the source extract's `listings` table, with OpenFIGI's own field
# names, without `figi_ticker` (a helper for reduce.yaml). Each row carries
# the master id of the Security its identifier asked joined.
# Append only: a refresh asks only identifiers not yet captured (operator,
# 2026-10-15: "Open figi rarely changes do not download again"), so a
# delivered row that changes a landed one is refused, never overwritten.
table: openfigi_listing
definition: One listing (an instrument on one exchange) that OpenFIGI's mapping gave for a CUSIP or ISIN asked.
grain: one row per identifier asked and listing FIGI
columns:
- name: id
  type: VARCHAR
  nullable: false
  definition: The CUSIP or ISIN asked, upper-cased.
  source: the request's idValue, by the answer's position
  sensitivity: none
- name: figi
  type: VARCHAR
  nullable: false
  definition: The listing's FIGI.
  source: data[].figi
  sensitivity: none
- name: ticker
  type: VARCHAR
  nullable: false
  definition: The listing's ticker on its exchange.
  source: data[].ticker
  sensitivity: none
- name: exchCode
  type: VARCHAR
  nullable: true
  definition: The exchange's code.
  source: data[].exchCode
  sensitivity: none
- name: compositeFIGI
  type: VARCHAR
  nullable: true
  definition: The FIGI of the security across one country's exchanges.
  source: data[].compositeFIGI
  sensitivity: none
- name: shareClassFIGI
  type: VARCHAR
  nullable: true
  definition: The FIGI of the share class across countries.
  source: data[].shareClassFIGI
  sensitivity: none
- name: name
  type: VARCHAR
  nullable: true
  definition: The instrument's name.
  source: data[].name
  sensitivity: none
- name: securityType
  type: VARCHAR
  nullable: true
  definition: The security type (OpenFIGI's code).
  source: data[].securityType
  sensitivity: none
- name: securityType2
  type: VARCHAR
  nullable: true
  definition: The broader security type (OpenFIGI's code).
  source: data[].securityType2
  sensitivity: none
- name: marketSector
  type: VARCHAR
  nullable: false
  definition: The market sector (OpenFIGI's code).
  source: data[].marketSector
  sensitivity: none
- name: securityDescription
  type: VARCHAR
  nullable: true
  definition: OpenFIGI's description of the security.
  source: data[].securityDescription
  sensitivity: none
key:
- id
- figi
# One MDM id (ticket 138; operator, 2026-10-25: "master_id only"): the
# Security the identifier asked joined, through the one OpenFIGI contract.
links:
- columns:
  - id
  kind: security
  source_code: openfigi.security.v3
  to_part: security
  source_key: id
  mdm_id_column: security_mdm_id
time:
  as_of: null
  as_at: loaded_at
  event_time: null
partition: []
load_mode: append
# Data quality (ticket 105; operator, 2026-10-17: "Flag, land the row"): a
# listing that fails a check lands, the check's id in its `quality` column.
# Measured on the 2026-10-15 capture, one delivery per kind asked (872,383
# CUSIP and 1,312,316 ISIN listings): FIGI shape and check digit 0 (the check
# digit since ticket 107, figi.yaml version 2); one name per FIGI 0; one
# market sector per exchange 11,805, per security type 10,249, per second
# security type 340 rows (profiling: 11,870, 10,249 and 340); 14,142 rows
# flagged in all (5,768 and 8,374), none refused. A check of one value per
# group holds within one delivery: profiling counted both kinds together, and
# its 6 rows whose name differs under one FIGI are such a pair. Profiling's
# "ticker and exchange together" is not a check: 632,078 listings carry a
# ticker and no exchange code, as OpenFIGI gives them.
checks:
- id: figi_valid
  check: identifier
  column: figi
  type: figi
  on_fail: flag
  why: A FIGI has the shape and the check digit rules/identifiers/figi.yaml declares.
- id: one_name_per_figi
  check: one_value
  column: name
  per: figi
  on_fail: flag
  why: One FIGI names one instrument.
- id: one_market_sector_per_exchange
  check: one_value
  column: marketSector
  per: exchCode
  on_fail: flag
  why: An exchange code belongs to one market sector (a reference hierarchy profiling found, 99.2% of rows).
- id: one_market_sector_per_security_type
  check: one_value
  column: marketSector
  per: securityType
  on_fail: flag
  why: A security type belongs to one market sector (a reference hierarchy profiling found, 99.5% of rows).
- id: one_market_sector_per_security_type2
  check: one_value
  column: marketSector
  per: securityType2
  on_fail: flag
  why: A second security type belongs to one market sector (a reference hierarchy profiling found).
why: Every listing OpenFIGI gave, for lookup by ticker, exchange or any FIGI; the MDM record keeps only the levels with one value.
