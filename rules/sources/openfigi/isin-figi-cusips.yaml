# Each listing of an ISIN answer with the CUSIPs whose answers give the same
# FIGI (ticket 120; operator, 2026-10-23: an ISIN answer finds its Security by
# the FIGI it shares with a CUSIP answer, "agreed"). `cusips` is figi-ids.yaml's
# output in every complete run of the CUSIP target; `answers` is this ISIN
# target's answers readings. A FIGI no CUSIP answer gives gets an empty list.
# isin-attach.yaml puts each ISIN's CUSIPs together. Pin canonical JSON of
# this file as the source.combine contract.
execution:
  profile: source.combine
combine:
  # Measured (2026-10-15 capture): 2,184,699 listings in all, 872,383 of them CUSIP answers'.
  max_rows: 10000000
  groups:
    cusips_of_figi: {source: cusips, table: figi_ids, key: figi, value: id, mode: collect, order_by: [], distinct: true, skip_null_values: true, sort_values: true, checks: {}, where: {}}
  tables:
    rows:
      source: answers
      table: listings
      checks: {}
      where: {}
      joins:
        cusips: {group: cusips_of_figi, key: figi, on_missing: empty, replace: false}
