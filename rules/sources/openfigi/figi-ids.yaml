# Each listing FIGI of a CUSIP answer and the CUSIP asked (ticket 120;
# operator, 2026-10-23: "make the seurities run should process openfigi
# first", then "agreed" to an ISIN answer finding its Security by the FIGI it
# shares with a CUSIP answer). One row per FIGI and CUSIP, so the ISIN target's
# isin-figi-cusips.yaml collects every CUSIP a FIGI is given to. Run
# in the CUSIP target over its answers readings. Measured (2026-10-15
# capture): 872,383 CUSIP listings, every one with a FIGI. Pin canonical JSON
# of this file as the source.combine contract.
execution:
  profile: source.combine
reduce:
  max_rows: 10000000
  max_input_bytes: 17179869184
  max_state_bytes: 1073741824
  max_keys: 2000000
  max_members: 2000000
  max_output_rows: 2000000
  max_output_bytes: 1073741824
  groups:
    figi_ids: {source: [answers], table: listings, keys: [figi, id], mode: count, count: listings, sample: null, sample_limit: 0}
