# Data quality for SEC submissions read as Person (person feed 1). Checks run on
# each record after the mapping and before the merge.
# Rebuild ticket 10 (operator, 2026-10-02, "Proposed set"): the name must
# hold a letter.
#
# A Person with no name never merges and never stops the run; it
# waits as an open exception (operator, 2026-09-28; for Person, Q5 "yes",
# 2026-10-01). No fix is needed for the EIN placeholder 000000000:
# `ein` is not mapped here.
version: sec-person-quality-v2
quality:
  sec.submissions.person.v1:
    checks:
    - id: legal_name_present
      test: present@1
      value: fields.legal_name
      on_fail: exception
    - id: legal_name_has_letter
      test: pattern@1
      value: fields.legal_name
      on_fail: exception
      # A letter of any script (accents and other alphabets count); a name of
      # digits and marks alone is no name. The name is kept as filed:
      # apostrophes, curly or straight, and degrees such as "Jr." or "PhD" stay.
      args:
        regex: '(?s).*[^\W\d_].*'
