# Data quality for the Form ADV contracts (ticket 07): a record with no name is
# set aside as an open exception (never merges, never stops the run).
version: iapd-adv-quality-v1
quality:
  iapd.adv.filings.v1:
    checks:
    - id: filing_name_present
      test: present@1
      value: fields.name
      on_fail: exception
  iapd.adv.custodians.v1:
    checks:
    - id: custodian_name_present
      test: present@1
      value: fields.name
      on_fail: exception
