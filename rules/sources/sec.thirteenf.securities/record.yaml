# One flat record per CUSIP (ticket 172), read over combine.yaml's pieces, for
# mdm.prepare (`record_column: record`). The Dataset Contract's adapter reads
# the combined row's own paths (name, title, class, classes, figi), so the
# record is the combined row itself.
execution: {profile: source.read, workers: 1, max_artifacts: 512}
read:
  format: json
  limits: {max_bytes: 33554432, max_records: 1000000}
  tables:
    security:
      each: tables.security
      columns:
        record: {value: {path: .}}
