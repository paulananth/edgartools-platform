pass:
  readings: {issuers: {step: source.yaml}}
# How many issuer LEIs each CUSIP is filed with, and each ISIN of a
# holding with no usable CUSIP. One source extract: the holdings reading
# (source.yaml), its issuer tables (`issuers`); reduce.yaml reads its Security tables. Pin canonical JSON of this file as the
# source.combine contract.
execution:
  profile: source.combine
reduce:
  max_rows: 40000000
  max_input_bytes: 17179869184
  max_state_bytes: 1073741824
  max_keys: 1000000
  max_members: 2000000
  max_output_rows: 1000000
  max_output_bytes: 268435456
  groups:
    # The fund series each CUSIP's holdings name, and each ISIN's.
    cusip_series:
      source: issuers
      table: security_series
      keys: [cusip]
      mode: members
      member: issuer_series
      count: series
      sample: series_sample
      sample_limit: 1
    no_cusip_series:
      source: issuers
      table: no_cusip_series
      keys: [no_cusip_key]
      mode: members
      member: issuer_series
      count: series
      sample: series_sample
      sample_limit: 1
    cusip_series_filed:
      source: issuers
      table: security_series
      keys: [cusip]
      mode: members
      member: filed
      count: filings
      sample: filed_sample
      sample_limit: 1
    no_cusip_series_filed:
      source: issuers
      table: no_cusip_series
      keys: [no_cusip_key]
      mode: members
      member: filed
      count: filings
      sample: filed_sample
      sample_limit: 1
    cusip_issuers:
      source: issuers
      table: security_issuer
      keys: [cusip]
      mode: members
      member: issuer_lei
      count: issuers
      sample: issuer_sample
      sample_limit: 1
    # The earliest filing date of each CUSIP's holdings that name an issuer
    # LEI (dates are YYYY-MM-DD, so the lexically first is the earliest): an
    # ISSUED_BY link starts there.
    cusip_filed:
      source: issuers
      table: security_issuer
      keys: [cusip]
      mode: members
      member: filed
      count: filings
      sample: filed_sample
      sample_limit: 1
    no_cusip_filed:
      source: issuers
      table: no_cusip_issuer
      keys: [no_cusip_key]
      mode: members
      member: filed
      count: filings
      sample: filed_sample
      sample_limit: 1
    no_cusip_issuers:
      source: issuers
      table: no_cusip_issuer
      keys: [no_cusip_key]
      mode: members
      member: issuer_lei
      count: issuers
      sample: issuer_sample
      sample_limit: 1
