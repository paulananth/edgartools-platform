# Data quality for N-PORT Securities (ticket 79, part 1). The CUSIP and ISIN
# check digits are the identifier types' (rules/identifiers/): a failing one
# is set aside where the record is read, so no check repeats it here.
# Approved under the operator's standing words "Approved the rules always"
# (2026-10-15), on the data-quality measure of the test run: 0 of 383,595
# CUSIP and 0 of 35,309 ISIN Securities fail it. One Dataset Contract for both
# since ticket 120 (sec.nport.security.v2). v2 adds the share-class check
# (ticket 130; operator, 2026-10-22: "Approve the rule (Recommended)").
version: sec-nport-security-quality-v2
quality:
  sec.nport.security.v2:
    checks:
    # An issuer name filed as a stand-in never names the Security: it waits.
    - id: placeholder_name_of_issuer
      test: placeholder@1
      value: fields.name_of_issuer
      on_fail: withhold
      args:
        values: [NONE, "NULL", UNKNOWN, TBD, NOTAPPLICABLE, NOTAVAILABLE]
    # Filers that name two share classes for one Security give it none
    # (combine.yaml); the Security is listed for a steward, never held back.
    - id: share_class_one_letter
      test: pattern@1
      value: matching.share_classes_filed
      on_fail: flag
      args:
        regex: "[A-Z]"
