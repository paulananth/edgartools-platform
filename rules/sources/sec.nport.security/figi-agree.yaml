# The filed CUSIP and ISIN pairs FIGI agrees on (ticket 80; operator,
# 2026-10-15: "Use FIGI to add pairs too"). Read over figi-pairs.yaml's
# output, one artifact per piece (each at most 8 MiB). A pair is kept when its
# CUSIP and its ISIN share a FIGI (`overlap`; null when either was not found,
# so the pair is dropped) and it is one of:
#   1. filed one to one (its CUSIP has one ISIN, its ISIN one CUSIP);
#   2. its ISIN filed with several CUSIPs: figi-offers.yaml then keeps it only
#      when FIGI agrees on exactly one of them.
# A pair whose ISIN has one CUSIP but whose CUSIP has several ISINs is
# dropped, as in the count of 2026-10-15 (security_figi_attachment.py).
execution: {profile: source.read, workers: 1, max_artifacts: 512}
read:
  format: json
  limits: {max_bytes: 16777216, max_records: 1000000}
  tables:
    agreed:
      each: tables.pairs
      select:
        choose:
          condition: {equal: {left: {value: {path: isin_cusips}}, right: {const: {value: 1}}}}
          then:
            choose:
              condition: {equal: {left: {value: {path: cusip_isins}}, right: {const: {value: 1}}}}
              then: {overlap: {left: {value: {path: cusip_figis}}, right: {value: {path: isin_figis}}}}
              # Its CUSIP has several ISINs: dropped (null excludes the row).
              else: {value: {path: NO_SUCH_COLUMN}}
          else: {overlap: {left: {value: {path: cusip_figis}}, right: {value: {path: isin_figis}}}}
      columns:
        cusip: {text: {path: cusip}}
        isin: {text: {path: isin}}
