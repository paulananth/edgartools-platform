# Each Security row of combine.yaml's output as one record (`record`), read
# over the combine's pieces, for mdm.prepare (`record_column: record`), as the
# Dataset Contract sec.nport.security.v2 reads it (ticket 120; operator,
# 2026-10-20: "One master record"): its key; its CUSIP when the key is one;
# its ISIN (the key), or every ISIN filed with a CUSIP (ticket 138); and its
# filed facts, the CUSIP's or the ISIN-only holding's. The combine's output
# comes in pieces of at most 8 MiB, one artifact each (2026 Q2: more than one).
execution: {profile: source.read, workers: 1, max_artifacts: 512}
read:
  format: json
  limits: {max_bytes: 16777216, max_records: 1000000}
  tables:
    security:
      each: tables.security
      columns:
        record:
          object:
            omit_nulls: true
            fields:
              key: {text: {path: key}}
              period: {value: {path: period}}
              cusip:
                choose:
                  condition: {equal: {left: {join: {path: kind_sample, item_path: key_kind, separator: "", max_items: 1}}, right: {const: {value: isin}}}}
                  then: {value: {path: NO_SUCH_FIELD}}
                  else: {text: {path: key}}
              isin:
                choose:
                  condition: {equal: {left: {join: {path: kind_sample, item_path: key_kind, separator: "", max_items: 1}}, right: {const: {value: isin}}}}
                  then: {text: {path: key}}
                  else: {value: {path: isin}}
              name:
                coalesce:
                  skip: "null"
                  values:
                  - {value: {path: name}}
                  - {value: {path: isin_name}}
              title:
                coalesce:
                  skip: "null"
                  values:
                  - {value: {path: title}}
                  - {value: {path: isin_title}}
              # The class from the level whose letters `classes` reads
              # (ticket 130).
              class:
                choose:
                  condition: {test: {path: classes, kind: present}}
                  then: {value: {path: class}}
                  else:
                    choose:
                      condition: {test: {path: isin_classes, kind: present}}
                      then: {value: {path: isin_class}}
                      else: {value: {path: NO_SUCH_FIELD}}
              classes:
                coalesce:
                  skip: "null"
                  values:
                  - {value: {path: classes}}
                  - {value: {path: isin_classes}}
              lei:
                coalesce:
                  skip: "null"
                  values:
                  - {value: {path: lei}}
                  - {value: {path: isin_lei}}
              issuer:
                coalesce:
                  skip: "null"
                  values:
                  - {value: {path: issuer}}
                  - {value: {path: isin_issuer}}
              filed:
                coalesce:
                  skip: "null"
                  values:
                  - {value: {path: filed}}
                  - {value: {path: isin_filed}}
              # The most-filed value of each fact (ticket 138).
              asset_category: {value: {path: asset_category}}
              issuer_type: {value: {path: issuer_type}}
              investment_country: {value: {path: investment_country}}
              currency: {value: {path: currency}}
              restricted: {value: {path: restricted}}
              derivative_category: {value: {path: derivative_category}}
