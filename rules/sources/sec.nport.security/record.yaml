pass:
  context: {batch: first}
  pieces: {step: combine.yaml}
# Each Security row of combine.yaml's output as one record (`record`), read
# over the combine's pieces, for mdm.prepare (`record_column: record`), as the
# Dataset Contract sec.nport.security.v2 reads it (ticket 120; operator,
# 2026-10-20: "One master record"): its key; its CUSIP when the key is one;
# its ISIN (the key), or every ISIN filed with a CUSIP (ticket 138); and its
# filed facts, the CUSIP's or the ISIN-only holding's. The combine's output
# comes in pieces of at most 8 MiB, one artifact each (2026 Q2: more than one).
execution: {profile: source.read, workers: 1, max_artifacts: 512}
read:
  format: json
  limits: {max_bytes: 16777216, max_records: 1000000}
  # The batch this reading publishes (ticket 190; operator, 2026-11-04: "Second batch after CUSIP and ISIN"):
  # `first` the Securities keyed by a CUSIP or an ISIN, `other` those keyed by a SEDOL or a LoanX, which
  # a second target publishes after the first has merged, so each finds the Security already holding its
  # value (records of one batch never match each other). One definition of the record for both.
  context:
    batch: {type: text}
  tables:
    security:
      each: tables.security
      select:
        choose:
          condition:
            equal:
              left:
                choose:
                  condition: {equal: {left: {join: {path: kind_sample, item_path: key_kind, separator: "", max_items: 1}}, right: {const: {value: sedol}}}}
                  then: {const: {value: other}}
                  else:
                    choose:
                      condition: {equal: {left: {join: {path: kind_sample, item_path: key_kind, separator: "", max_items: 1}}, right: {const: {value: loanx}}}}
                      then: {const: {value: other}}
                      else:
                        choose:
                          condition: {equal: {left: {join: {path: kind_sample, item_path: key_kind, separator: "", max_items: 1}}, right: {const: {value: figi}}}}
                          then: {const: {value: other}}
                          else: {const: {value: first}}
              right: {context: {name: batch}}
          then: {test: {path: key, kind: present}}
          else: {value: {path: NO_SUCH_FIELD}}
      columns:
        record:
          object:
            omit_nulls: true
            fields:
              key: {text: {path: key}}
              # The class of the key, which the SEDOL and LoanX rules read (kinds/security.yaml).
              key_class: {join: {path: kind_sample, item_path: key_kind, separator: "", max_items: 1}}
              period: {value: {path: period}}
              cusip:
                choose:
                  condition: {equal: {left: {join: {path: kind_sample, item_path: key_kind, separator: "", max_items: 1}}, right: {const: {value: cusip}}}}
                  then: {text: {path: key}}
                  else: {value: {path: NO_SUCH_FIELD}}
              # An ISIN is the key of an ISIN-only holding, or every ISIN filed with a CUSIP (ticket 138);
              # a SEDOL or a LoanX is the key of a holding with neither (ticket 190), else it joins the
              # key's Security (ticket 125). A key is the one class its `key_kind` names.
              isin:
                choose:
                  condition: {equal: {left: {join: {path: kind_sample, item_path: key_kind, separator: "", max_items: 1}}, right: {const: {value: isin}}}}
                  then: {text: {path: key}}
                  else:
                    choose:
                      condition: {equal: {left: {join: {path: kind_sample, item_path: key_kind, separator: "", max_items: 1}}, right: {const: {value: cusip}}}}
                      then: {value: {path: isin}}
                      else: {value: {path: NO_SUCH_FIELD}}
              sedol:
                choose:
                  condition: {equal: {left: {join: {path: kind_sample, item_path: key_kind, separator: "", max_items: 1}}, right: {const: {value: sedol}}}}
                  then: {text: {path: key}}
                  else: {value: {path: sedol}}
              # A FIGI is only a lookup: the key of a holding with nothing else, never an identifier (ticket 139).
              figi:
                choose:
                  condition: {equal: {left: {join: {path: kind_sample, item_path: key_kind, separator: "", max_items: 1}}, right: {const: {value: figi}}}}
                  then: {text: {path: key}}
                  else: {value: {path: NO_SUCH_FIELD}}
              loanx:
                choose:
                  condition: {equal: {left: {join: {path: kind_sample, item_path: key_kind, separator: "", max_items: 1}}, right: {const: {value: loanx}}}}
                  then: {text: {path: key}}
                  else: {value: {path: loanx}}
              name:
                coalesce:
                  skip: "null"
                  values:
                  - {value: {path: name}}
                  - {value: {path: no_cusip_name}}
              title:
                coalesce:
                  skip: "null"
                  values:
                  - {value: {path: title}}
                  - {value: {path: no_cusip_title}}
              # The class from the level whose letters `classes` reads
              # (ticket 130).
              class:
                choose:
                  condition: {test: {path: classes, kind: present}}
                  then: {value: {path: class}}
                  else:
                    choose:
                      condition: {test: {path: no_cusip_classes, kind: present}}
                      then: {value: {path: no_cusip_class}}
                      else: {value: {path: NO_SUCH_FIELD}}
              classes:
                coalesce:
                  skip: "null"
                  values:
                  - {value: {path: classes}}
                  - {value: {path: no_cusip_classes}}
              lei:
                coalesce:
                  skip: "null"
                  values:
                  - {value: {path: lei}}
                  - {value: {path: no_cusip_lei}}
              issuer:
                coalesce:
                  skip: "null"
                  values:
                  - {value: {path: issuer}}
                  - {value: {path: no_cusip_issuer}}
              filed:
                coalesce:
                  skip: "null"
                  values:
                  - {value: {path: filed}}
                  - {value: {path: no_cusip_filed}}
              # The most-filed value of each fact (ticket 138).
              asset_category: {value: {path: asset_category}}
              issuer_type: {value: {path: issuer_type}}
              investment_country: {value: {path: investment_country}}
              currency: {value: {path: currency}}
              restricted: {value: {path: restricted}}
              derivative_category: {value: {path: derivative_category}}
