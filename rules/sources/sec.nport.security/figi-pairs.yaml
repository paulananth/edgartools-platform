# Each CUSIP and ISIN pair filed on one holding (combine-pairs.yaml's output,
# `pairs`), with the FIGIs OpenFIGI gave its CUSIP (`cusips`) and its ISIN
# (`isins`), each figi-found.yaml's output (ticket 80). An identifier OpenFIGI
# did not find gets null. Each identifier was asked once, so `one` never
# chooses. Pin canonical JSON of this file as the source.combine contract.
execution:
  profile: source.combine
combine:
  max_rows: 10000000
  groups:
    cusip_figis: {source: cusips, table: found, key: id, value: figis, mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {}}
    isin_figis: {source: isins, table: found, key: id, value: figis, mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {}}
  tables:
    pairs:
      source: pairs
      table: pairs
      checks: {}
      where: {}
      joins:
        cusip_figis: {group: cusip_figis, key: cusip, on_missing: empty, replace: false}
        isin_figis: {group: isin_figis, key: isin, on_missing: empty, replace: false}
