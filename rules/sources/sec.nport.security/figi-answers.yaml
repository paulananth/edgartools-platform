# OpenFIGI's mapping answers as captured (ticket 80): each file is a list of up
# to 100 answers in the order of its request's jobs. An answer is `data` (its
# listings), `warning` (nothing found) or `error` (the identifier refused). One
# row per answer: the identifier it was asked for (from figi-requests.yaml's
# reading of the same files, by batch and position) and the FIGIs of its
# listings, each listing's own and its composite's (a bond or loan has no
# composite). Share-class FIGIs are left out: counted, they change nothing
# (onboarding log, 2026-10-15). An answer with no `data` gives null.
execution: {profile: source.read, workers: 1, max_artifacts: 512}
read:
  format: json
  # Measured (2026-10-15 capture): the largest answer file is 2,595,854 bytes.
  limits: {max_bytes: 16777216, max_records: 100}
  context:
    batch: {type: text}
  lookup_sets:
    asked: {max_values: 51200, max_bytes: 4194304, max_value_bytes: 64, pairs: true}
  tables:
    found:
      each: item
      columns:
        id:
          member_value:
            lookup: asked
            key: {concat: [{context: {name: batch}}, {const: {value: ":"}}, {ordinal: {}}]}
            on_many: error
        figis:
          pluck:
            value: {value: {path: data}}
            fields: [figi, compositeFIGI]
