pass:
  units: {each: file}
  context: {period: {fact: period}}
  lookups:
    series: {column: lei_key, from: sec.nport.fund/source.yaml, max_input_bytes: 268435456, max_input_rows: 1000000, table: filing, value_column: series_id}
    figi: {column: holding, from: identifiers.yaml, max_input_bytes: 268435456, max_input_rows: 10000000, table: figi, value_column: figi}
    isin: {column: holding, from: identifiers.yaml, max_input_bytes: 268435456, max_input_rows: 10000000, table: isin, value_column: isin}
    loanx: {column: holding, from: identifiers.yaml, max_input_bytes: 268435456, max_input_rows: 10000000, table: loanx, value_column: loanx}
    sedol: {column: holding, from: identifiers.yaml, max_input_bytes: 268435456, max_input_rows: 10000000, table: sedol, value_column: sedol}
    filed: {column: accession_number, from: filings.yaml, max_input_bytes: 67108864, max_input_rows: 1000000, table: filed, value_column: filed}
# Each holding's issuer LEI, read once from FUND_REPORTED_HOLDING.tsv for
# ISSUED_BY (rebuild-priorities ticket 22; operator, 2026-10-16: "By issuer LEI
# (Recommended)"): by CUSIP (table `security_issuer`), and by ISIN for a
# holding with no usable CUSIP (table `no_cusip_issuer`, ticket 102), its ISIN
# taken as source.yaml takes it, from the `isin` pair set. A holding whose
# issuer LEI is not 20 letters and digits ending in two digits (blank, "N/A",
# all zeros), or with no CUSIP or ISIN to hang it on, is not read.
# A fund's share is issued by its fund series, not the umbrella trust (ticket
# 234; operator, 2026-11-14: "Yes", replacing "Umbrella trust (Recommended)",
# 2026-10-17): the `series` pair set (sec.nport.fund's reading of the same
# quarter: each series' LEI to its SEC series id, none for an LEI two series
# file) turns a filed series LEI into its series id, in tables
# `security_series` and `no_cusip_series`; the LEI tables keep only the
# holdings that name no series. A holding naming the trust beside others
# naming its series (70 and 180 for one ETF, 2026q2) leaves the series the
# issuer. The same expressions are in both pairs of tables: keep them in step. issuer-reduce.yaml counts the LEIs of each CUSIP and each ISIN;
# combine.yaml keeps the one LEI of a key that has one.
execution: {profile: source.read, workers: 1, max_artifacts: 1}
read:
  format: json
  limits: {max_bytes: 1048576, max_records: 1}
  lookup_sets:
    isin: {max_values: 10000000, max_bytes: 268435456, max_value_bytes: 64, pairs: true}
    sedol: {max_values: 10000000, max_bytes: 268435456, max_value_bytes: 64, pairs: true}
    loanx: {max_values: 10000000, max_bytes: 268435456, max_value_bytes: 64, pairs: true}
    figi: {max_values: 10000000, max_bytes: 268435456, max_value_bytes: 64, pairs: true}
    series: {max_values: 1000000, max_bytes: 67108864, max_value_bytes: 64, pairs: true}
    # Each filing's date by its accession number (filings.yaml, ticket 113).
    filed: {max_values: 1000000, max_bytes: 67108864, max_value_bytes: 64, pairs: true}
  # The quarter's data set period, supplied by the run: a holding whose filing
  # has no date takes the quarter's date (operator, 2026-10-19: "use the
  # filing date or quarter date or inception date"; ticket 113).
  context:
    period: {type: text}
  tables:
    security_issuer:
      each: .
      select:
        choose:
          condition:
            equal:
              left:
                text:
                  path: ISSUER_CUSIP
                  default: ""
                  transforms: [{case: upper}]
                  null_if: ["", "000000000", "999999999"]
              right: {value: {path: NO_SUCH_COLUMN}}
          then: {value: {path: NO_SUCH_COLUMN}}
          else:
            choose:
              condition:
                equal:
                  left:
                    text:
                      path: ISSUER_LEI
                      default: ""
                      transforms:
                      - {case: upper}
                      - {regex_replace: {pattern: '^.*[^A-Z0-9].*$|^.{0,19}$|^.{21,}$|^.{18}[A-Z].$|^.{19}[A-Z]$|^0{20}$', with: ''}}
                      null_if: [""]
                  right: {value: {path: NO_SUCH_COLUMN}}
              then: {value: {path: NO_SUCH_COLUMN}}
              else:
                # A holding naming a fund series goes to `security_series`.
                equal:
                  left: {member_value: {lookup: series, key: {text: {path: ISSUER_LEI, default: "", transforms: [{case: upper}]}}, on_many: "null"}}
                  right: {value: {path: NO_SUCH_COLUMN}}
      columns:
        cusip:
          text:
            path: ISSUER_CUSIP
            default: ""
            transforms: [{case: upper}]
        # The holding's filing date (YYYY-MM-DD), else the quarter's: an
        # ISSUED_BY link starts at the earliest (ticket 113).
        filed:
          coalesce:
            skip: "null"
            values:
            - member_value: {lookup: filed, key: {text: {path: ACCESSION_NUMBER}}, on_many: "null"}
            - transform: {value: {context: {name: period}}, transforms: [{regex_replace: {pattern: 'T.*$', with: ''}}]}
        issuer_lei: {text: {path: ISSUER_LEI, default: "", transforms: [{case: upper}]}}
    security_series:
      each: .
      select:
        choose:
          condition:
            equal:
              left:
                text:
                  path: ISSUER_CUSIP
                  default: ""
                  transforms: [{case: upper}]
                  null_if: ["", "000000000", "999999999"]
              right: {value: {path: NO_SUCH_COLUMN}}
          then: {value: {path: NO_SUCH_COLUMN}}
          else:
            choose:
              condition:
                equal:
                  left:
                    text:
                      path: ISSUER_LEI
                      default: ""
                      transforms:
                      - {case: upper}
                      - {regex_replace: {pattern: '^.*[^A-Z0-9].*$|^.{0,19}$|^.{21,}$|^.{18}[A-Z].$|^.{19}[A-Z]$|^0{20}$', with: ''}}
                      null_if: [""]
                  right: {value: {path: NO_SUCH_COLUMN}}
              then: {value: {path: NO_SUCH_COLUMN}}
              else:
                choose:
                  condition:
                    equal:
                      left: {member_value: {lookup: series, key: {text: {path: ISSUER_LEI, default: "", transforms: [{case: upper}]}}, on_many: "null"}}
                      right: {value: {path: NO_SUCH_COLUMN}}
                  then: {value: {path: NO_SUCH_COLUMN}}
                  else: {test: {path: HOLDING_ID, kind: present}}
      columns:
        cusip:
          text:
            path: ISSUER_CUSIP
            default: ""
            transforms: [{case: upper}]
        # The holding's filing date (YYYY-MM-DD), else the quarter's: an
        # ISSUED_BY link starts at the earliest (ticket 113).
        filed:
          coalesce:
            skip: "null"
            values:
            - member_value: {lookup: filed, key: {text: {path: ACCESSION_NUMBER}}, on_many: "null"}
            - transform: {value: {context: {name: period}}, transforms: [{regex_replace: {pattern: 'T.*$', with: ''}}]}
        issuer_series: {member_value: {lookup: series, key: {text: {path: ISSUER_LEI, default: "", transforms: [{case: upper}]}}, on_many: "null"}}
    no_cusip_issuer:
      each: .
      select:
        choose:
          condition:
            equal:
              left:
                text:
                  path: ISSUER_CUSIP
                  default: ""
                  transforms: [{case: upper}]
                  null_if: ["", "000000000", "999999999"]
              right: {value: {path: NO_SUCH_COLUMN}}
          then:
            choose:
              condition:
                equal:
                  left: {coalesce: {skip: "null", values: [{member_value: {lookup: isin, key: {text: {path: HOLDING_ID}}, on_many: "null"}}, {member_value: {lookup: sedol, key: {text: {path: HOLDING_ID}}, on_many: "null"}}, {member_value: {lookup: loanx, key: {text: {path: HOLDING_ID}}, on_many: "null"}}, {member_value: {lookup: figi, key: {text: {path: HOLDING_ID}}, on_many: "null"}}]}}
                  right: {value: {path: NO_SUCH_COLUMN}}
              then: {value: {path: NO_SUCH_COLUMN}}
              else:
                choose:
                  condition:
                    equal:
                      left:
                        text:
                          path: ISSUER_LEI
                          default: ""
                          transforms:
                          - {case: upper}
                          - {regex_replace: {pattern: '^.*[^A-Z0-9].*$|^.{0,19}$|^.{21,}$|^.{18}[A-Z].$|^.{19}[A-Z]$|^0{20}$', with: ''}}
                          null_if: [""]
                      right: {value: {path: NO_SUCH_COLUMN}}
                  then: {value: {path: NO_SUCH_COLUMN}}
                  else:
                    equal:
                      left: {member_value: {lookup: series, key: {text: {path: ISSUER_LEI, default: "", transforms: [{case: upper}]}}, on_many: "null"}}
                      right: {value: {path: NO_SUCH_COLUMN}}
          else: {value: {path: NO_SUCH_COLUMN}}
      columns:
        no_cusip_key: {coalesce: {skip: "null", values: [{member_value: {lookup: isin, key: {text: {path: HOLDING_ID}}, on_many: "null"}}, {member_value: {lookup: sedol, key: {text: {path: HOLDING_ID}}, on_many: "null"}}, {member_value: {lookup: loanx, key: {text: {path: HOLDING_ID}}, on_many: "null"}}, {member_value: {lookup: figi, key: {text: {path: HOLDING_ID}}, on_many: "null"}}]}}
        # The holding's filing date (YYYY-MM-DD), else the quarter's: an
        # ISSUED_BY link starts at the earliest (ticket 113).
        filed:
          coalesce:
            skip: "null"
            values:
            - member_value: {lookup: filed, key: {text: {path: ACCESSION_NUMBER}}, on_many: "null"}
            - transform: {value: {context: {name: period}}, transforms: [{regex_replace: {pattern: 'T.*$', with: ''}}]}
        issuer_lei: {text: {path: ISSUER_LEI, default: "", transforms: [{case: upper}]}}
    no_cusip_series:
      each: .
      select:
        choose:
          condition:
            equal:
              left:
                text:
                  path: ISSUER_CUSIP
                  default: ""
                  transforms: [{case: upper}]
                  null_if: ["", "000000000", "999999999"]
              right: {value: {path: NO_SUCH_COLUMN}}
          then:
            choose:
              condition:
                equal:
                  left: {coalesce: {skip: "null", values: [{member_value: {lookup: isin, key: {text: {path: HOLDING_ID}}, on_many: "null"}}, {member_value: {lookup: sedol, key: {text: {path: HOLDING_ID}}, on_many: "null"}}, {member_value: {lookup: loanx, key: {text: {path: HOLDING_ID}}, on_many: "null"}}, {member_value: {lookup: figi, key: {text: {path: HOLDING_ID}}, on_many: "null"}}]}}
                  right: {value: {path: NO_SUCH_COLUMN}}
              then: {value: {path: NO_SUCH_COLUMN}}
              else:
                choose:
                  condition:
                    equal:
                      left:
                        text:
                          path: ISSUER_LEI
                          default: ""
                          transforms:
                          - {case: upper}
                          - {regex_replace: {pattern: '^.*[^A-Z0-9].*$|^.{0,19}$|^.{21,}$|^.{18}[A-Z].$|^.{19}[A-Z]$|^0{20}$', with: ''}}
                          null_if: [""]
                      right: {value: {path: NO_SUCH_COLUMN}}
                  then: {value: {path: NO_SUCH_COLUMN}}
                  else:
                    choose:
                      condition:
                        equal:
                          left: {member_value: {lookup: series, key: {text: {path: ISSUER_LEI, default: "", transforms: [{case: upper}]}}, on_many: "null"}}
                          right: {value: {path: NO_SUCH_COLUMN}}
                      then: {value: {path: NO_SUCH_COLUMN}}
                      else: {test: {path: HOLDING_ID, kind: present}}
          else: {value: {path: NO_SUCH_COLUMN}}
      columns:
        no_cusip_key: {coalesce: {skip: "null", values: [{member_value: {lookup: isin, key: {text: {path: HOLDING_ID}}, on_many: "null"}}, {member_value: {lookup: sedol, key: {text: {path: HOLDING_ID}}, on_many: "null"}}, {member_value: {lookup: loanx, key: {text: {path: HOLDING_ID}}, on_many: "null"}}, {member_value: {lookup: figi, key: {text: {path: HOLDING_ID}}, on_many: "null"}}]}}
        # The holding's filing date (YYYY-MM-DD), else the quarter's: an
        # ISSUED_BY link starts at the earliest (ticket 113).
        filed:
          coalesce:
            skip: "null"
            values:
            - member_value: {lookup: filed, key: {text: {path: ACCESSION_NUMBER}}, on_many: "null"}
            - transform: {value: {context: {name: period}}, transforms: [{regex_replace: {pattern: 'T.*$', with: ''}}]}
        issuer_series: {member_value: {lookup: series, key: {text: {path: ISSUER_LEI, default: "", transforms: [{case: upper}]}}, on_many: "null"}}
  stream:
    framing: delimited
    delimited: {format: tsv, encoding: utf-8}
    container: zip
    member: FUND_REPORTED_HOLDING.tsv
    max_input_bytes: 1000000000
    max_bytes: 2000000000
    max_record: 1048576
    max_records: 20000000
    max_depth: 64
    ordinal_context: null
    partition_bytes: 8388608
    partition_records: 100000
    max_partitions: 100000
    max_spool_bytes: 17179869184
    max_output_rows: 40000000
