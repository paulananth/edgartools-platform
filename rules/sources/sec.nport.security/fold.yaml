# The facts of each ISIN-only holding whose ISIN FIGI attaches to a CUSIP one to
# one (ticket 120; operator, 2026-10-20: "One master record"), each row given
# that CUSIP (`cusip`, null for an ISIN attached to none, which combine.yaml skips), so combine.yaml
# can join them onto the CUSIP's row by its key: a combine joins only on a
# field its rows already hold. Inputs: the reduction's output (`securities`),
# figi-attach.yaml's output (`attached`) and issuer-reduce.yaml's output
# (`issuers`). Pin canonical JSON of this file as the source.combine contract.
execution:
  profile: source.combine
combine:
  max_rows: 10000000
  groups:
    isin_cusip: {source: attached, table: attached, key: isin, value: cusip, mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {cusip_offers: 1, isin_offers: 1}}
  tables:
    names:
      source: securities
      table: isin_names
      checks: {}
      where: {}
      joins:
        cusip: {group: isin_cusip, key: isin, on_missing: empty, replace: false}
    titles:
      source: securities
      table: isin_titles
      checks: {}
      where: {}
      joins:
        cusip: {group: isin_cusip, key: isin, on_missing: empty, replace: false}
    classes:
      source: securities
      table: isin_classes
      checks: {}
      where: {}
      joins:
        cusip: {group: isin_cusip, key: isin, on_missing: empty, replace: false}
    leis:
      source: securities
      table: isin_leis
      checks: {}
      where: {}
      joins:
        cusip: {group: isin_cusip, key: isin, on_missing: empty, replace: false}
    issuers:
      source: issuers
      table: isin_issuers
      checks: {}
      where: {}
      joins:
        cusip: {group: isin_cusip, key: isin, on_missing: empty, replace: false}
    filed:
      source: issuers
      table: isin_filed
      checks: {}
      where: {}
      joins:
        cusip: {group: isin_cusip, key: isin, on_missing: empty, replace: false}
