# One row per Security (table `security`, ticket 120), keyed by its usable
# CUSIP, else the ISIN of a holding with no usable CUSIP, joined with its filed
# name, title, share class (ticket 130) and issuer LEI; a CUSIP also with every
# ISIN filed with it (ticket 138); and each, CUSIP (ticket 22) or ISIN (ticket
# 102), with its issuer's LEI when it is filed with exactly one. No pairing by
# FIGI here (ticket 138; operator, 2026-10-25: "first lookup if not exists
# then master"): an ISIN-only row and a CUSIP's row filed with that ISIN meet
# in MDM by the ISIN. Inputs: the reduction's output (`securities`) and
# issuer-reduce.yaml's (`issuers`). Pin canonical JSON of this file as the
# source.combine contract.
execution:
  profile: source.combine
combine:
  max_rows: 10000000
  groups:
    cusip_name: {source: securities, table: cusip_names, key: cusip, value: ., mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {}}
    cusip_title: {source: securities, table: cusip_titles, key: cusip, value: ., mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {}}
    cusip_lei: {source: securities, table: cusip_leis, key: cusip, value: ., mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {}}
    # The share class only when the equity holdings name exactly one (ticket
    # 130); `one` never chooses. `*_classes` keep every letter, for the
    # quality check.
    cusip_class: {source: securities, table: cusip_classes, key: cusip, value: class_sample, mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {classes: 1}}
    cusip_classes: {source: securities, table: cusip_classes, key: cusip, value: ., mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {}}
    # Every ISIN filed with the CUSIP, each once (ticket 138): MDM binds the
    # record by its CUSIP first, then an ISIN, and adds an ISIN only when no
    # Security holds it.
    filed_isins: {source: securities, table: pairs, key: cusip, value: isin, mode: collect, order_by: [isin], distinct: true, skip_null_values: true, checks: {}, where: {}}
    # The issuer's LEI only when every holding of the CUSIP that states one
    # states the same (operator, 2026-10-16: "By issuer LEI (Recommended)");
    # `one` never chooses.
    cusip_issuer: {source: issuers, table: cusip_issuers, key: cusip, value: issuer_sample, mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {issuers: 1}}
    # The earliest filing date of the CUSIP's holdings that name an issuer
    # (ticket 113): the ISSUED_BY link's start.
    cusip_filed: {source: issuers, table: cusip_filed, key: cusip, value: filed_sample, mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {}}
    isin_filed: {source: issuers, table: isin_filed, key: isin, value: filed_sample, mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {}}
    isin_name: {source: securities, table: isin_names, key: isin, value: ., mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {}}
    isin_title: {source: securities, table: isin_titles, key: isin, value: ., mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {}}
    isin_lei: {source: securities, table: isin_leis, key: isin, value: ., mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {}}
    isin_class: {source: securities, table: isin_classes, key: isin, value: class_sample, mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {classes: 1}}
    isin_classes: {source: securities, table: isin_classes, key: isin, value: ., mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {}}
    # As `cusip_issuer`, for an ISIN-only Security (ticket 102).
    isin_issuer: {source: issuers, table: isin_issuers, key: isin, value: issuer_sample, mode: one, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {issuers: 1}}
  tables:
    # One row per Security (ticket 120; operator, 2026-10-20: "One master
    # record"), keyed by its CUSIP, else its ISIN (reduce.yaml's `keys`). The
    # CUSIP's facts and the ISIN-only holding's facts join by that one key: a key
    # is one or the other, never both, so a row takes only its own kind's.
    security:
      source: securities
      table: keys
      checks: {}
      where: {}
      joins:
        name: {group: cusip_name, key: key, on_missing: skip, replace: false}
        title: {group: cusip_title, key: key, on_missing: skip, replace: false}
        lei: {group: cusip_lei, key: key, on_missing: skip, replace: false}
        class: {group: cusip_class, key: key, on_missing: skip, replace: false}
        classes: {group: cusip_classes, key: key, on_missing: skip, replace: false}
        isin: {group: filed_isins, key: key, on_missing: skip, replace: false}
        issuer: {group: cusip_issuer, key: key, on_missing: skip, replace: false}
        filed: {group: cusip_filed, key: key, on_missing: skip, replace: false}
        isin_name: {group: isin_name, key: key, on_missing: skip, replace: false}
        isin_title: {group: isin_title, key: key, on_missing: skip, replace: false}
        isin_lei: {group: isin_lei, key: key, on_missing: skip, replace: false}
        isin_class: {group: isin_class, key: key, on_missing: skip, replace: false}
        isin_classes: {group: isin_classes, key: key, on_missing: skip, replace: false}
        isin_issuer: {group: isin_issuer, key: key, on_missing: skip, replace: false}
        isin_filed: {group: isin_filed, key: key, on_missing: skip, replace: false}
