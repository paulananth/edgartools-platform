# SEC Form N-PORT holdings, read for the Security master (ticket 79, part 1),
# from the approved N-PORT findings (profiling/sec.nport-2026q2-final,
# approved 2026-10-15 06:29 ET). Rulings it rests on (operator):
# - "CUSIP and ISIN join" (2026-10-14): one CUSIP is one Security; an ISIN
#   joins too; ticker, FIGI and SEDOL are lookup only.
# - "One master record" (2026-10-20, ticket 120; it replaces "Two contracts
#   (Recommended)", 2026-10-15): sec.nport.security.v2, one record per
#   Security, keyed by its CUSIP, else by the ISIN of a holding with no usable
#   CUSIP.
# - "first lookup if not exists then master", "cusip is a seperate than isin
#   it can never be merges", "bind by CUSIP if matches if not then try isin"
#   (2026-10-25, ticket 138): a CUSIP record carries every ISIN filed with
#   it, and MDM binds it by the CUSIP, else an ISIN, adding an ISIN only when
#   no Security holds it; no pairing by FIGI in these rules.
# - "Registrant yes, issuer later" (2026-10-14): the issuer's name, title and
#   LEI stay on the Security as filed (the LEI a filed word, not an
#   identifier: 179,389 holdings carry one failing its check digit).
# - "A" (13F, 2026-10-14): the filed words kept are each key's lexically first
#   spelling, as for 13F (ticket 84 may replace it).
# The run, in order: identifiers.yaml (IDENTIFIERS.tsv, streamed) gives the
# pair set `isin` (holding to ISIN, ticket 91); this reading streams
# FUND_REPORTED_HOLDING.tsv once and gives each holding its ISIN with
# `member_value` (none when the holding has none or several); reduce.yaml
# groups by CUSIP, by ISIN and by pair; reduce.yaml's `keys` lists each
# Security once by its one key; combine.yaml joins the filed words and every
# ISIN filed with a CUSIP onto each; mdm.prepare reads table `security`.
# A usable CUSIP is filed and not a stand-in (000000000, 999999999:
# rules/identifiers/cusip.yaml); one failing its check digit stays a CUSIP
# record and is set aside by the Dataset Contract, counted.
source: sec.nport.security
bronze:
  family: sec.nport-datasets
execution:
  profile: source.read
  workers: 1
  max_artifacts: 1
read:
  format: json
  limits:
    max_bytes: 1048576
    max_records: 1
  lookup_sets:
    isin:
      max_values: 10000000
      max_bytes: 268435456
      max_value_bytes: 64
      pairs: true
    sedol:
      max_values: 10000000
      max_bytes: 268435456
      max_value_bytes: 64
      pairs: true
    loanx:
      max_values: 10000000
      max_bytes: 268435456
      max_value_bytes: 64
      pairs: true
    figi:
      max_values: 10000000
      max_bytes: 268435456
      max_value_bytes: 64
      pairs: true
  # The quarter's data set period (an instant with its zone), supplied by the
  # run: a column of the holdings for silver; it dates no publication in MDM
  # (operator, 2026-10-19: "if at all it should be captured in silver not on
  # mdm"; ticket 113).
  context:
    period: {type: text}
  tables:
    security_cusip:
      each: .
      select:
        choose:
          condition:
            equal:
              left:
                text:
                  path: ISSUER_CUSIP
                  default: ""
                  transforms:
                  - case: upper
                  null_if:
                  - ""
                  - "000000000"
                  - "999999999"
              right:
                value:
                  path: NO_SUCH_COLUMN
          then:
            value:
              path: NO_SUCH_COLUMN
          else:
            test:
              path: HOLDING_ID
              kind: present
      columns:
        cusip:
          text:
            path: ISSUER_CUSIP
            default: ""
            transforms:
            - case: upper
            null_if:
            - ""
            - "000000000"
            - "999999999"
        # The Security's one key (ticket 120; operator, 2026-10-20: "One master
        # record"): its CUSIP, else its ISIN (security_no_cusip below). A CUSIP has 9
        # characters and an ISIN 12, so the two never meet.
        key:
          text:
            path: ISSUER_CUSIP
            default: ""
            transforms:
            - case: upper
            null_if:
            - ""
            - "000000000"
            - "999999999"
        issuer_name:
          text:
            path: ISSUER_NAME
            default: ""
        issuer_title:
          text:
            path: ISSUER_TITLE
            default: ""
        issuer_lei:
          text:
            path: ISSUER_LEI
            default: ""
        # Facts each holding repeats about its Security (ticket 138, "Most-filed
        # value"): reduce.yaml keeps the value the most holdings file, each
        # trimmed and upper-cased so one code's spellings count as one.
        asset_category: {text: {path: ASSET_CAT, default: "", transforms: [{case: upper}], null_if: [""]}}
        issuer_type: {text: {path: ISSUER_TYPE, default: "", transforms: [{case: upper}], null_if: [""]}}
        investment_country: {text: {path: INVESTMENT_COUNTRY, default: "", transforms: [{case: upper}], null_if: [""]}}
        currency: {text: {path: CURRENCY_CODE, default: "", transforms: [{case: upper}], null_if: [""]}}
        restricted: {text: {path: IS_RESTRICTED_SECURITY, default: "", transforms: [{case: upper}], null_if: [""]}}
        derivative_category: {text: {path: DERIVATIVE_CAT, default: "", transforms: [{case: upper}], null_if: [""]}}
        key_kind:
          const:
            value: cusip
        period:
          context: {name: period}
    cusip_isin:
      each: .
      select:
        choose:
          condition:
            equal:
              left:
                text:
                  path: ISSUER_CUSIP
                  default: ""
                  transforms:
                  - case: upper
                  null_if:
                  - ""
                  - "000000000"
                  - "999999999"
              right:
                value:
                  path: NO_SUCH_COLUMN
          then:
            value:
              path: NO_SUCH_COLUMN
          else:
            choose:
              condition:
                equal:
                  left:
                    member_value:
                      lookup: isin
                      key:
                        text:
                          path: HOLDING_ID
                      on_many: "null"
                  right:
                    value:
                      path: NO_SUCH_COLUMN
              then:
                value:
                  path: NO_SUCH_COLUMN
              else:
                test:
                  path: HOLDING_ID
                  kind: present
      columns:
        cusip:
          text:
            path: ISSUER_CUSIP
            default: ""
            transforms:
            - case: upper
            null_if:
            - ""
            - "000000000"
            - "999999999"
        isin:
          member_value:
            lookup: isin
            key:
              text:
                path: HOLDING_ID
            on_many: "null"
    security_no_cusip:
      each: .
      select:
        choose:
          condition:
            equal:
              left:
                text:
                  path: ISSUER_CUSIP
                  default: ""
                  transforms:
                  - case: upper
                  null_if:
                  - ""
                  - "000000000"
                  - "999999999"
              right:
                value:
                  path: NO_SUCH_COLUMN
          then:
            choose:
              condition:
                equal:
                  left:
                    coalesce:
                      skip: "null"
                      values:
                      - member_value: {lookup: isin, key: {text: {path: HOLDING_ID}}, on_many: "null"}
                      - member_value: {lookup: sedol, key: {text: {path: HOLDING_ID}}, on_many: "null"}
                      - member_value: {lookup: loanx, key: {text: {path: HOLDING_ID}}, on_many: "null"}
                      - member_value: {lookup: figi, key: {text: {path: HOLDING_ID}}, on_many: "null"}
                  right:
                    value:
                      path: NO_SUCH_COLUMN
              then:
                value:
                  path: NO_SUCH_COLUMN
              else:
                test:
                  path: HOLDING_ID
                  kind: present
          else:
            value:
              path: NO_SUCH_COLUMN
      columns:
        no_cusip_key:
          coalesce:
            skip: "null"
            values:
            - member_value: {lookup: isin, key: {text: {path: HOLDING_ID}}, on_many: "null"}
            - member_value: {lookup: sedol, key: {text: {path: HOLDING_ID}}, on_many: "null"}
            - member_value: {lookup: loanx, key: {text: {path: HOLDING_ID}}, on_many: "null"}
            - member_value: {lookup: figi, key: {text: {path: HOLDING_ID}}, on_many: "null"}
        key:
          coalesce:
            skip: "null"
            values:
            - member_value: {lookup: isin, key: {text: {path: HOLDING_ID}}, on_many: "null"}
            - member_value: {lookup: sedol, key: {text: {path: HOLDING_ID}}, on_many: "null"}
            - member_value: {lookup: loanx, key: {text: {path: HOLDING_ID}}, on_many: "null"}
            - member_value: {lookup: figi, key: {text: {path: HOLDING_ID}}, on_many: "null"}
        issuer_name:
          text:
            path: ISSUER_NAME
            default: ""
        issuer_title:
          text:
            path: ISSUER_TITLE
            default: ""
        issuer_lei:
          text:
            path: ISSUER_LEI
            default: ""
        asset_category: {text: {path: ASSET_CAT, default: "", transforms: [{case: upper}], null_if: [""]}}
        issuer_type: {text: {path: ISSUER_TYPE, default: "", transforms: [{case: upper}], null_if: [""]}}
        investment_country: {text: {path: INVESTMENT_COUNTRY, default: "", transforms: [{case: upper}], null_if: [""]}}
        currency: {text: {path: CURRENCY_CODE, default: "", transforms: [{case: upper}], null_if: [""]}}
        restricted: {text: {path: IS_RESTRICTED_SECURITY, default: "", transforms: [{case: upper}], null_if: [""]}}
        derivative_category: {text: {path: DERIVATIVE_CAT, default: "", transforms: [{case: upper}], null_if: [""]}}
        # Which class the key is (ticket 190): the first of the classes the holding files,
        # in the order of the key above.
        key_kind:
          coalesce:
            skip: "null"
            values:
            - choose:
                condition:
                  equal:
                    left: {member_value: {lookup: isin, key: {text: {path: HOLDING_ID}}, on_many: "null"}}
                    right: {value: {path: NO_SUCH_COLUMN}}
                then: {value: {path: NO_SUCH_COLUMN}}
                else: {const: {value: isin}}
            - choose:
                condition:
                  equal:
                    left: {member_value: {lookup: sedol, key: {text: {path: HOLDING_ID}}, on_many: "null"}}
                    right: {value: {path: NO_SUCH_COLUMN}}
                then: {value: {path: NO_SUCH_COLUMN}}
                else: {const: {value: sedol}}
            - choose:
                condition:
                  equal:
                    left: {member_value: {lookup: loanx, key: {text: {path: HOLDING_ID}}, on_many: "null"}}
                    right: {value: {path: NO_SUCH_COLUMN}}
                then: {value: {path: NO_SUCH_COLUMN}}
                else: {const: {value: loanx}}
            - choose:
                condition:
                  equal:
                    left: {member_value: {lookup: figi, key: {text: {path: HOLDING_ID}}, on_many: "null"}}
                    right: {value: {path: NO_SUCH_COLUMN}}
                then: {value: {path: NO_SUCH_COLUMN}}
                else: {const: {value: figi}}
        period:
          context: {name: period}
    key_sedol:
      each: .
      # A holding keyed by its usable CUSIP, else its ISIN, that also files one SEDOL
      # (identifiers.yaml): the SEDOL joins that Security (ticket 125). A holding with
      # no CUSIP or ISIN makes no row: keying a Security by a SEDOL alone is ticket 190's.
      select:
        choose:
          condition:
            equal:
              left:
                member_value: {lookup: sedol, key: {text: {path: HOLDING_ID}}, on_many: "null"}
              right: {value: {path: NO_SUCH_COLUMN}}
          then: {value: {path: NO_SUCH_COLUMN}}
          else:
            choose:
              condition:
                equal:
                  left:
                    coalesce:
                      skip: "null"
                      values:
                      - text: {path: ISSUER_CUSIP, default: "", transforms: [{case: upper}], null_if: ["", "000000000", "999999999"]}
                      - member_value: {lookup: isin, key: {text: {path: HOLDING_ID}}, on_many: "null"}
                  right: {value: {path: NO_SUCH_COLUMN}}
              then: {value: {path: NO_SUCH_COLUMN}}
              else: {test: {path: HOLDING_ID, kind: present}}
      columns:
        key:
          coalesce:
            skip: "null"
            values:
            - text: {path: ISSUER_CUSIP, default: "", transforms: [{case: upper}], null_if: ["", "000000000", "999999999"]}
            - member_value: {lookup: isin, key: {text: {path: HOLDING_ID}}, on_many: "null"}
        sedol:
          member_value: {lookup: sedol, key: {text: {path: HOLDING_ID}}, on_many: "null"}
    key_loanx:
      each: .
      # A holding keyed by its usable CUSIP, else its ISIN, that also files one LOANX
      # (identifiers.yaml): the LOANX joins that Security (ticket 125). A holding with
      # no CUSIP or ISIN makes no row: keying a Security by a LOANX alone is ticket 190's.
      select:
        choose:
          condition:
            equal:
              left:
                member_value: {lookup: loanx, key: {text: {path: HOLDING_ID}}, on_many: "null"}
              right: {value: {path: NO_SUCH_COLUMN}}
          then: {value: {path: NO_SUCH_COLUMN}}
          else:
            choose:
              condition:
                equal:
                  left:
                    coalesce:
                      skip: "null"
                      values:
                      - text: {path: ISSUER_CUSIP, default: "", transforms: [{case: upper}], null_if: ["", "000000000", "999999999"]}
                      - member_value: {lookup: isin, key: {text: {path: HOLDING_ID}}, on_many: "null"}
                  right: {value: {path: NO_SUCH_COLUMN}}
              then: {value: {path: NO_SUCH_COLUMN}}
              else: {test: {path: HOLDING_ID, kind: present}}
      columns:
        key:
          coalesce:
            skip: "null"
            values:
            - text: {path: ISSUER_CUSIP, default: "", transforms: [{case: upper}], null_if: ["", "000000000", "999999999"]}
            - member_value: {lookup: isin, key: {text: {path: HOLDING_ID}}, on_many: "null"}
        loanx:
          member_value: {lookup: loanx, key: {text: {path: HOLDING_ID}}, on_many: "null"}
    # The share class each equity holding's title names (ticket 130;
    # operator, 2026-10-22: "Approve the rule (Recommended)"): the letter
    # after CL, CLASS or CLS, from equity holdings (asset category EC) only,
    # so a bond tranche's "CL A" names none; a holding naming none is left
    # out, so reduce.yaml counts only the letters filed. The rows are
    # security_cusip's and security_no_cusip's.
    cusip_class:
      each: .
      select:
        choose:
          condition:
            equal:
              left:
                choose:
                  condition:
                    equal:
                      left:
                        text:
                          path: ASSET_CAT
                          default: ''
                      right:
                        const:
                          value: EC
                  then:
                    text:
                      path: ISSUER_TITLE
                      default: ''
                      transforms:
                      - case: upper
                      - regex_replace:
                          pattern: '[^A-Z]+'
                          with: ' '
                      - pad:
                          left: ' '
                          right: ' '
                      - regex_replace:
                          pattern: '^.* (CL|CLASS|CLS) '
                          with: '#'
                      - regex_replace:
                          pattern: ^[^#].*$
                          with: ''
                      - regex_replace:
                          pattern: ' .*$'
                          with: ''
                      - regex_replace:
                          pattern: ^#[A-Z][A-Z]+$
                          with: ''
                      - replace:
                          from: '#'
                          to: ''
                  else:
                    const:
                      value: ''
              right:
                const:
                  value: ''
          then:
            test:
              path: NO_SUCH_COLUMN
              kind: present
          else:
            choose:
              condition:
                equal:
                  left:
                    text:
                      path: ISSUER_CUSIP
                      default: ''
                      transforms:
                      - case: upper
                      null_if:
                      - ''
                      - '000000000'
                      - '999999999'
                  right:
                    value:
                      path: NO_SUCH_COLUMN
              then:
                value:
                  path: NO_SUCH_COLUMN
              else:
                test:
                  path: HOLDING_ID
                  kind: present
      columns:
        cusip:
          text:
            path: ISSUER_CUSIP
            default: ''
            transforms:
            - case: upper
            null_if:
            - ''
            - '000000000'
            - '999999999'
        share_class:
          choose:
            condition:
              equal:
                left:
                  text:
                    path: ASSET_CAT
                    default: ''
                right:
                  const:
                    value: EC
            then:
              text:
                path: ISSUER_TITLE
                default: ''
                transforms:
                - case: upper
                - regex_replace:
                    pattern: '[^A-Z]+'
                    with: ' '
                - pad:
                    left: ' '
                    right: ' '
                - regex_replace:
                    pattern: '^.* (CL|CLASS|CLS) '
                    with: '#'
                - regex_replace:
                    pattern: ^[^#].*$
                    with: ''
                - regex_replace:
                    pattern: ' .*$'
                    with: ''
                - regex_replace:
                    pattern: ^#[A-Z][A-Z]+$
                    with: ''
                - replace:
                    from: '#'
                    to: ''
            else:
              const:
                value: ''
    no_cusip_class:
      each: .
      select:
        choose:
          condition:
            equal:
              left:
                choose:
                  condition:
                    equal:
                      left:
                        text:
                          path: ASSET_CAT
                          default: ''
                      right:
                        const:
                          value: EC
                  then:
                    text:
                      path: ISSUER_TITLE
                      default: ''
                      transforms:
                      - case: upper
                      - regex_replace:
                          pattern: '[^A-Z]+'
                          with: ' '
                      - pad:
                          left: ' '
                          right: ' '
                      - regex_replace:
                          pattern: '^.* (CL|CLASS|CLS) '
                          with: '#'
                      - regex_replace:
                          pattern: ^[^#].*$
                          with: ''
                      - regex_replace:
                          pattern: ' .*$'
                          with: ''
                      - regex_replace:
                          pattern: ^#[A-Z][A-Z]+$
                          with: ''
                      - replace:
                          from: '#'
                          to: ''
                  else:
                    const:
                      value: ''
              right:
                const:
                  value: ''
          then:
            test:
              path: NO_SUCH_COLUMN
              kind: present
          else:
            choose:
              condition:
                equal:
                  left:
                    text:
                      path: ISSUER_CUSIP
                      default: ''
                      transforms:
                      - case: upper
                      null_if:
                      - ''
                      - '000000000'
                      - '999999999'
                  right:
                    value:
                      path: NO_SUCH_COLUMN
              then:
                choose:
                  condition:
                    equal:
                      left:
                        coalesce:
                          skip: "null"
                          values:
                          - member_value: {lookup: isin, key: {text: {path: HOLDING_ID}}, on_many: "null"}
                          - member_value: {lookup: sedol, key: {text: {path: HOLDING_ID}}, on_many: "null"}
                          - member_value: {lookup: loanx, key: {text: {path: HOLDING_ID}}, on_many: "null"}
                          - member_value: {lookup: figi, key: {text: {path: HOLDING_ID}}, on_many: "null"}
                      right:
                        value:
                          path: NO_SUCH_COLUMN
                  then:
                    value:
                      path: NO_SUCH_COLUMN
                  else:
                    test:
                      path: HOLDING_ID
                      kind: present
              else:
                value:
                  path: NO_SUCH_COLUMN
      columns:
        no_cusip_key:
          coalesce:
            skip: "null"
            values:
            - member_value: {lookup: isin, key: {text: {path: HOLDING_ID}}, on_many: "null"}
            - member_value: {lookup: sedol, key: {text: {path: HOLDING_ID}}, on_many: "null"}
            - member_value: {lookup: loanx, key: {text: {path: HOLDING_ID}}, on_many: "null"}
            - member_value: {lookup: figi, key: {text: {path: HOLDING_ID}}, on_many: "null"}
        share_class:
          choose:
            condition:
              equal:
                left:
                  text:
                    path: ASSET_CAT
                    default: ''
                right:
                  const:
                    value: EC
            then:
              text:
                path: ISSUER_TITLE
                default: ''
                transforms:
                - case: upper
                - regex_replace:
                    pattern: '[^A-Z]+'
                    with: ' '
                - pad:
                    left: ' '
                    right: ' '
                - regex_replace:
                    pattern: '^.* (CL|CLASS|CLS) '
                    with: '#'
                - regex_replace:
                    pattern: ^[^#].*$
                    with: ''
                - regex_replace:
                    pattern: ' .*$'
                    with: ''
                - regex_replace:
                    pattern: ^#[A-Z][A-Z]+$
                    with: ''
                - replace:
                    from: '#'
                    to: ''
            else:
              const:
                value: ''
  stream:
    framing: delimited
    delimited:
      format: tsv
      encoding: utf-8
    container: zip
    member: FUND_REPORTED_HOLDING.tsv
    max_input_bytes: 1000000000
    max_bytes: 2000000000
    max_record: 1048576
    max_records: 20000000
    max_depth: 64
    ordinal_context: null
    partition_bytes: 8388608
    partition_records: 100000
    max_partitions: 100000
    max_spool_bytes: 17179869184
    max_output_rows: 40000000
dataset_contracts:
  # One Dataset Contract for every Security (ticket 120; operator, 2026-10-20:
  # "One master record"): keyed by its CUSIP, else its ISIN. It replaces
  # sec.nport.security.v1 (CUSIPs) and sec.nport.security_isin.v1 (ISIN-only):
  # a new record key is a new dataset.
  sec.nport.security.v2:
    contract:
      provider: SEC
      family: sec.nport-datasets
      schema_version: sec-nport-security-v2
      record_key: the CUSIP, upper-cased, else the ISIN of a holding with no usable CUSIP; one record per Security over the quarter
      publication_key: the quarter's N-PORT data set file and the reduction and combine contracts
      effective_time: the run's as-of time; the quarter dates nothing in MDM, and a link
        starts at the earliest filing date (else the quarter's date) of the holdings that name its issuer
      semantics: patch
      completeness: the Securities one quarter's holdings name; no retirement by absence
      nonblocking_deferred_reasons:
      - invalid_cusip
      - invalid_cusip_checksum
      - invalid_isin
      - invalid_isin_checksum
      - invalid_sedol
      - invalid_sedol_checksum
      - invalid_loanx
      - invalid_figi
      - invalid_figi_checksum
      - missing_record_identity
      adapter:
        reading:
          source: sec.nport.security
          read:
            format: json
            limits:
              max_bytes: 33554432
              max_records: 1
            assertions:
            - test:
                test:
                  path: .
                  kind: object
              reason: Mapped input must be an object
            tables:
              mapped:
                each: .
                columns:
                  fields:
                    object:
                      fields:
                        name_of_issuer:
                          join:
                            path: name.name_sample
                            item_path: issuer_name
                            separator: ""
                            max_items: 1
                        title_of_class:
                          join:
                            path: title.title_sample
                            item_path: issuer_title
                            separator: ""
                            max_items: 1
                        # The share class (ticket 130): the one letter the
                        # equity holdings name; none when they name two
                        # (combine.yaml).
                        share_class:
                          join: {path: class, item_path: share_class, separator: "", max_items: 1}
                        # Facts its holdings repeat, each the value the most file, none
                        # on a tie (ticket 138, "Most-filed value"). Only here: the
                        # holding's silver row does not repeat them (one system of record).
                        asset_category: {value: {path: asset_category}}
                        issuer_type: {value: {path: issuer_type}}
                        investment_country: {value: {path: investment_country}}
                        currency: {value: {path: currency}}
                        restricted: {value: {path: restricted}}
                        derivative_category: {value: {path: derivative_category}}
                        # No issuer LEI field: an LEI identifies a Company, not a
                        # Security ("A value of another kind stays out of this
                        # kind"); the Security reaches its issuer by ISSUED_BY
                        # (ticket 22), and each holding's filed LEI is in silver
                        # (silver-holding.yaml; operator, 2026-10-22: "Fix 1").
                  matching:
                    object:
                      fields:
                        key_class: {value: {path: key_class}}
                        # Every letter the holdings name, for the quality
                        # check that lists a Security they disagree on.
                        share_classes_filed:
                          join: {path: classes.class_sample, item_path: share_class, separator: "", max_items: 26}
          input_fields:
          - key
          - key_class
          - cusip
          - name
          - title
          - class
          - classes
          - lei
          - isin
          - sedol
          - loanx
          - figi
          - issuer
          - filed
          - asset_category
          - issuer_type
          - investment_country
          - currency
          - restricted
          - derivative_category
        # v3 (ticket 138): a CUSIP's record carries every ISIN filed with it.
        # v4 (ticket 138): and the six facts its holdings file most.
        # v5 (ticket 199): an ISSUED_BY start is observed, not stated.
        version: sec-nport-security-v5
        retain_deferred: true
        source_record_provenance: true
        kind: security
        # The CUSIP or the ISIN, each checked as an identifier below, so a bad
        # check digit is still held back with its own reason.
        record_key:
        - key
        # The SEDOL and LoanX filed with the Security's key join it too (ticket 125;
        # operator, 2026-10-20: "SEDOL, CINS, LoanX (Recommended)"); a Security keyed
        # by one alone is ticket 190's.
        identifiers:
          cusip: cusip
          isin: isin
          sedol: sedol
          loanx: loanx
        identifier_formats:
          cusip: cusip
          isin: isin
          sedol: sedol
          loanx: loanx
        # A FIGI filed with no CUSIP, ISIN, SEDOL or LoanX finds the Security OpenFIGI gave it to and is never
        # that Security's: N-PORT does not issue FIGIs (ticket 139; Design 5, "Lookup only").
        cross_references:
          figi: figi
        cross_reference_formats:
          figi: figi
        # The Security is issued by the entity that holds its issuer's LEI
        # (ticket 22; operator, 2026-10-16: "By issuer LEI (Recommended)"): the
        # link names GLEIF's record of that LEI, and waits until that record is
        # mastered. A Security filed with no LEI, or with two, has no link.
        relationships:
        - type: ISSUED_BY
          each: issuer
          target_key: [item.issuer_lei]
          target_source: gleif.level1.v1
          # The link starts at the earliest filing date of the CUSIP's holdings
          # that name the issuer, a holding with none counting the quarter's
          # date (ticket 113; operator, 2026-10-19: "use the
          # filing date or quarter date or inception date"), and a link that
          # exists keeps its start (ISSUED_BY `keeps_start`).
          valid_from: filed.0.filed
          # The first filing that shows the link, not a start any source states.
          date_basis: observed
          time_format: date
          scope: SEC N-PORT issuer
bookkeeping:
  version: 2
  # One quarter's data set (the zip), its period a run fact (ticket 113), one
  # target (`mastering`) for its one Dataset Contract: every Security in one run
  # (ticket 120; `mastering_isin` retired with sec.nport.security_isin.v1). One
  # input comes from another run (ticket 120; operator, 2026-10-19: "Read
  # another run (Recommended)"): the umbrella pair set from GLEIF's
  # `lei` runs. OpenFIGI's answers are no longer read (ticket 138).
  targets:
    mastering:
      # Set for the FIGI steps ticket 138 removed (73 s each, measured
      # 2026-10-19); kept until a run shows the default 120 s lease holds.
      lease_seconds: 900
      heartbeat_seconds: 60
      run:
        facts: [period]
      steps:
        - name: submissions
          operation: source.read
          requires: []
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {each: file}
          input: {contract: filings.yaml}
        - name: identifiers
          operation: source.read
          requires: []
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {each: file}
          input: {contract: identifiers.yaml}
        - name: holdings
          operation: source.read
          requires: [identifiers]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {each: file}
          input:
            context: {period: {fact: period}}
            lookups:
              isin: {from: identifiers, table: isin, column: holding, value_column: isin,
                     max_input_bytes: 268435456, max_input_rows: 10000000}
              sedol: {from: identifiers, table: sedol, column: holding, value_column: sedol,
                      max_input_bytes: 268435456, max_input_rows: 10000000}
              loanx: {from: identifiers, table: loanx, column: holding, value_column: loanx,
                      max_input_bytes: 268435456, max_input_rows: 10000000}
              figi: {from: identifiers, table: figi, column: holding, value_column: figi,
                      max_input_bytes: 268435456, max_input_rows: 10000000}
        - name: issuers
          operation: source.read
          requires: [identifiers, submissions]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {each: file}
          input:
            contract: issuers.yaml
            context: {period: {fact: period}}
            lookups:
              isin: {from: identifiers, table: isin, column: holding, value_column: isin,
                     max_input_bytes: 268435456, max_input_rows: 10000000}
              sedol: {from: identifiers, table: sedol, column: holding, value_column: sedol,
                      max_input_bytes: 268435456, max_input_rows: 10000000}
              loanx: {from: identifiers, table: loanx, column: holding, value_column: loanx,
                      max_input_bytes: 268435456, max_input_rows: 10000000}
              figi: {from: identifiers, table: figi, column: holding, value_column: figi,
                      max_input_bytes: 268435456, max_input_rows: 10000000}
              filed: {from: submissions, table: filed, column: accession_number, value_column: filed,
                     max_input_bytes: 67108864, max_input_rows: 1000000}
              umbrella: {run: {source: gleif, target: subfund-pairs, step: pairs}, table: subfund, column: fund,
                         value_column: umbrella, max_input_bytes: 67108864, max_input_rows: 1000000}
        - name: reduce
          operation: source.combine
          requires: [holdings]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input: {contract: reduce.yaml, readings: {holdings: {step: holdings}}}
        - name: issuer_reduce
          operation: source.combine
          requires: [issuers]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input: {contract: issuer-reduce.yaml, readings: {issuers: {step: issuers}}}
        - name: combine
          operation: source.combine
          requires: [reduce, issuer_reduce]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input:
            contract: combine.yaml
            readings: {securities: {step: reduce}, issuers: {step: issuer_reduce}}
        - name: record
          operation: source.read
          requires: [combine]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          input: {contract: record.yaml, pieces: {step: combine}, context: {batch: first}}
        # Each holding for silver (ticket 79): a lookup row, not an MDM record
        # (operator, 2026-10-22: "Why do you need to merge it it's just a
        # lookup"). The filing's series (holding-series.yaml), its
        # registrant (sec.nport.registrant's) and its date name each row's
        # holder; holding-rows.yaml gives the rows silver-holding.yaml lands.
        - name: registrants
          operation: source.read
          requires: [submissions]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {each: file}
          input:
            contract: sec.nport.registrant/source.yaml
            lookups:
              filed: {from: submissions, table: filed, column: accession_number, value_column: filed,
                      max_input_bytes: 17179869184, max_input_rows: 100000000}
        - name: series
          operation: source.read
          requires: []
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {each: file}
          input: {contract: holding-series.yaml}
        - name: holding
          operation: source.read
          requires: [identifiers, submissions, registrants, series]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {each: file}
          input:
            contract: holding.yaml
            context: {period: {fact: period}}
            lookups:
              isin: {from: identifiers, table: isin, column: holding, value_column: isin,
                     max_input_bytes: 17179869184, max_input_rows: 100000000}
              sedol: {from: identifiers, table: sedol, column: holding, value_column: sedol,
                      max_input_bytes: 17179869184, max_input_rows: 100000000}
              loanx: {from: identifiers, table: loanx, column: holding, value_column: loanx,
                      max_input_bytes: 17179869184, max_input_rows: 100000000}
              figi: {from: identifiers, table: figi, column: holding, value_column: figi,
                      max_input_bytes: 17179869184, max_input_rows: 100000000}
              series: {from: series, table: series, column: accession_number, value_column: series_id,
                       max_input_bytes: 17179869184, max_input_rows: 100000000}
              registrant: {from: registrants, table: filing, column: accession_number, value_column: cik,
                           max_input_bytes: 17179869184, max_input_rows: 100000000}
              filed: {from: submissions, table: filed, column: accession_number, value_column: filed,
                      max_input_bytes: 17179869184, max_input_rows: 100000000}
              as_of: {from: submissions, table: reported, column: accession_number, value_column: as_of,
                      max_input_bytes: 17179869184, max_input_rows: 100000000}
        - name: holding_combine
          operation: source.combine
          requires: [holding]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input: {contract: holding-combine.yaml, readings: {holdings: {step: holding}}}
        - name: holding_rows
          operation: source.read
          requires: [holding_combine]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          input: {contract: holding-rows.yaml, pieces: {step: holding_combine}}
        - name: prepare
          operation: mdm.prepare
          requires: [record]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, mdm.prepared]
          input:
            keys: {table: security, record_column: record, dataset: sec.nport.security.v2}
            readings: {record: {all: record}}
        - name: merge
          operation: mastering.merge
          requires: [prepare]
          key: "{batch_id}"
          leases: ["mdm:consumer:{consumer}"]
          checks: [input.hash, output.receipt, mdm.committed]
        # The holdings land in silver once the Securities they link to are merged
        # (ticket 79, as ticket 183 did for 13F): the silver writer finds each
        # row's Security, Fund and registrant Company by lookup.
        - name: land_holding
          operation: silver.land
          requires: [holding_rows, merge]
          key: "{unit}"
          leases: ["silver:{silver}"]
          checks: [input.hash, output.receipt, silver.landed]
          input: {keys: {table: holding, silver: nport_holding}}
        # Links are a silver table, built from the stored records after the merge.
        - name: links
          operation: silver.derive
          requires: [land_holding]
          key: "{unit}"
          leases: ["silver:{silver}", "silver:{reads}"]
          checks: [input.hash, output.receipt, silver.derived]
          input: {keys: {build: links, silver: relationship, reads: mastering_record}}
        - name: processed
          operation: journal.record
          requires: [links]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, journal.recorded]
      checks: [manifest.hash, work.accounting, journal.delivered]
    # The Securities keyed by a SEDOL or a LoanX (ticket 190; operator, 2026-11-04: "Second batch after
    # CUSIP and ISIN"): the same record rules (record.yaml, batch `other`) over the first target's
    # verified combine, published after it has merged, so each finds the Security that already holds its
    # value (records of one batch never match each other). Run it after `mastering`.
    mastering_other_keys:
      steps:
        - name: record
          operation: source.read
          requires: []
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          input:
            contract: record.yaml
            pieces: {run: {source: sec.nport.security, target: mastering, step: combine}}
            context: {batch: other}
        - name: prepare
          operation: mdm.prepare
          requires: [record]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, mdm.prepared]
          input:
            keys: {table: security, record_column: record, dataset: sec.nport.security.v2}
            readings: {record: {all: record}}
        - name: merge
          operation: mastering.merge
          requires: [prepare]
          key: "{batch_id}"
          leases: ["mdm:consumer:{consumer}"]
          checks: [input.hash, output.receipt, mdm.committed]
      checks: [manifest.hash, work.accounting]
