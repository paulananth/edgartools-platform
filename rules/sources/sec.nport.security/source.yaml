# SEC Form N-PORT holdings, read for the Security master (ticket 79, part 1),
# from the approved N-PORT findings (profiling/sec.nport-2026q2-final,
# approved 2026-10-15 06:29 ET). Rulings it rests on (operator):
# - "CUSIP and ISIN join" (2026-10-14): one CUSIP is one Security; an ISIN
#   joins too; ticker, FIGI and SEDOL are lookup only.
# - "One master record" (2026-10-20, ticket 120; it replaces "Two contracts
#   (Recommended)", 2026-10-15): sec.nport.security.v2, one record per
#   Security, keyed by its CUSIP (carrying its ISIN when FIGI agrees on the pair
#   one to one), else by the ISIN of a holding with no usable CUSIP; an
#   ISIN-only holding whose ISIN FIGI attaches to a CUSIP is that CUSIP's.
# - "Registrant yes, issuer later" (2026-10-14): the issuer's name, title and
#   LEI stay on the Security as filed (the LEI a filed word, not an
#   identifier: 179,389 holdings carry one failing its check digit).
# - "A" (13F, 2026-10-14): the filed words kept are each key's lexically first
#   spelling, as for 13F (ticket 84 may replace it).
# The run, in order: identifiers.yaml (IDENTIFIERS.tsv, streamed) gives the
# pair set `isin` (holding to ISIN, ticket 91); this reading streams
# FUND_REPORTED_HOLDING.tsv once and gives each holding its ISIN with
# `member_value` (none when the holding has none or several); reduce.yaml
# groups by CUSIP, by ISIN and by pair; combine-pairs.yaml counts each pair's
# CUSIPs and ISINs; reduce.yaml's `keys` lists each Security once by its one
# key; combine.yaml joins the filed words and the one-to-one ISIN onto each,
# and marks an ISIN-only row folded into a CUSIP's; record.yaml leaves those
# out; mdm.prepare reads table `security`.
# A usable CUSIP is filed and not a stand-in (000000000, 999999999:
# rules/identifiers/cusip.yaml); one failing its check digit stays a CUSIP
# record and is set aside by the Dataset Contract, counted.
source: sec.nport.security
bronze:
  family: sec.nport-datasets
execution:
  profile: source.read
  workers: 1
  max_artifacts: 1
read:
  format: json
  limits:
    max_bytes: 1048576
    max_records: 1
  lookup_sets:
    isin:
      max_values: 10000000
      max_bytes: 268435456
      max_value_bytes: 64
      pairs: true
  # The quarter's data set period (an instant with its zone), supplied by the
  # run: a column of the holdings for silver; it dates no publication in MDM
  # (operator, 2026-10-19: "if at all it should be captured in silver not on
  # mdm"; ticket 113).
  context:
    period: {type: text}
  tables:
    security_cusip:
      each: .
      select:
        choose:
          condition:
            equal:
              left:
                text:
                  path: ISSUER_CUSIP
                  default: ""
                  transforms:
                  - case: upper
                  null_if:
                  - ""
                  - "000000000"
                  - "999999999"
              right:
                value:
                  path: NO_SUCH_COLUMN
          then:
            value:
              path: NO_SUCH_COLUMN
          else:
            test:
              path: HOLDING_ID
              kind: present
      columns:
        cusip:
          text:
            path: ISSUER_CUSIP
            default: ""
            transforms:
            - case: upper
            null_if:
            - ""
            - "000000000"
            - "999999999"
        # The Security's one key (ticket 120; operator, 2026-10-20: "One master
        # record"): its CUSIP, else its ISIN (security_isin below). A CUSIP has 9
        # characters and an ISIN 12, so the two never meet.
        key:
          text:
            path: ISSUER_CUSIP
            default: ""
            transforms:
            - case: upper
            null_if:
            - ""
            - "000000000"
            - "999999999"
        issuer_name:
          text:
            path: ISSUER_NAME
            default: ""
        issuer_title:
          text:
            path: ISSUER_TITLE
            default: ""
        issuer_lei:
          text:
            path: ISSUER_LEI
            default: ""
        key_kind:
          const:
            value: cusip
        period:
          context: {name: period}
    cusip_isin:
      each: .
      select:
        choose:
          condition:
            equal:
              left:
                text:
                  path: ISSUER_CUSIP
                  default: ""
                  transforms:
                  - case: upper
                  null_if:
                  - ""
                  - "000000000"
                  - "999999999"
              right:
                value:
                  path: NO_SUCH_COLUMN
          then:
            value:
              path: NO_SUCH_COLUMN
          else:
            choose:
              condition:
                equal:
                  left:
                    member_value:
                      lookup: isin
                      key:
                        text:
                          path: HOLDING_ID
                      on_many: "null"
                  right:
                    value:
                      path: NO_SUCH_COLUMN
              then:
                value:
                  path: NO_SUCH_COLUMN
              else:
                test:
                  path: HOLDING_ID
                  kind: present
      columns:
        cusip:
          text:
            path: ISSUER_CUSIP
            default: ""
            transforms:
            - case: upper
            null_if:
            - ""
            - "000000000"
            - "999999999"
        isin:
          member_value:
            lookup: isin
            key:
              text:
                path: HOLDING_ID
            on_many: "null"
    security_isin:
      each: .
      select:
        choose:
          condition:
            equal:
              left:
                text:
                  path: ISSUER_CUSIP
                  default: ""
                  transforms:
                  - case: upper
                  null_if:
                  - ""
                  - "000000000"
                  - "999999999"
              right:
                value:
                  path: NO_SUCH_COLUMN
          then:
            choose:
              condition:
                equal:
                  left:
                    member_value:
                      lookup: isin
                      key:
                        text:
                          path: HOLDING_ID
                      on_many: "null"
                  right:
                    value:
                      path: NO_SUCH_COLUMN
              then:
                value:
                  path: NO_SUCH_COLUMN
              else:
                test:
                  path: HOLDING_ID
                  kind: present
          else:
            value:
              path: NO_SUCH_COLUMN
      columns:
        isin:
          member_value:
            lookup: isin
            key:
              text:
                path: HOLDING_ID
            on_many: "null"
        key:
          member_value:
            lookup: isin
            key:
              text:
                path: HOLDING_ID
            on_many: "null"
        issuer_name:
          text:
            path: ISSUER_NAME
            default: ""
        issuer_title:
          text:
            path: ISSUER_TITLE
            default: ""
        issuer_lei:
          text:
            path: ISSUER_LEI
            default: ""
        key_kind:
          const:
            value: isin
        period:
          context: {name: period}
  stream:
    framing: delimited
    delimited:
      format: tsv
      encoding: utf-8
    container: zip
    member: FUND_REPORTED_HOLDING.tsv
    max_input_bytes: 1000000000
    max_bytes: 2000000000
    max_record: 1048576
    max_records: 20000000
    max_depth: 64
    ordinal_context: null
    partition_bytes: 8388608
    partition_records: 100000
    max_partitions: 100000
    max_spool_bytes: 17179869184
    max_output_rows: 40000000
mdm:
  # One Dataset Contract for every Security (ticket 120; operator, 2026-10-20:
  # "One master record"): keyed by its CUSIP, else its ISIN. It replaces
  # sec.nport.security.v1 (CUSIPs) and sec.nport.security_isin.v1 (ISIN-only):
  # a new record key is a new dataset.
  sec.nport.security.v2:
    contract:
      provider: SEC
      family: sec.nport-datasets
      schema_version: sec-nport-security-v2
      record_key: the CUSIP, upper-cased, else the ISIN of a holding with no usable CUSIP; one record per Security over the quarter
      publication_key: the quarter's N-PORT data set file and the reduction and combine contracts
      effective_time: the run's as-of time; the quarter dates nothing in MDM, and a link
        starts at the earliest filing date (else the quarter's date) of the holdings that name its issuer
      semantics: patch
      completeness: the Securities one quarter's holdings name; no retirement by absence
      nonblocking_deferred_reasons:
      - invalid_cusip
      - invalid_cusip_checksum
      - invalid_isin
      - invalid_isin_checksum
      - missing_record_identity
      adapter:
        reading:
          source: sec.nport.security
          read:
            format: json
            limits:
              max_bytes: 33554432
              max_records: 1
            assertions:
            - test:
                test:
                  path: .
                  kind: object
              reason: Mapped input must be an object
            tables:
              mapped:
                each: .
                columns:
                  fields:
                    object:
                      fields:
                        name_of_issuer:
                          join:
                            path: name.name_sample
                            item_path: issuer_name
                            separator: ""
                            max_items: 1
                        title_of_class:
                          join:
                            path: title.title_sample
                            item_path: issuer_title
                            separator: ""
                            max_items: 1
                        # No issuer LEI field: an LEI identifies a Company, not a
                        # Security ("A value of another kind stays out of this
                        # kind"); the Security reaches its issuer by ISSUED_BY
                        # (ticket 22), and each holding's filed LEI is in silver
                        # (silver-holding.yaml; operator, 2026-10-22: "Fix 1").
                  matching:
                    object:
                      fields: {}
          input_fields:
          - key
          - cusip
          - name
          - title
          - lei
          - isin
          - issuer
          - filed
        version: sec-nport-security-v2
        retain_deferred: true
        source_record_provenance: true
        kind: security
        # The CUSIP or the ISIN, each checked as an identifier below, so a bad
        # check digit is still held back with its own reason.
        record_key:
        - key
        identifiers:
          cusip: cusip
          isin: isin
        identifier_formats:
          cusip: cusip
          isin: isin
        # The Security is issued by the entity that holds its issuer's LEI
        # (ticket 22; operator, 2026-10-16: "By issuer LEI (Recommended)"): the
        # link names GLEIF's record of that LEI, and waits until that record is
        # mastered. A Security filed with no LEI, or with two, has no link.
        relationships:
        - type: ISSUED_BY
          each: issuer
          target_key: [item.issuer_lei]
          target_source: gleif.level1.v1
          # The link starts at the earliest filing date of the CUSIP's holdings
          # that name the issuer, a holding with none counting the quarter's
          # date (ticket 113; operator, 2026-10-19: "use the
          # filing date or quarter date or inception date"), and a link that
          # exists keeps its start (ISSUED_BY `keeps_start`).
          valid_from: filed.0.filed
          time_format: date
          scope: SEC N-PORT issuer
bookkeeping:
  version: 2
  # One quarter's data set (the zip), its period a run fact (ticket 113), one
  # target (`mastering`) for its one Dataset Contract: every Security in one run
  # (ticket 120; `mastering_isin` retired with sec.nport.security_isin.v1). Two inputs come from other runs
  # (ticket 120; operator, 2026-10-19: "Read another run (Recommended)"): the
  # umbrella pair set from GLEIF's `umbrellas` runs, and OpenFIGI's answers
  # from its `answers_cusip` and `answers_isin` runs, so those run first.
  targets:
    mastering:
      # Claiming and reporting a FIGI step recheck the chain behind ~480 OpenFIGI
      # answer units, 73 s each (measured 2026-10-19): longer than the default
      # 120 s lease (ticket 120).
      lease_seconds: 900
      heartbeat_seconds: 60
      run:
        facts: [period]
      steps:
        - name: submissions
          operation: source.read
          requires: []
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {each: file}
          input: {contract: filings.yaml}
        - name: identifiers
          operation: source.read
          requires: []
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {each: file}
          input: {contract: identifiers.yaml}
        - name: holdings
          operation: source.read
          requires: [identifiers]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {each: file}
          input:
            context: {period: {fact: period}}
            lookups:
              isin: {from: identifiers, table: isin, column: holding, value_column: isin,
                     max_input_bytes: 268435456, max_input_rows: 10000000}
        - name: issuers
          operation: source.read
          requires: [identifiers, submissions]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {each: file}
          input:
            contract: issuers.yaml
            context: {period: {fact: period}}
            lookups:
              isin: {from: identifiers, table: isin, column: holding, value_column: isin,
                     max_input_bytes: 268435456, max_input_rows: 10000000}
              filed: {from: submissions, table: filed, column: accession, value_column: filed,
                     max_input_bytes: 67108864, max_input_rows: 1000000}
              umbrella: {run: {source: gleif, target: umbrellas, step: pairs}, table: subfund, column: fund,
                         value_column: umbrella, max_input_bytes: 67108864, max_input_rows: 1000000}
        - name: reduce
          operation: source.combine
          requires: [holdings]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input: {contract: reduce.yaml, readings: {holdings: {step: holdings}}}
        - name: issuer_reduce
          operation: source.combine
          requires: [issuers]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input: {contract: issuer-reduce.yaml, readings: {issuers: {step: issuers}}}
        - name: pairs
          operation: source.combine
          requires: [reduce]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input: {contract: combine-pairs.yaml, readings: {securities: {step: reduce}}}
        - name: cusips_found
          operation: source.combine
          requires: []
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input:
            contract: figi-found.yaml
            readings: {answers: {run: {source: openfigi, target: answers_cusip, step: answers}}}
        - name: isins_found
          operation: source.combine
          requires: []
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input:
            contract: figi-found.yaml
            readings: {answers: {run: {source: openfigi, target: answers_isin, step: answers}}}
        - name: figi_pairs
          operation: source.combine
          requires: [pairs, cusips_found, isins_found]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input:
            contract: figi-pairs.yaml
            readings: {pairs: {step: pairs}, cusips: {step: cusips_found}, isins: {step: isins_found}}
        - name: agree
          operation: source.read
          requires: [figi_pairs]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          input: {contract: figi-agree.yaml, pieces: {step: figi_pairs}}
        - name: offers
          operation: source.combine
          requires: [agree]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input: {contract: figi-offers.yaml, readings: {agreed: {step: agree}}}
        - name: attach
          operation: source.combine
          requires: [agree, offers]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input: {contract: figi-attach.yaml, readings: {agreed: {step: agree}, offers: {step: offers}}}
        # The ISIN-only holdings' facts keyed by the CUSIP their ISIN is attached to
        # (ticket 120), for combine.yaml's folded rows.
        - name: fold
          operation: source.combine
          requires: [reduce, attach, issuer_reduce]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input:
            contract: fold.yaml
            readings: {securities: {step: reduce}, attached: {step: attach}, issuers: {step: issuer_reduce}}
        - name: combine
          operation: source.combine
          requires: [reduce, attach, issuer_reduce, fold]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input:
            contract: combine.yaml
            readings: {securities: {step: reduce}, attached: {step: attach}, issuers: {step: issuer_reduce}, folded: {step: fold}}
        - name: record
          operation: source.read
          requires: [combine]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          input: {contract: record.yaml, pieces: {step: combine}}
        # Each holding for silver (ticket 79): a lookup row, not an MDM record
        # (operator, 2026-10-22: "Why do you need to merge it it's just a
        # lookup"). The filing's series (holding-series.yaml), its
        # registrant (sec.nport.registrant's) and its date name each row's
        # holder; holding-combine.yaml folds an ISIN into its CUSIP as fold.yaml
        # does; holding-rows.yaml gives the rows silver-holding.yaml lands.
        - name: registrants
          operation: source.read
          requires: [submissions]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {each: file}
          input:
            contract: sec.nport.registrant/source.yaml
            lookups:
              filed: {from: submissions, table: filed, column: accession, value_column: filed,
                      max_input_bytes: 17179869184, max_input_rows: 100000000}
        - name: series
          operation: source.read
          requires: []
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {each: file}
          input: {contract: holding-series.yaml}
        - name: holding
          operation: source.read
          requires: [identifiers, submissions, registrants, series]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          units: {each: file}
          input:
            contract: holding.yaml
            context: {period: {fact: period}}
            lookups:
              isin: {from: identifiers, table: isin, column: holding, value_column: isin,
                     max_input_bytes: 17179869184, max_input_rows: 100000000}
              series: {from: series, table: series, column: accession, value_column: series_id,
                       max_input_bytes: 17179869184, max_input_rows: 100000000}
              registrant: {from: registrants, table: filing, column: accession, value_column: cik,
                           max_input_bytes: 17179869184, max_input_rows: 100000000}
              filed: {from: submissions, table: filed, column: accession, value_column: filed,
                      max_input_bytes: 17179869184, max_input_rows: 100000000}
        - name: holding_combine
          operation: source.combine
          requires: [holding, attach]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.combined]
          input: {contract: holding-combine.yaml, readings: {holdings: {step: holding}, attached: {step: attach}}}
        - name: holding_rows
          operation: source.read
          requires: [holding_combine]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, source.output]
          input: {contract: holding-rows.yaml, pieces: {step: holding_combine}}
        - name: prepare
          operation: mdm.prepare
          requires: [record]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, mdm.prepared]
          input:
            keys: {table: security, record_column: record, dataset: sec.nport.security.v2}
            readings: {record: {all: record}}
        - name: merge
          operation: mdm.merge
          requires: [prepare]
          key: "{batch_id}"
          leases: ["mdm:consumer:{consumer}"]
          checks: [input.hash, output.receipt, mdm.committed]
        - name: processed
          operation: journal.record
          requires: [merge]
          key: "{unit}"
          leases: ["artifact:{destination}"]
          checks: [input.hash, output.receipt, journal.recorded]
      checks: [manifest.hash, work.accounting, journal.delivered]
