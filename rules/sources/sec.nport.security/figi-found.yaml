# One identifier kind's OpenFIGI answers as one table (ticket 80): every
# reading of figi-answers.yaml for that kind (`answers`), the verified units
# of OpenFIGI's `answers_cusip` or `answers_isin` runs (ticket 120; each unit
# 16 files, at most 256 units), put together so figi-pairs.yaml takes each kind
# under one name. Run once for CUSIPs and once for ISINs. Pin canonical JSON of
# this file as the source.combine contract.
execution:
  profile: source.combine
combine:
  # Measured (2026-10-15 capture): 383,612 CUSIPs and 387,607 ISINs asked.
  max_rows: 1000000
  groups: {}
  tables:
    found:
      source: [answers]
      table: found
      checks: {}
      where: {}
      joins: {}
