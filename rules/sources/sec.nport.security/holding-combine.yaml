# Each holding row as holding.yaml read it, in pieces for holding-rows.yaml
# (a source extract reads pieces of a source.combine step). Ticket 138 ended
# the fold of an ISIN-only holding into a CUSIP by FIGI: each row keeps its
# own CUSIP and ISIN, and MDM finds the one Security for either. Input:
# holding.yaml's output (`holdings`).
execution:
  profile: source.combine
combine:
  max_rows: 40000000  # the engine's ceiling (operator: "I asked to remove all limits")
  groups: {}
  tables:
    holding:
      source: holdings
      table: holding
      checks: {}
      where: {}
      joins: {}
