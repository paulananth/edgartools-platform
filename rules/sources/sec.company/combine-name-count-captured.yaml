# Company records from a captured submissions reading and the exchange catalog: main documents, forms,
# tickers and the business address.
execution:
  profile: source.combine
combine:
  max_rows: 100000
  groups:
    forms:
      source:
      - main
      table: filings
      key: cik
      value: form
      mode: collect
      order_by: []
      distinct: true
      skip_null_values: true
      skip_empty_text: true
      sort_values: true
      checks:
        sync_run_id: APPROVED_COMPANY_CAPTURE_RUN
      where: {}
    tickers:
      source:
      - catalog_exchange
      table: tickers
      key: cik
      value: ticker
      mode: collect
      order_by:
      - source_rank
      - ticker
      distinct: true
      skip_null_values: true
      skip_empty_text: true
      checks:
        last_sync_run_id: APPROVED_CATALOG_CAPTURE_RUN
      where: {}
    address:
      source: main
      table: addresses
      key: cik
      value: business_address
      mode: last
      order_by: []
      distinct: false
      skip_null_values: true
      checks:
        last_sync_run_id: APPROVED_COMPANY_CAPTURE_RUN
      where: {}
  tables:
    company:
      source: main
      table: company
      checks:
        last_sync_run_id: APPROVED_COMPANY_CAPTURE_RUN
      where: {}
      joins:
        forms:
          group: forms
          key: cik
          on_missing: empty
          replace: false
        tickers:
          group: tickers
          key: cik
          on_missing: empty
          replace: false
        business_address:
          group: address
          key: cik
          on_missing: empty
          replace: false
      drop:
      - _name_key
