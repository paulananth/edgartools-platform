# SEC Form N-PORT fund series, read for the Fund master (ticket 79, part 3),
# from the approved N-PORT findings (profiling/sec.nport-2026q2-final,
# approved 2026-10-15 06:29 ET; part FUND_REPORTED_INFO.SERIES_LEI: 12,944
# series over 14,416 filings). Rulings it rests on (operator):
# - "Series id and LEI join (Recommended)" (2026-10-14): the Fund is kind
#   fund_structure, joined by its SEC series id and its LEI.
# - Operator, 2026-11-06: "make it valid with the file date until we fix
#   the data quality reflect this in open metadata". This supersedes the
#   link deferral: use the filing observation, with an explicit quality flag,
#   while the true start remains unknown.
# The run, in order: sec.nport.registrant's readings give two pair sets,
# `filed` (filing to its date, submissions.yaml) and `registrant` (filing to
# its registrant's CIK, its `filing` table); this reading streams
# FUND_REPORTED_INFO.tsv once, one row per filing; reduce.yaml lists each
# series (a filing naming no series, 729 in 2026q2, is not read: its
# registrant is the fund); combine.yaml keeps each series' latest filing whole
# (by date, then accession number) and its LEI when one to one (lei-pairs.yaml, its own
# step before the combine);
# record.yaml makes each `fund` row one record; mdm.prepare,
# the merge and the processed record follow (the `mastering` target below).
# Left out: the report's financial figures (FUND_REPORTED_INFO's other
# columns), detail of a report, not of the Fund.
source: sec.nport.fund
pass:
  name: filings
  units: {each: file}
  lookups:
    filed: {column: accession_number, from: sec.nport.registrant/submissions.yaml, max_input_bytes: 67108864, max_input_rows: 1000000, table: filed, value_column: filed}
    registrant: {column: accession_number, from: sec.nport.registrant/source.yaml, max_input_bytes: 268435456, max_input_rows: 1000000, table: filing, value_column: cik}
bronze:
  family: sec.nport-datasets
# The quarter's fund series through the Merge Stage (ticket 118). The registrant's
# own readings give each filing its date and its registrant's CIK (`<source>/<file>`
# names another source's rules file); a bundle is the quarter's data set.
bookkeeping:
  version: 2
  targets:
    mastering:
      extract: record.yaml
      master: {keys: {dataset: sec.nport.fund.v1, record_column: record, table: fund}}
      silver:
        # Links are a silver table, built from the stored records after the merge.
        - {name: links, derive: {build: links, reads: mastering_record, silver: relationship}}
execution:
  profile: source.read
  workers: 1
  max_artifacts: 1
read:
  format: json
  limits:
    max_bytes: 1048576
    max_records: 1
  lookup_sets:
    filed:
      max_values: 1000000
      max_bytes: 67108864
      max_value_bytes: 64
      pairs: true
    registrant:
      max_values: 1000000
      max_bytes: 67108864
      max_value_bytes: 64
      pairs: true
  tables:
    filing:
      each: .
      # A filing naming no series (729 in 2026q2, every one blank) is the
      # registrant's own fund: no Fund record.
      select: {test: {path: SERIES_ID, kind: truthy}}
      columns:
        series_id: {text: {path: SERIES_ID, default: "", transforms: [{case: upper}], null_if: ["", "N/A"]}}
        accession_number: {text: {path: ACCESSION_NUMBER}}
        filed:
          member_value: {lookup: filed, key: {text: {path: ACCESSION_NUMBER}}, on_many: error}
        cik:
          member_value: {lookup: registrant, key: {text: {path: ACCESSION_NUMBER}}, on_many: error}
        name: {text: {path: SERIES_NAME, default: "", null_if: [""]}}
        lei:
          text:
            path: SERIES_LEI
            default: ""
            transforms:
            - {case: upper}
            null_if: ["", "N/A", "00000000000000000000"]
        # The same LEI as a key for counting (reduce.yaml): none is empty text,
        # since a reduction refuses a null key.
        lei_key:
          text:
            path: SERIES_LEI
            default: ""
            transforms:
            - {case: upper}
            - {regex_replace: {pattern: '^(N/A|0{20})$', with: ''}}
  stream:
    framing: delimited
    delimited: {format: tsv, encoding: utf-8}
    container: zip
    member: FUND_REPORTED_INFO.tsv
    # Profiling, 2026q2: 14,416 rows.
    max_input_bytes: 1000000000
    max_bytes: 100000000
    max_record: 1048576
    max_records: 1000000
    max_depth: 64
    ordinal_context: null
    partition_bytes: 8388608
    partition_records: 100000
    max_partitions: 1000
    max_spool_bytes: 1073741824
    max_output_rows: 1000000
dataset_contracts:
  sec.nport.fund.v1:
    contract:
      provider: SEC
      family: sec.nport-datasets
      schema_version: sec-nport-fund-v1
      record_key: the fund series' SEC series id; one record per series over the quarter, from its latest filing
      publication_key: the quarter's N-PORT data set file and the reduction and combine contracts
      effective_time: the latest filing date as an observation, not the series inception
      semantics: patch
      completeness: the fund series of one quarter's N-PORT filings; no retirement by absence
      nonblocking_deferred_reasons:
      - missing_record_identity
      - missing_provisional_file_date
      - invalid_time
      adapter:
        reading:
          source: sec.nport.fund
          read:
            format: json
            limits:
              max_bytes: 33554432
              max_records: 1
            assertions:
            - test:
                test:
                  path: .
                  kind: object
              reason: Mapped input must be an object
            - test: {test: {path: filed_at, kind: truthy}}
              reason: missing_provisional_file_date
            tables:
              mapped:
                each: .
                columns:
                  fields:
                    object:
                      fields:
                        name: {value: {path: latest.name, type: text, null_if_blank: true}}
                  matching:
                    object:
                      fields:
                        relationship_start_date_basis: {value: {path: date_basis, type: text}}
          input_fields:
          - series_id
          - lei
          - latest
          - filed_at
          - date_basis
          - date_is_provisional
          - authoritative_start
        version: sec-nport-fund-2026-11-06.provisional-file-date
        retain_deferred: true
        source_record_provenance: true
        kind: fund_structure
        effective_at: filed_at
        record_key:
        - series_id
        record_key_format: sec_series_id
        # The series id and the series LEI each join the one Fund holding
        # them, or create it (operator, 2026-10-14). The registrant's CIK is
        # lookup only for identity; it also resolves the approved relationship
        # to the already mastered N-PORT registrant, without merging identities.
        # The LEI joins only when it is the one LEI its series files and no
        # other series files it in the quarter (combine.yaml, `lei`): 15 LEIs
        # are filed for two series and 1 series files two LEIs (2026q2). Every
        # filed LEI stays as a lookup-only cross-reference.
        identifiers:
          sec_series_id: series_id
          lei: lei
        identifier_formats:
          sec_series_id: sec_series_id
          lei: lei
        cross_references:
          nport_registrant_cik: latest.cik
          nport_series_lei: latest.lei
        cross_reference_formats:
          nport_registrant_cik: sec_cik
          nport_series_lei: lei
        profiles:
        - role: fund
          authority: SEC EDGAR
          registration: series_id
          valid_from: filed_at
          fields:
            source_start_date_basis: date_basis
            source_start_date_is_provisional: date_is_provisional
        relationships:
        - type: IS_SUBFUND_OF
          target_key: [latest.cik]
          target_source: sec.nport.registrant.v2
          # No stated inception: the existing engine uses effective_at and
          # records valid_from_basis=observed. A real stated date may replace it.
          valid_from: authoritative_start
          time_format: instant
          scope: SEC N-PORT fund series
          ends: {reason: missing_record_identity}
          properties:
            source_start_date_basis: date_basis
            source_start_date_is_provisional: date_is_provisional
