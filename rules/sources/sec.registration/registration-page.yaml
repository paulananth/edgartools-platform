                group: 1
            - regex_replace:
                pattern: ','
                with: ''
        price_low:
          first_found:
            path: block
            from: document
            within: 200
            transforms:
            - regex_extract:
                pattern: '(?i)between \$\s?([0-9]+(?:\.[0-9]+)?) and \$\s?[0-9]'
                group: 1
            - regex_replace:
