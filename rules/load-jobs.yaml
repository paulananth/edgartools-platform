# The order a fresh store is loaded in: every captured source and target, each one's input and the facts and
# revision no capture states, read by `skills/data-operations/scripts/load_jobs.py` (Edgar Intelligence initialize
# runbook, "Load a fresh store"). A step is named after what it loads, never after a file or a date: it loads every
# delivery of its `sources/<source>/inputs.yaml`, in that file's order (oldest first), so a new delivery is an entry there
# and no new step; the facts and revision that belong to one file are there too. `input` names one only where a source's inputs are different kinds of file.
# `capture_label` names each step's capture run (`<label>-<step>`, then the delivery's name, or its
# `capture_name` in the inputs file), and a fact is written as its value: both are inputs of a
# record, so they stay as the store was loaded (a new value processes every file again, and the Stage refuses the changed
# records under the same revision). The run's RUN names its state and logs only. `minutes` bounds one delivery's attempt, which
# carries on where the last stopped.
# Steps that may run at the same time are in different `lane`s, and `waits_for` names a step of another lane that must
# be done first. Each lane runs its steps in file order (`load_jobs.py --lane <name>`), so every lane can start at once.
# Every `waits_for` comes from `infer_dependencies.py` (what the rules declare; tests hold each wait to an inferred edge
# and each inferred edge to a wait or an earlier step of its lane), never from
# a machine's size: a load waits only for the source whose golden records its own records join. Links set no order:
# the links table is built once, after the last load (`load_jobs.py --finish`).
# Eleven lanes: A the Companies the others follow; P the Persons; S the Securities; C the other Companies; L funds and
# share classes; Q N-PORT Securities (they wait for no fund); G GLEIF and what follows it (it joins only the SEC Company masters, so it starts when
# those are done); N N-PORT silver (no master first: a row lands with its link key and finds its master through `master_binding`, built by `--finish`);
# O ownership; D the other silver-only sources; F company-facts.
version: 1
# The compute a load runs on, as vCPUs and gigabytes, and so how many workers a step can carry (load_jobs.py
# `--capacity <name>`; `local` is this machine, measured). The AWS sizes are the ECS tasks of the production state
# machines (edgartools-prod-small, -medium, -large), read from AWS; a bigger task is a new line here, and its workers
# follow with no change to the code.
capacity:
  aws-small: {vcpu: 0.5, memory_gb: 1}
  aws-medium: {vcpu: 1, memory_gb: 4}
  aws-large: {vcpu: 2, memory_gb: 8}
# What a step takes unless it says otherwise. `priority` (1 first, then 2, then 3) is the order among steps that can start now:
# 1 the critical path, the steps with 100 minutes or more of chain behind them (their own time plus the longest run of steps
# waiting on them, by the first full load's measured times), 2 the steps with 30 to under 100 minutes, 3 every other step. A step
# that says nothing is 3. The init runbook's "Load priority" lists each tier, and a test holds that list to this file.
# `worker_gb` is measured: six workers of two loads held 2.45 GB, about 0.4 GB each (the lane budget and a step's worker range use it).
defaults: {workers: 2, bundles: 1, priority: 3, worker_gb: 0.4}
capture_label: fresh-v1
steps:
  - name: company
    lane: A
    priority: 1
    source: sec.company
    target: mastering
    facts:
      capture_run: fresh-v1-company
      catalog_run: fresh-v1-catalog
      load_mode: "default"
    workers: 2
    bundles: 4
    minutes: 300
    attempts: 4
  - name: nport-registrant
    lane: A
    source: sec.nport.registrant
    target: mastering
    minutes: 60
    attempts: 3
  - name: nport-fund
    lane: A
    source: sec.nport.fund
    target: mastering
    minutes: 60
    attempts: 3
  - name: person
    lane: P
    priority: 2
    source: sec.submissions.person
    target: mastering
    workers: 2
    bundles: 2
    minutes: 300
    attempts: 5
  - name: openfigi-answers
    lane: S
    priority: 1
    source: openfigi
    target: mastering
    input: nport-answers
    workers: 4
    bundles: 3
    minutes: 420
    attempts: 8
  - name: openfigi-tickers
    lane: S
    source: openfigi
    target: mastering
    input: form4-tickers
    minutes: 60
    attempts: 3
  - name: 13f-securities
    lane: S
    source: sec.thirteenf.securities
    target: mastering
    minutes: 90
    attempts: 3
  - name: 13f-securities-silver
    lane: S
    source: sec.thirteenf.securities
    target: silver
    minutes: 90
    attempts: 3
  - name: ncen-registrant
    lane: C
    source: sec.ncen.registrant
    target: mastering
    minutes: 60
    attempts: 3
  - name: ncen-adviser
    lane: C
    source: sec.ncen.adviser
    target: mastering
    minutes: 60
    attempts: 3
  - name: adv-mastering
    lane: C
    waits_for: [nport-registrant]
    source: iapd.adv
    target: mastering
    minutes: 60
    attempts: 3
  - name: adv-silver
    lane: C
    source: iapd.adv
    target: silver
    minutes: 60
    attempts: 3
  # Form ADV's private funds, after the adviser filings of the same months (lane C runs in order), so each
  # INVESTMENT_ADVISER_TO link finds its adviser; oldest month first, as the adviser filings load.
  - name: adv-funds
    lane: C
    source: iapd.adv.fund
    target: mastering
    minutes: 60
    attempts: 3
  - name: adv-fund-advisers
    lane: C
    source: iapd.adv.fund
    target: advisers
    minutes: 60
    attempts: 3
  - name: ncen-fund
    lane: L
    source: sec.ncen.fund
    target: mastering
    minutes: 60
    attempts: 3
  - name: nport-security
    lane: Q
    priority: 1
    source: sec.nport.security
    target: mastering
    minutes: 480
    attempts: 8
  - name: nport-security-other-keys
    lane: Q
    source: sec.nport.security
    target: mastering_other_keys
    minutes: 120
    attempts: 3
  - name: ncen-class
    lane: L
    waits_for: [openfigi-tickers, 13f-securities, nport-security-other-keys]
    source: sec.ncen.class
    target: mastering
    minutes: 60
    attempts: 3
  - name: nport-security-silver
    lane: N
    priority: 2
    source: sec.nport.security
    target: silver
    minutes: 240
    attempts: 3
  - name: gleif-pairs
    lane: G
    priority: 1
    source: gleif
    target: subfund-pairs
    input: publisher
    minutes: 60
    attempts: 3
  - name: gleif
    lane: G
    priority: 1
    waits_for: [company]
    source: gleif
    target: mastering
    input: publisher
    minutes: 240
    # `worker_gb` is the memory one worker of this merge was measured to hold (`load_jobs.py --status` shows a load's
    # memory and CPU). The compute holds the workers to the range it carries; raise `workers` on a task with the memory
    # and vCPUs for more, and read the effect from the status.
    worker_gb: 0.4
    workers: 8
    # Its delivery is one document (the publisher file): a move would abandon it, so the controller never raises it, and it
    # waits for the memory of all its workers rather than starting with half.
    one_document: true
    attempts: 40
  - name: adv-custodians
    lane: G
    waits_for: [nport-registrant, ncen-adviser, gleif]
    source: iapd.adv
    target: custodians
    minutes: 60
    attempts: 3
  - name: ownership
    lane: O
    source: sec.ownership
    target: mastering
    minutes: 300
    attempts: 8
  - name: ownership-symbols
    lane: O
    waits_for: [openfigi-tickers, 13f-securities, nport-security-other-keys]
    source: sec.ownership
    target: security_symbols
    minutes: 60
    attempts: 3
  - name: ownership-silver
    lane: O
    source: sec.ownership
    target: silver
    minutes: 300
    attempts: 3
  - name: 13f-filings
    lane: D
    priority: 1
    source: sec.thirteenf.filings
    target: silver
    minutes: 60
    attempts: 3
  - name: company-facts
    lane: F
    priority: 2
    source: sec.company-facts
    target: silver
    workers: 4
    bundles: 1
    minutes: 240
    attempts: 4
  - name: registration
    lane: D
    priority: 1
    source: sec.registration
    target: silver
    minutes: 240
    attempts: 4
  - name: ipo
    lane: D
    priority: 1
    source: sec.ipo
    target: silver
    # Its bundles are independent silver landings that wait on the database, not on the machine: several at once (the load's
    # measured time one at a time is in the load ticket).
    bundles: 4
    minutes: 120
    attempts: 4
  - name: prospectus
    lane: D
    source: sec.prospectus
    target: silver
    minutes: 30
    attempts: 4
