# Offline processing inventory, not activation or runtime readiness evidence.
# `after` is a preferred order only; it never pulls another source into a run.
# Declare `requires` only for genuine required source inputs, not waiting links.
# Rules, RDM, capture completeness and frozen-input checks stay in the runtime.
version: 1
sources:
  sec.company:
    target: mastering
    requires: []
    after: []
  gleif:
    # Level 1 from a captured Golden Copy through the Merge Stage (ticket 114).
    target: mastering
    requires: []
    after: [sec.company]
  sec.submissions.person:
    target: mastering
    requires: []
    after: [gleif]
  iapd.adv:
    target: null
    requires: []
    after: [sec.submissions.person]
  sec.ownership:
    target: null
    requires: []
    after: [sec.submissions.person]
  sec.thirteenf.securities:
    target: mastering
    requires: []
    after: [gleif, openfigi]
  sec.nport.registrant:
    target: mastering
    requires: []
    after: [sec.company]
  sec.nport.fund:
    target: mastering
    requires: []
    after: [sec.nport.registrant]
  # OpenFIGI first, one load (ticket 138; operator, 2026-10-25: "there
  # should be one processing with all the identifier and this is the first
  # load"): `mastering` reads the CUSIP and the ISIN answers together, every
  # bundle in parallel, no order inside it; its records create the
  # Securities. N-PORT's read decides which identifiers OpenFIGI is asked
  # (the capture). Then 13F, then N-PORT ("this should be second source",
  # "Load and priority"): each looks up first, then creates.
  openfigi:
    target: mastering
    requires: []
    after: [sec.nport.fund]
  # Its runs read GLEIF's `subfund-pairs` runs (ticket 120); no OpenFIGI run
  # since ticket 138. It joins the Securities OpenFIGI and 13F created and
  # creates the rest.
  sec.nport.security:
    target: mastering
    requires: []
    after: [sec.thirteenf.securities]
  # Company facts (ticket 45): silver rows linked to the Company by CIK, so they
  # run after it. Its `silver` target (ticket 169) reads the files, lands
  # company_fact and records each file in the Change Journal.
  sec.company-facts:
    target: silver
    requires: []
    after: [sec.company]
  # Registration statements (ticket 149): captured first; the reading, and the
  # links to the Company by CIK, come with onboarding.
  sec.registration:
    target: null
    requires: []
    after: [sec.company]
