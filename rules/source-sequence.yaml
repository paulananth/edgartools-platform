# Offline processing inventory, not activation or runtime readiness evidence.
# `after` is a preferred order only; it never pulls another source into a run.
# Declare `requires` only for genuine required source inputs, not waiting links.
# Rules, RDM, capture completeness and frozen-input checks stay in the runtime.
version: 1
sources:
  sec.submissions.company:
    target: mastering
    requires: []
    after: []
  gleif:
    # Level 1 from a captured Golden Copy through the Merge Stage (ticket 114).
    target: mastering
    requires: []
    after: [sec.submissions.company]
  sec.submissions.person:
    target: mastering
    requires: []
    after: [gleif]
  iapd.adv:
    target: null
    requires: []
    after: [sec.submissions.person]
  sec.ownership:
    target: null
    requires: []
    after: [sec.submissions.person]
  sec.thirteenf.information_table:
    target: null
    requires: []
    after: [gleif]
  sec.nport.registrant:
    target: mastering
    requires: []
    after: [sec.submissions.company]
  sec.nport.fund:
    target: mastering
    requires: []
    after: [sec.nport.registrant]
  # Its runs read GLEIF's `umbrellas` runs and OpenFIGI's `answers_cusip` and
  # `answers_isin` runs (ticket 120): those targets run first, over their own
  # captures. This
  # inventory names one target per source, so those targets are named here.
  sec.nport.security:
    target: mastering
    requires: []
    after: [sec.nport.fund]
  # OpenFIGI (ticket 80): its `mastering_cusip` and `mastering_isin` records
  # join the Securities N-PORT gives and wait otherwise, so they run after
  # them; its `answers_cusip` and `answers_isin` targets run before Securities
  # (ticket 120). Its mastering is not switched on yet.
  openfigi:
    target: null
    requires: []
    after: [sec.nport.security]
  # Company facts (ticket 45): silver rows linked to the Company by CIK, so they
  # run after it. Its silver landing target comes with ticket 46.
  sec.company-facts:
    target: null
    requires: []
    after: [sec.submissions.company]
