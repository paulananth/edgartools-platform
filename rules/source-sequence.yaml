# Offline processing inventory, not activation or runtime readiness evidence.
# `after` is a preferred order only; it never pulls another source into a run.
# Declare `requires` only for genuine required source inputs, not waiting links.
# Rules, RDM, capture completeness and frozen-input checks stay in the runtime.
version: 1
sources:
  sec.submissions.company:
    target: mastering
    requires: []
    after: []
  gleif:
    # Level 1 from a captured Golden Copy through the Merge Stage (ticket 114).
    target: mastering
    requires: []
    after: [sec.submissions.company]
  sec.submissions.person:
    target: mastering
    requires: []
    after: [gleif]
  iapd.adv:
    target: null
    requires: []
    after: [sec.submissions.person]
  sec.ownership:
    target: null
    requires: []
    after: [sec.submissions.person]
  sec.thirteenf.information_table:
    target: null
    requires: []
    after: [gleif]
  sec.nport.registrant:
    target: mastering
    requires: []
    after: [sec.submissions.company]
  sec.nport.fund:
    target: mastering
    requires: []
    after: [sec.nport.registrant]
  # OpenFIGI first (ticket 120; operator, 2026-10-23: "make the seurities run
  # should process openfigi first", "agreed"): its records create the
  # Securities, so its mastering runs before Securities'. The order of one
  # delivery: N-PORT's read decides which identifiers OpenFIGI is asked (the
  # capture); `answers_cusip` and `answers_isin`; `mastering_cusip`, which
  # creates a Security per CUSIP answer; `mastering_isin`, which joins each ISIN
  # answer to its CUSIP's Security by their shared FIGI (it reads every complete
  # `mastering_cusip` run, so that target runs first) or creates one; then
  # Securities (N-PORT), then 13F. Its mastering is not switched on yet.
  openfigi:
    target: null
    requires: []
    after: [sec.nport.fund]
  # Its runs read GLEIF's `umbrellas` runs and OpenFIGI's `answers_cusip` and
  # `answers_isin` runs (ticket 120). This inventory names one target per
  # source, so those targets are named here. It joins the Securities OpenFIGI
  # created and creates the rest.
  sec.nport.security:
    target: mastering
    requires: []
    after: [openfigi]
  # Company facts (ticket 45): silver rows linked to the Company by CIK, so they
  # run after it. Its silver landing target comes with ticket 46.
  sec.company-facts:
    target: null
    requires: []
    after: [sec.submissions.company]
