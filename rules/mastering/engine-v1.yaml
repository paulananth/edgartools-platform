# Shared engine vocabulary and legacy compatibility, delivered with the build.
# Changing this contract requires qualification; it does not approve or activate rules.
version: engine-catalog-relationship-types-in-rdm-v1
master_search:
  version: master-name-word-literal-v1
  name_fields:
  - name
  - legal_name
  - display_name
  position_weight: 0.1
# A lookup from a detail row's key to every current master holding it (ticket
# 138, the Listing; operator, 2026-10-26: "Listing table is inside mdm primary
# use is the resolution of securities trading in different exchanges or
# venues", then "1": an index on the Security). A listing is found by its
# venue's MIC and ticker, and by OpenFIGI's exchange code and ticker, which
# also finds a composite (no MIC). Lookup only: never read by matching.
detail_lookups:
  version: security-listing-venue-v1
  kind: security
  detail: listings
  keys:
    mic: [mic, ticker]
    exchange: [exchange, ticker]
kinds:
- branch
- company
- fund_structure
- government
- international_organization
- person
- security
- venue
profiles:
  adviser:
  - company
  - person
  audit_firm:
  - company
  fund:
  - company
  - fund_structure
accepted_bars:
  company:
    classification:
      min_precision: 0.95
      one_sided_confidence: 0.95
    name_binding:
      min_precision: 0.95
      one_sided_confidence: 0.95
  person:
    classification:
      min_precision: 0.99
      one_sided_confidence: 0.975

reference_tables:
  edgar-iso-v1:
    pin: sec-place-codes
    target_set: iso-3166
    match_type: exact
legacy_jurisdiction_table: edgar-iso-v1

# Compatibility selectors for the existing versioned pair primitives.
# These are build-pinned configuration, not approval or source activation.
legacy_pair_comparison: existing-name-binding
pair_comparisons:
  existing-name-binding:
    name_field: name
    identifier_namespace: lei
    census_field: name_census
    census_entries_field: leis
    census_holder_keys_field: ciks
    census_holder_count_field: cik_count
    census_identifier_count_field: lei_count
    census_other_holders_field: other_name_holders
    cascade_field: cascade
    cascade_identifier_field: lei
    eligibility_kind: company
    eligibility_categories:
    - GENERAL
    status_field: gleif_entity_status
    registration_status_field: gleif_registration_status
    left_address_fields:
    - address
    right_address_fields:
    - headquarters_address
    - address
