# The reference data the Mastering Policy's rules read, pinned by version and
# sha256 (profiling ticket 02; operator, 2026-10-07 08:01 ET: "Ticket 02's last
# step needs your approval. Approved"). Each pin names an RDM code set version
# whose published canonical form is `rules/reference/published/<code set>/<version>/canonical.jsonl`;
# a reader refuses it unless its sha256 is the pin. A new version is a new pin,
# so a new policy and the operator's approval, as an edit to the embedded table was.
# The relationship types MDM masters (ticket 132; operator, 2026-10-27: "Use RDM
# for keeping types and other information"): each type a code whose properties
# are its rules, its capacities child codes; the policy names it under
# `relationships`.
mdm-relationship-types:
  code_set: mdm-relationship-types
  # Version 4 adds RELATED_PERSON, Form ADV's own term (operator, 2026-11-08: "RELATED_PERSON (Recommended)").
  # Version 5 adds INVESTMENT_ADVISER_TO's capacities `advisor` and `subadvisor`, SEC Form N-CEN's own
  # adviser types (operator, 2026-11-14 10:30 ET, asked to name them with N-CEN's terms: "yes").
  # Version 6: every type names MDM kinds at both ends; a trading venue is RDM's iso-10383-mic on a Security's
  # listing, not a kind (operator, 2026-11-20: "Yes").
  # Version 7: INVESTMENT_ADVISER_TO's `advisor` and `subadvisor` name Form ADV Schedule D 7.B(1)/7.B(2) beside N-CEN,
  # and the link carries discretion only where its source states it, which Form ADV does not (operator, {{now}}:
  # "Publish v7 as worded (Recommended)").
  version: '7'
  sha256: fe4c840f9db73fe2085623dd1d92226194c94a0b51739b2e4ff8458b2440c3cd
sec-place-codes:
  code_set: sec-place-codes
  version: '1'
