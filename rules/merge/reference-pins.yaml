  # adviser types (operator, 2026-11-14 10:30 ET, asked to name them with N-CEN's terms: "yes").
  version: '5'
  sha256: 3fd9c31a87657c5de5ba38b6771652469f90484ac313c665cbeff28ecf887a2b
