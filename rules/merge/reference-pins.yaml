# The reference data the Mastering Policy's rules read, pinned by version and
# sha256 (profiling ticket 02; operator, 2026-10-07 08:01 ET: "Ticket 02's last
# step needs your approval. Approved"). Each pin names an RDM code set version
# whose published canonical form is `rules/reference/published/<code set>/<version>/canonical.jsonl`;
# a reader refuses it unless its sha256 is the pin. A new version is a new pin,
# so a new policy and the operator's approval, as an edit to the embedded table was.
# The relationship types MDM masters (ticket 132; operator, 2026-10-27: "Use RDM
# for keeping types and other information"): each type a code whose properties
# are its rules, its capacities child codes; the policy names it under
# `relationships`.
