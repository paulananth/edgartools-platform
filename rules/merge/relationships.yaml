# Relationship types MDM masters (profiling ticket 04; operator, 2026-10-06:
# "Types as data"). Part of the Mastering Policy: a change here is a new policy
# version, approved by its digest. A new type needs no code change.
#
# Each type:
#   from, to          the kinds of the two ends (any of the MDM kinds)
#   from_profile,     a role profile the end must hold over the link's period
#   to_profile        (an adviser, a fund, an audit firm)
#   capacities        a link in a capacity (a Person link): the capacities it
#                     accepts; its dates come from dated sightings, folded
#   hierarchy: true   the links form parent chains: cycles are checked, and the
#                     chain can be walked (mdm.relationship_chain)
#   cycles            for a hierarchy: invalid (a cycle's links are not
#                     mastered) or review (they are, and a steward is told)
#   one_parent: true  for a hierarchy: one parent at a time per scope; two
#                     overlapping parents are both held back for a steward
#   ultimate_parent   for a hierarchy: derive each record's ultimate parent with
#                     this algorithm: accounting-chain-v2 keeps its history, a
#                     period for each stretch its chain held (v1, the run date
#                     only, is what earlier policies ran)
#   ultimate_type     the type the derived ultimate parent is written as (its
#                     basis is calculated, beside the stated ones)
#   ends_parent_links a succession: on its date the ceased entity (its from
#                     end) loses its parent links, and its children lose
#                     theirs unless a source states them again after that date
#
# Every name is the source's or the standard's own term (operator, 2026-10-07:
# "All relationships must be named as close as reality"; each name approved one
# by one, profiling ticket 04b). A link's properties (a percent, discretion,
# investment discretion, voting authority, a corporate action's event type)
# are carried on its periods.
#
# Before this file the same table was held in code; a policy registered without
# this section still uses it (relationships.TYPES_V0), so the two must agree.
version: relationship-types-v3
types:
  # Consolidation (GLEIF's relationship file names; IFRS 10 / ASC 810).
  IS_DIRECTLY_CONSOLIDATED_BY:
    from: [company, fund_structure, government, international_organization]
    to: [company, fund_structure, government, international_organization]
    hierarchy: true
    cycles: invalid
    one_parent: true
    ultimate_parent: accounting-chain-v2
    ultimate_type: IS_ULTIMATELY_CONSOLIDATED_BY
  IS_ULTIMATELY_CONSOLIDATED_BY:
    from: [company, fund_structure, government, international_organization]
    to: [company, fund_structure, government, international_organization]
    hierarchy: true
    cycles: invalid
    one_parent: true
  # Corporate actions (GLEIF's SuccessorEntity).
  SUCCESSOR_ENTITY:
    from: [company, fund_structure, government, international_organization]
    to: [company, fund_structure, government, international_organization]
    ends_parent_links: true
  # Ownership (Exhibit 21; Schedules 13D/13G and Forms 3/4/5).
  IS_SUBSIDIARY_OF:
    from: [company, fund_structure, government, international_organization]
    to: [company, fund_structure, government, international_organization]
    hierarchy: true
    cycles: review
  BENEFICIAL_OWNER_OF:
    from: [company, fund_structure, government, international_organization, person]
    to: [company, fund_structure, government, international_organization]
    capacities: [five_percent_owner, ten_percent_owner]
  # People (Forms 3/4/5 role flags).
  EMPLOYED_BY:
    from: [person]
    to: [company]
    capacities: [director, employee, officer]
  # Securities (13F, Forms 3/4/5).
  HOLDS:
    from: [company, fund_structure, person]
    to: [security]
  ISSUED_BY:
    from: [security]
    to: [company, fund_structure, government, international_organization]
  # Funds (Form ADV and N-CEN; GLEIF's relationship file names).
  INVESTMENT_ADVISER_TO:
    from: [company, person]
    to: [company, fund_structure]
    from_profile: adviser
    to_profile: fund
  IS_FUND-MANAGED_BY:
    from: [company, fund_structure]
    to: [company, person]
    from_profile: fund
  IS_SUBFUND_OF:
    from: [company, fund_structure]
    to: [company, fund_structure]
    from_profile: fund
    to_profile: fund
    hierarchy: true
    cycles: invalid
  IS_FEEDER_TO:
    from: [company, fund_structure]
    to: [company, fund_structure]
    from_profile: fund
    to_profile: fund
    hierarchy: true
    cycles: invalid
  # Branches (GLEIF).
  IS_INTERNATIONAL_BRANCH_OF:
    from: [branch]
    to: [company, fund_structure, government, international_organization]
    hierarchy: true
    cycles: invalid
  # Audit (XBRL cover page; the audit report).
  AUDITED_BY:
    from: [company]
    to: [company]
    to_profile: audit_firm
  # Trading venues (ISO 10383; MiFID II's market operator).
  HAS_MARKET_OPERATOR:
    from: [venue]
    to: [company, fund_structure, government, international_organization]
  IS_SEGMENT_OF_EXCHANGE:
    from: [venue]
    to: [venue]
    hierarchy: true
    cycles: invalid
