# Person merge rules. Source: the SEC submissions document of each filer, read for Person.
# An edit to a rule's steps or lists is a new version, listed anew in policy.yaml.
version: person-2026-10-25.one-value-per-identifier
defaults:
  sources:
  - sec.submissions.person.v1
  # SEC ownership filings (profiling ticket 07), after the submissions document:
  # the owner's name as a filing states it fills a field only where no submissions
  # document did.
  - sec.ownership.reporting_owner.v1
  allow_unknown_effective: true
rules:
# Rule C-J (docs/specs/person/consumer.md; prototype policy-person.json), ported under
# a new id for sec.submissions.person.v1: raw paths (`name`, `entityType`); step 0 dropped
# (the record IS the submissions document); step 1 holds back with probable kind
# company instead of emitting company (a Person rule's company verdict would never
# activate and would block). Measured on this source: a fresh random sample, 570/570.
- rule_id: sec-person-candidate
  version: 2026-09-30.1
  family: classification
  source: sec.submissions.person.v1
  emits:
  - person
  - entity_undetermined
  - deferred
  steps:
  - step: "1"
    verdict: deferred
    probable_kind: company
    when:
    - primitive: field_in_set@1
      args:
        field: entityType
        values:
        - operating
        - investment
  - step: 2-guard
    verdict: deferred
    when:
    - primitive: token_match@1
      args:
        field: name
        normalizer: conformed
        token_list: entity_legal_form
        min_count: 1
        max_count: 1
    - primitive: name_shape@1
      args:
        field: name
        normalizer: conformed
        min_tokens: 2
        max_tokens: 5
        suffix_list: person_suffix
        forbid_digits:
          value: true
          applies_to: raw
        forbid_characters:
          value:
          - "&"
          applies_to: raw
    - primitive: fields_all_empty@1
      args:
        fields: structural_fields
  - step: "2"
    verdict: entity_undetermined
    when:
    - primitive: token_match@1
      args:
        field: name
        normalizer: conformed
        token_list: entity_legal_form
        exclude_list: ambiguous
        min_count: 1
  - step: "3"
    verdict: person
    when:
    - primitive: token_match@1
      negate: true
      args:
        field: name
        normalizer: conformed
        token_list: entity_legal_form
        min_count: 1
    - primitive: fields_all_empty@1
      args:
        fields: structural_fields
    - primitive: name_shape@1
      args:
        field: name
        normalizer: conformed
        min_tokens: 2
        max_tokens: 5
        suffix_list: person_suffix
        forbid_digits:
          value: true
          applies_to: raw
        forbid_characters:
          value:
          - "&"
          applies_to: raw
  - step: "4"
    verdict: deferred
    otherwise: true
# Tier A: the issued CIK, shaped like company-cik. Rests on its Identifier Contract.
- rule_id: person-cik
  version: "2026-09-30"
  family: binding
  source: sec.submissions.person.v1
  applies_to_verdict: person
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: cik
  - primitive: identifier_cardinality@1
    args:
      namespace: cik
# The Person rule (sec-person-candidate) ported to SEC ownership filings (profiling
# ticket 07, 2026-10-13): the same name tests on the owner's name as the filing states
# it, and a person only when the filing names the owner a director or officer
# (operator, 2026-10-13, "Persons by role first (Recommended)"). A Form 4 states no
# entity type and none of the structural fields, so steps 1 and the structural test
# have nothing to read; the role is the evidence instead.
- rule_id: sec-ownership-person
  version: 2026-10-13.1
  family: classification
  source: sec.ownership.reporting_owner.v1
  emits:
  - person
  - entity_undetermined
  - deferred
  steps:
  - step: 2-guard
    verdict: deferred
    when:
    - primitive: token_match@1
      args:
        field: rpt_owner_name
        normalizer: conformed
        token_list: entity_legal_form
        min_count: 1
        max_count: 1
    - primitive: name_shape@1
      args:
        field: rpt_owner_name
        normalizer: conformed
        min_tokens: 2
        max_tokens: 5
        suffix_list: person_suffix
        forbid_digits:
          value: true
          applies_to: raw
        forbid_characters:
          value:
          - "&"
          applies_to: raw
  - step: "2"
    verdict: entity_undetermined
    when:
    - primitive: token_match@1
      args:
        field: rpt_owner_name
        normalizer: conformed
        token_list: entity_legal_form
        exclude_list: ambiguous
        min_count: 1
  - step: 3-director
    verdict: person
    when:
    - primitive: token_match@1
      negate: true
      args:
        field: rpt_owner_name
        normalizer: conformed
        token_list: entity_legal_form
        min_count: 1
    - primitive: name_shape@1
      args:
        field: rpt_owner_name
        normalizer: conformed
        min_tokens: 2
        max_tokens: 5
        suffix_list: person_suffix
        forbid_digits:
          value: true
          applies_to: raw
        forbid_characters:
          value:
          - "&"
          applies_to: raw
    - primitive: field_in_set@1
      args:
        field: is_director
        values:
        - true
  - step: 3-officer
    verdict: person
    when:
    - primitive: token_match@1
      negate: true
      args:
        field: rpt_owner_name
        normalizer: conformed
        token_list: entity_legal_form
        min_count: 1
    - primitive: name_shape@1
      args:
        field: rpt_owner_name
        normalizer: conformed
        min_tokens: 2
        max_tokens: 5
        suffix_list: person_suffix
        forbid_digits:
          value: true
          applies_to: raw
        forbid_characters:
          value:
          - "&"
          applies_to: raw
    - primitive: field_in_set@1
      args:
        field: is_officer
        values:
        - true
  - step: "4"
    verdict: deferred
    otherwise: true
# The owner's issued CIK, as person-cik: one CIK, one Person. Rests on the CIK
# Identifier Contract, whose sources list this one.
- rule_id: sec-ownership-person-cik
  version: 2026-10-13.1
  family: binding
  source: sec.ownership.reporting_owner.v1
  applies_to_verdict: person
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: cik
  - primitive: identifier_cardinality@1
    args:
      namespace: cik
