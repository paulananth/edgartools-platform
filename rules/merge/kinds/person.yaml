identifiers:
  cik:
    authority: SEC/EDGAR
    sources:
    - sec.submissions.person.v1
    - sec.ownership.reporting_owner.v1
    normalizer: normalize_identifier@sec-cik-v2
    claim:
      forward: 1
      # One value per master (ticket 138): what the engine has always enforced
      # (a second value sends the master to review), now stated, since the
      # engine reads this limit and a Security's identifiers have none.
      reverse: 1
    compatibility:
      field: kind
      predicate: kind_equal@1
