# Identifier Contracts (ticket 04, Q14): what a Company's identifier claim
# rests on. The CIK contract's verification corpus is ticket 05's Proving Run
# manifest (research/05-manifest.json, 7,000 CIKs). The operator approved it on
# 2026-09-29 07:27 ET (ticket 15). The tolerance line is the spec's sec.cik row.
identifiers:
  cik:
    authority: SEC/EDGAR
    sources:
    - sec.company.v1
    - sec.nport.registrant.v1
    # Form ADV filings list the adviser's own CIKs (Item 1.D(3); operator, 2026-11-08: "Both"). They
    # find a Company and never create one (iapd-adv-cik waits), so the creating sources stay SEC's.
    - iapd.adv.filings.v2
    normalizer: normalize_identifier@sec-cik-v2
    claim:
      forward: 1
      # One value per master (ticket 138): what the engine has always enforced
      # (a second value sends the master to review), now stated, since the
      # engine reads this limit and a Security's identifiers have none.
      reverse: 1
    compatibility:
      field: kind
      predicate: kind_equal@1
    # Re-verified with the N-PORT registrant among its sources (ticket 79, operator
    # 2026-10-17 21:03 ET): the registrant Proving Run
    # (.scratch/onboarding/sec.nport/registrant-proving-run.json). It was verified
    # before on ticket 05's Proving Run (3607ae6c...60cc), approved 2026-09-29.
    verification:
      corpus_sha256: e217bf4d46fcef7226fa46eee97dd9d769fba9b669d035ad0fc3984ee342da61
      approved_by: operator
      approved_at: "2026-10-18T01:03:32Z"
      reason: "ticket 79 part 2, N-PORT 2026q2 registrant Proving Run, approved in the operator's words: Switch on all six (Recommended). 1,947 registrant Companies, read with the 20 SEC Companies that hold the same CIKs, no CIK on two Companies, a second pass changed nothing; the SEC Companies' own run (ticket 05, 3607ae6c...60cc) stands"
    tolerance:
      unit: items
      warm_up_decisions: 10000
      max_per_10k: 5
  # Form ADV (ticket 07). Verified on the ticket 76 run; operator, 2026-10-17
  # 08:31 ET: "Switch on all three (Recommended)".
  crd:
    authority: FINRA Central Registration Depository
    sources:
    - iapd.adv.filings.v2
    normalizer: normalize_identifier@crd-v1
    claim:
      forward: 1
      # One value per master (ticket 138): what the engine has always enforced
      # (a second value sends the master to review), now stated, since the
      # engine reads this limit and a Security's identifiers have none.
      reverse: 1
    compatibility:
      field: kind
      predicate: kind_equal@1
    verification:
      corpus_sha256: 9a0a7bbe236126d31b0411cf2296ca25684bb0bbd1a971e65dc7966558d34d93
      approved_by: operator
      approved_at: "2026-10-17T12:31:29Z"
      reason: "tickets 75 and 76: Form ADV run beside GLEIF and SEC, 13 months, 24,760 Companies, no CRD, LEI or BD number on two Companies, 15,339 custodian links, a third pass changed nothing"
    tolerance:
      unit: items
      warm_up_decisions: 10000
      max_per_10k: 5
  lei:
    authority: GLEIF (ISO 17442)
    # GLEIF's own record issues an LEI (ticket 22, the issuer rule).
    sources:
    - iapd.adv.custodians.v1
    - gleif.level1.v1
    normalizer: normalize_identifier@lei-v1
    claim:
      forward: 1
      # One value per master (ticket 138): what the engine has always enforced
      # (a second value sends the master to review), now stated, since the
      # engine reads this limit and a Security's identifiers have none.
      reverse: 1
    compatibility:
      field: kind
      predicate: kind_equal@1
    verification:
      corpus_sha256: 9a0a7bbe236126d31b0411cf2296ca25684bb0bbd1a971e65dc7966558d34d93
      approved_by: operator
      approved_at: "2026-10-17T12:31:29Z"
      reason: "tickets 75 and 76: Form ADV run beside GLEIF and SEC, 13 months, 24,760 Companies, no CRD, LEI or BD number on two Companies, 15,339 custodian links, a third pass changed nothing"
    tolerance:
      unit: items
      warm_up_decisions: 10000
      max_per_10k: 5
  # The CRD normalizer keeps digits only: "8-129" is 8129. Over 13 months
  # the 326 BD numbers have no zero-padded variant (no "8-00129").
  bd_number:
    authority: SEC (broker-dealer file number, 8-)
    sources:
    - iapd.adv.custodians.v1
    normalizer: normalize_identifier@crd-v1
    claim:
      forward: 1
      # One value per master (ticket 138): what the engine has always enforced
      # (a second value sends the master to review), now stated, since the
      # engine reads this limit and a Security's identifiers have none.
      reverse: 1
    compatibility:
      field: kind
      predicate: kind_equal@1
    verification:
      corpus_sha256: 9a0a7bbe236126d31b0411cf2296ca25684bb0bbd1a971e65dc7966558d34d93
      approved_by: operator
      approved_at: "2026-10-17T12:31:29Z"
      reason: "tickets 75 and 76: Form ADV run beside GLEIF and SEC, 13 months, 24,760 Companies, no CRD, LEI or BD number on two Companies, 15,339 custodian links, a third pass changed nothing"
    tolerance:
      unit: items
      warm_up_decisions: 10000
      max_per_10k: 5
bars:
  classification:
    min_precision: 0.95
    method: wilson_lower_bound
    one_sided_confidence: 0.95
  name_binding:
    min_precision: 0.95
    one_sided_confidence: 0.95
    method: wilson_lower_bound
