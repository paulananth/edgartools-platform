# Company merge rules: source priority, field rules, the classification rule and
# the declared SEC-to-GLEIF name rules. Rules are data (operator, 2026-09-24):
# adding a kind is a new file here, not an edit to a source.
version: company-2026-10-31.sec-company-source-identity
defaults:
  # Shared fields (operator, 2026-09-24): `name` and `address` are one field
  # each across sources, SEC first. SEC fills `address` from its business
  # address; GLEIF from its legal address (headquarters postcode and country
  # go to matching only). `jurisdiction` is GLEIF's alone; SEC's state of
  # incorporation stays SEC's own field, as SEC writes it.
  sources:
  - sec.company.v1
  - gleif.level1.v1
  # GLEIF's accounting-parent links (platform validation 06a); it maps no
  # fields, so it fills none.
  - gleif.relationships.v1
  # Form ADV (profiling ticket 07): advisers' filings and the custodians they
  # name (one record per file), last, so SEC and GLEIF win every field they fill.
  - iapd.adv.filings.v2
  - iapd.adv.custodians.v1
  # N-PORT registrants (ticket 79, part 2), last: every field another source
  # fills wins over N-PORT's (a merge-rule change, approved with its Proving
  # Run under the operator's standing words, 2026-10-15).
  - sec.nport.registrant.v1
  allow_unknown_effective: true
rules:
- rule_id: sec-company-candidate
  version: 2026-11-09.phase-1-listed-operating
  family: classification
  source: sec.company.v1
  emits:
  - company
  - deferred
  steps:
  # Phase 1 (operator, 2026-11-09: "For phase 1 master only publically traded companies (filter)"; "Operating and
  # listed a real company"): a filer with no ticker is not publicly traded and is set aside before any other test.
  - step: "0"
    verdict: deferred
    when:
    - primitive: fields_all_empty@1
      args:
        fields: ticker
  - step: "1"
    verdict: deferred
    when:
    - primitive: field_in_set@1
      args:
        field: sic
        values:
        - "6189"
  - step: "2"
    verdict: deferred
    probable_kind: fund_structure
    when:
    - primitive: field_in_set@1
      args:
        field: sic
        values:
        - "6221"
  - step: "3"
    verdict: deferred
    probable_kind: government
    when:
    - primitive: field_in_set@1
      args:
        field: sic
        values:
        - "8888"
  - step: "5"
    verdict: deferred
    probable_kind: fund_structure
    when:
    - primitive: field_in_set@1
      args:
        field: entity_type
        values:
        - operating
    - primitive: token_match@2
      args:
        field: entity_name
        normalizer: conformed
        token_list: fund_name
        min_count: 1
  - step: "8"
    verdict: company
    when:
    - primitive: field_in_set@1
      args:
        field: entity_type
        values:
        - operating
  - step: "9"
    verdict: deferred
    probable_kind: person
    when:
    - primitive: field_in_set@1
      args:
        field: entity_type
        values:
        - other
    - primitive: token_match@2
      args:
        field: entity_name
        normalizer: conformed
        token_list: person_suffix
        min_count: 1
  - step: "11"
    verdict: deferred
    otherwise: true

# The CIK matching rule (company mastering tickets 04 and 15): an SEC record the
# classification rule accepts joins the one Company that holds its CIK, or
# creates it when none does. Only SEC's own record creates a Company from a CIK.
# It activates on its verified Identifier Contract (below), not on a measured
# bar; the operator approved it on 2026-09-29 07:27 ET (ticket 15).
- rule_id: company-cik
  version: "2026-09-24"
  family: binding
  source: sec.company.v1
  applies_to_verdict: company
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: cik
  - primitive: identifier_cardinality@1
    args:
      namespace: cik
# An N-PORT registrant joins the one Company that holds its CIK, or creates it
# (operator, 2026-10-15: "agreed"): SEC's own Company record sets nearly every
# registrant aside (typed "investment" or "other" with no category), so none
# would otherwise exist. Switched on (ticket 79; operator, 2026-10-17 21:03 ET:
# "Switch on all six (Recommended)"): it activates on the CIK Identifier
# Contract, re-verified with this source on the registrant Proving Run.
- rule_id: nport-registrant-cik
  version: 2026-10-15.1
  family: binding
  source: sec.nport.registrant.v1
  applies_to_verdict: company
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: cik
  - primitive: identifier_cardinality@1
    args:
      namespace: cik
- rule_id: sec-gleif-name-jurisdiction
  version: 2026-09-25.1
  family: name_binding
  source: gleif.level1.v1
  holder_source: sec.company.v1
  applies_to_verdict: company
  emits:
  - bind
  on_no_match: wait
  when:
  - primitive: name_census_match@1
    args:
      sec_normalizer: normalize_text@sec-legal-form-kept-v1
      gleif_normalizer: normalize_text@legal-form-kept-v1
  - primitive: gleif_entity_eligible@1
    args:
      categories:
      - GENERAL
      entity_statuses:
      - ACTIVE
      refused_registration_statuses:
      - ANNULLED
      - DUPLICATE
  - primitive: holds_no_other_lei@1
    args: {}
  - primitive: jurisdiction_agrees@1
    args:
      sec_field: state_of_incorporation
      sec_codes: edgar-iso-v1
      gleif_field: jurisdiction
- rule_id: sec-gleif-name-postal
  version: 2026-09-25.2
  family: name_binding
  source: gleif.level1.v1
  holder_source: sec.company.v1
  applies_to_verdict: company
  emits:
  - bind
  on_no_match: wait
  when:
  - primitive: name_census_match@1
    args:
      sec_normalizer: normalize_text@sec-legal-form-kept-v1
      gleif_normalizer: normalize_text@legal-form-kept-v1
  - primitive: gleif_entity_eligible@1
    args:
      categories:
      - GENERAL
      entity_statuses:
      - ACTIVE
      refused_registration_statuses:
      - ANNULLED
      - DUPLICATE
  - primitive: holds_no_other_lei@1
    args: {}
  - primitive: jurisdictions_do_not_conflict@1
    args:
      sec_field: state_of_incorporation
      sec_codes: edgar-iso-v1
      gleif_field: jurisdiction
      sec_business_country: matching.business_country
  - primitive: postal_agrees@1
    args:
      sec_code: matching.business_postal_code
      sec_country: matching.business_country
      gleif_code: matching.headquarters_postal_code
      gleif_country: matching.headquarters_country
# The cascade (company mastering ticket 21; operator, 2026-09-27: "name and
# address first ... then reduce the fields gradually"). One rule per pass, in
# order; the Name Count runs the passes once over both whole sources, one to
# one over what earlier passes left, on the addresses the quality rule leaves
# fit (headquarters first; one more than 25 entities share is compared by
# country only: ticket 22, "25, yes"). No jurisdiction test: a conflict in
# place of incorporation is flagged, and the proof decides (2026-09-28).
# Declared, not switched on: each pass needs its own proof and the
# operator's approval (ticket 20). The two rules above stay until then.
# "Name and city or postcode" is switched on (ticket 09; operator, 2026-10-30
# 18:20 ET; its proof is in policy.yaml). It compares the city or the postcode;
# "name and full address" (street, city and postcode) and "name and postcode"
# were deleted (operator, 2026-10-30: "do not use p1 or p4, p5 can match on
# postel code"): a pair either matched agrees on the city or the postcode, so
# it takes their links, the 4 flagged ones included ("Link them
# (Recommended)"). "Name and country" and "name alone" were deleted (operator,
# 2026-11-03: "delete p6 and p7"): the first rested on 2 labelled pairs that
# read as a namesake, the second had a different entity among its 14 labels.
# "Name, street and postcode" and "name, street and city" were deleted
# (ticket 09; operator, 2026-10-17: "Delete both"): too few new links to prove
# (8 and 22 of 52 needed); a pair either matched shares the postcode or the
# city, which "name and city or postcode" now compares. Each pass is named by
# what it compares (operator, 2026-11-03: no pass numbers).
- rule_id: sec-gleif-name-city-or-postcode
  version: 2026-11-03.named-by-what-it-compares
  family: name_binding
  source: gleif.level1.v1
  holder_source: sec.company.v1
  applies_to_verdict: company
  emits:
  - bind
  on_no_match: wait
  when:
  - primitive: cascade_pass@1
    args:
      pass: name and city or postcode
      compare:
      - - city
        - postcode
      over_shared: 25
      refused_flags: []
      sec_normalizer: normalize_text@sec-legal-form-kept-v1
      gleif_normalizer: normalize_text@legal-form-kept-v1
  - primitive: gleif_entity_eligible@1
    args:
      categories:
      - GENERAL
      entity_statuses:
      - ACTIVE
      refused_registration_statuses:
      - ANNULLED
      - DUPLICATE
  - primitive: holds_no_other_lei@1
    args: {}
# Form ADV (profiling ticket 07; operator, 2026-10-09 14:56 ET: "custodian
# must be in mdm, they are a company, Advisors must be in MDM"): an adviser's
# filings join the one Company that holds its CRD, or create it; a
# custodian's records (one per monthly file) join the one Company that holds
# its SEC broker-dealer number, or, with none, its LEI, or create it
# (operator: "BD number first (Recommended)"; the reading fills
# `custodian_lei` only when a row has no BD number, so the two custodian
# rules never apply to one record and their order here does not matter). A
# custodian named by neither is not bound (its name id is lookup only) until a
# proven name rule (ticket 07b). Switched on (rebuild-priorities ticket 76;
# operator, 2026-10-17 08:31 ET: "Switch on all three (Recommended)").
- rule_id: iapd-adv-crd
  # Version "filings v2": the filings carry their CIKs, a new dataset code (iapd.adv.filings.v2).
  version: 2026-11-08.filings-v2
  family: binding
  source: iapd.adv.filings.v2
  applies_to_verdict: company
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: crd
  - primitive: identifier_cardinality@1
    args:
      namespace: crd
# An adviser's filing joins the SEC Company holding a CIK its Item 1.D(3) lists
# (operator, 2026-11-08: "Both", the CIK join with the Schedule D 7.A link).
# It finds and never creates: only SEC's own records issue a CIK, so when no
# Company holds it the CRD rule creates the adviser and the CIKs go onto it. A
# filing listing CIKs that two Companies hold (an adviser's own and a fund's)
# reaches both and goes to review; nothing merges.
- rule_id: iapd-adv-cik
  version: 2026-11-08.adviser-cik-filings-v2
  family: binding
  source: iapd.adv.filings.v2
  applies_to_verdict: company
  emits:
  - bind
  on_no_match: wait
  when:
  - primitive: identifier_match@1
    args:
      namespace: cik
  - primitive: identifier_cardinality@1
    args:
      namespace: cik
- rule_id: iapd-adv-custodian-lei
  version: 2026-10-09.1
  family: binding
  source: iapd.adv.custodians.v1
  applies_to_verdict: company
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: lei
  - primitive: identifier_cardinality@1
    args:
      namespace: lei
- rule_id: iapd-adv-custodian-bd
  version: 2026-10-09.1
  family: binding
  source: iapd.adv.custodians.v1
  applies_to_verdict: company
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: bd_number
  - primitive: identifier_cardinality@1
    args:
      namespace: bd_number
# A custodian named only by its name (Form ADV 5.K(3), no BD number or LEI; 274 of the 494 custodian
# records in June 2026) joins the one Company that other sources' records hold under the same name
# id (the name folded by `name_id@1`), exact name only (operator, 2026-11-04: "Master the name
# against company then attach", then "Agreed"). It finds and never creates: no holder leaves it
# waiting, several holders send it to review. A bank and its holding company have different names, so
# they stay apart.
- rule_id: iapd-adv-custodian-name
  # Version "filings v2": the holders' Form ADV filings are read under iapd.adv.filings.v2.
  version: 2026-11-08.filings-v2
  family: exact_name_binding
  source: iapd.adv.custodians.v1
  holder_sources:
  - sec.company.v1
  - gleif.level1.v1
  - iapd.adv.filings.v2
  applies_to_verdict: company
  emits:
  - bind
  key: name_id@1
  on_no_match: wait
  on_several: review
# A custodian named only by its name that no other source's Company holds (operator, 2026-11-09: "master using name
# and company type", then "Name plus place"): a name that ends in a legal form creates one Company for that name,
# which the custodian's later records join; a name with no legal form creates one Company per place (name, city, state
# and country). The rule above runs first, so an existing Company of the same name is joined, never doubled. Both rules
# only act on the custodian's own records.
- rule_id: iapd-adv-custodian-name-form
  version: 2026-11-09.1
  family: exact_name_binding
  source: iapd.adv.custodians.v1
  holder_sources: []
  applies_to_verdict: company
  emits:
  - bind
  key: name_id@1
  cross_reference: name_form_id
  on_no_match: mint
  on_several: review
- rule_id: iapd-adv-custodian-name-place
  version: 2026-11-09.1
  family: exact_name_binding
  source: iapd.adv.custodians.v1
  holder_sources: []
  applies_to_verdict: company
  emits:
  - bind
  key: name_place_id@1
  cross_reference: name_place_id
  on_no_match: mint
  on_several: review
# A GLEIF record an N-PORT holding names as its issuer joins the one Company
# that holds its LEI, and otherwise waits for the SEC-GLEIF name rules; it
# never creates a Company (operator, 2026-10-16: "Wait, config only
# (Recommended)"; ticket 22). Creating one made 3,240 issuers that are SEC
# filers a second Company in Proving Run 2, since identifier rules run before
# the name rules. The record test keeps it to issuers. Declared, not switched on.
- rule_id: gleif-issuer-lei
  version: 2026-10-16.2
  family: binding
  source: gleif.level1.v1
  applies_to_verdict: company
  emits:
  - bind
  on_no_match: wait
  when:
  - primitive: evidence_present@1
    args:
      document: provenance.matching.nport_issuer
  - primitive: identifier_match@1
    args:
      namespace: lei
  - primitive: identifier_cardinality@1
    args:
      namespace: lei
