# Security merge rules (a new kind, ticket 79). Source: the SEC Form 13F
# information tables, one record per CUSIP over a data set
# (rules/sources/sec.thirteenf.securities). Rulings it rests on
# (operator, 2026-10-14): "CUSIP and ISIN join" (one CUSIP is one Security;
# FIGI, ticker and SEDOL are lookup only); "Securities only, options aside";
# "A" (the Security carries the issuer name and class title as filed).
# Switched on (operator, 2026-10-15 06:27 ET, in their words: "merge 985 when green agreed for the rest"):
# the matching rule activates on its Identifier Contract, verified on the
# Proving Run's cohort (rules/merge/policy.yaml, automatic_rules).
version: security-2026-11-02.thirteenf-source-is-securities
defaults:
  # The first listed wins each field. Operator, 2026-10-18 (ticket 84): "make
  # openfigi priority 1 and 13f last", then "Name only (Recommended)". OpenFIGI
  # fills the name (name_of_issuer) and no title; N-PORT then 13F fill the
  # title as filed. Measured (rank_sources.py over the three sources' rows):
  # OpenFIGI states one name for 99.7% of its 353,491 CUSIPs, N-PORT for 62.4%
  # of 385,382 and 13F for 59.9% of 29,942.
  # Ticket 138 (operator, 2026-10-25: "this should be second source", then
  # "Load and priority"): OpenFIGI, then 13F, then N-PORT, replacing "make
  # openfigi priority 1 and 13f last" (2026-10-18).
  sources:
  - openfigi.security.v4
  - sec.thirteenf.securities.v2
  - sec.nport.security.v2
  # Last, and it states no field: the Form 4 symbol only finds a Security (ticket 24).
  - sec.ownership.security.v2
  allow_unknown_effective: true
rules:
# Tier A: the issued CUSIP. A record joins the one Security that holds its
# CUSIP, or creates it. A CUSIP failing its check digit never reaches this
# rule: the Dataset Contract sets it aside (invalid_cusip_checksum).
# "13F CUSIP binds first" (ticket 138, with the FIGI rule below): a filed CUSIP
# and FIGI on two Securities bind by the CUSIP; the FIGI is never merged.
- rule_id: security-cusip
  version: 2026-11-10.source-v2
  family: binding
  source: sec.thirteenf.securities.v2
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  on_conflict: first
  when:
  - primitive: identifier_match@1
    args:
      namespace: cusip
  - primitive: identifier_cardinality@1
    args:
      namespace: cusip
# "Filed FIGI finds its Security" (ticket 138 Design 5; operator, 2026-10-26
# 14:42 ET: "Lookup only (Recommended)"): the FIGI a 13F filer states, a
# cross-reference, finds the Security OpenFIGI gave it to. 13F does not issue
# FIGIs, so the value is never that Security's; it creates nothing and merges
# nothing. It needs OpenFIGI loaded first: a 13F record read before OpenFIGI
# answers creates its own Security, which a later answer does not move.
- rule_id: thirteenf-security-filed-cusip
  # "A security found in 13F must be a mastered Security" (ticket 204; operator, 2026-11-10): a 13F holding whose CUSIP
  # fails its check digit is keyed by the CUSIP as filed, flagged by `cusip_check_digit`. It creates; the value never
  # joins a Security by itself.
  version: 2026-11-10.last-resort
  family: binding
  source: sec.thirteenf.securities.v2
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: filed_cusip
  - primitive: identifier_cardinality@1
    args:
      namespace: filed_cusip
- rule_id: thirteenf-security-figi
  version: 2026-11-10.source-v2
  family: binding
  source: sec.thirteenf.securities.v2
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: wait
  when:
  - primitive: identifier_match@1
    args:
      namespace: figi
  - primitive: identifier_cardinality@1
    args:
      namespace: figi
- rule_id: nport-security-cusip
  # "Filed CUSIP binds first" (ticket 138 part A2b; operator, 2026-10-25:
  # "bind by CUSIP if matches if not then try isin", "cusip is a seperate than
  # isin it can never be merges"): a filed CUSIP and ISIN leading to two
  # Securities bind by the CUSIP; the ISIN the other Security holds is
  # withheld from this one, never merged.
  version: 2026-10-26.2
  family: binding
  source: sec.nport.security.v2
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  on_conflict: first
  when:
  - primitive: identifier_match@1
    args:
      namespace: cusip
  - primitive: identifier_cardinality@1
    args:
      namespace: cusip
# An N-PORT CUSIP record also joins by an ISIN filed with it; it carries every
# one (ticket 138, part B2; it replaces "Use FIGI to add pairs too",
# 2026-10-15). Its CUSIP and an ISIN pointing at two Securities bind by the
# CUSIP (the rule above, part A2b). A Security
# filed with no usable CUSIP, keyed by its ISIN in the same Dataset Contract
# (ticket 120; operator, 2026-10-20: "One master record"), joins by it too, or
# is created: this rule replaces nport-isin-security-isin.
- rule_id: nport-security-isin
  version: 2026-10-26.1
  family: binding
  source: sec.nport.security.v2
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: isin
  - primitive: identifier_cardinality@1
    args:
      namespace: isin
# A Security filed with neither a usable CUSIP nor an ISIN is keyed by its SEDOL, else its LoanX
# (ticket 190; operator, 2026-11-04: "You can not build every make isin work for others", "Always
# build generic"): it joins the Security that holds the value, or is created; a value held by two
# Securities goes to review. One rule per identifier kind, since a matching rule names one.
- rule_id: nport-security-filed-cusip
  # "A security found in N-PORT must be a mastered Security" (ticket 204; operator, 2026-11-10): a holding whose CUSIP
  # fails its check digit and which states no ISIN, SEDOL or LoanX is keyed by the CUSIP as filed, flagged by the
  # `cusip_check_digit` quality check. It creates; the value never joins a Security by itself (a steward merges a
  # near-match with `mdm steward resolve`).
  version: 2026-11-10.last-resort
  family: binding
  source: sec.nport.security.v2
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: filed_cusip
  - primitive: identifier_cardinality@1
    args:
      namespace: filed_cusip
- rule_id: nport-security-sedol
  version: 2026-11-04.1
  family: binding
  source: sec.nport.security.v2
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  when:
  # Only a record keyed by it: a SEDOL filed beside a CUSIP or an ISIN is stored, never matched,
  # since funds file one SEDOL on several Securities (2026 Q2: see the contract's verification).
  - primitive: field_in_set@1
    args:
      field: provenance.matching.key_class
      values:
      - sedol
  - primitive: identifier_match@1
    args:
      namespace: sedol
  - primitive: identifier_cardinality@1
    args:
      namespace: sedol
- rule_id: nport-security-loanx
  version: 2026-11-04.1
  family: binding
  source: sec.nport.security.v2
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  when:
  # Only a record keyed by it: a LOANX filed beside a CUSIP or an ISIN is stored, never matched,
  # since funds file one LOANX on several Securities (2026 Q2: see the contract's verification).
  - primitive: field_in_set@1
    args:
      field: provenance.matching.key_class
      values:
      - loanx
  - primitive: identifier_match@1
    args:
      namespace: loanx
  - primitive: identifier_cardinality@1
    args:
      namespace: loanx
# A FIGI an N-PORT holding files with no other key finds the Security OpenFIGI gave it to (ticket 139;
# operator, 2026-11-04: "Yes, find only, in the second batch"). N-PORT does not issue FIGIs, so the value is
# never that Security's: the rule creates nothing and merges nothing, and a FIGI no Security holds waits.
# Only a record keyed by it matches: a FIGI beside a CUSIP or an ISIN is not read.
- rule_id: nport-security-figi
  version: 2026-11-04.1
  family: binding
  source: sec.nport.security.v2
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: wait
  when:
  - primitive: field_in_set@1
    args:
      field: provenance.matching.key_class
      values:
      - figi
  - primitive: identifier_match@1
    args:
      namespace: figi
  - primitive: identifier_cardinality@1
    args:
      namespace: figi
# OpenFIGI (ticket 138; operator, 2026-10-25: "there should be one processing
# with all the identifier and this is the first load", "first lookup if not
# exists then master"): one record per identifier asked, CUSIP or ISIN, with
# every listing's FIGI. It joins the Security holding any of them, else
# creates one; a CUSIP answer and an ISIN answer of one security meet by a
# shared listing FIGI. One rule per identifier kind, since a matching rule
# names one; all three mint. They replace the ticket 120 rules
# (openfigi-security-cusip 2026-10-23.1, openfigi-isin-security-cusip and
# openfigi-security-isin 2026-10-24.1) and wait for their switch-on.
- rule_id: openfigi-security-cusip
  version: 2026-11-10.source-v4
  family: binding
  source: openfigi.security.v4
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: evidence_present@1
    args:
      document: provenance.matching.found
  - primitive: identifier_match@1
    args:
      namespace: cusip
  - primitive: identifier_cardinality@1
    args:
      namespace: cusip
- rule_id: openfigi-security-isin
  version: 2026-11-10.source-v4
  family: binding
  source: openfigi.security.v4
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: evidence_present@1
    args:
      document: provenance.matching.found
  - primitive: identifier_match@1
    args:
      namespace: isin
  - primitive: identifier_cardinality@1
    args:
      namespace: isin
# An identifier OpenFIGI did not find (operator, 2026-11-09: "openfigi is currently creating only equity so if it
# is equity then yes if not no"): the answer attaches to the Security that already holds that CUSIP or ISIN, and
# creates nothing, since a not-found answer states no security type. With no holder it waits for a recorded reason.
- rule_id: openfigi-not-found-cusip
  version: 2026-11-10.source-v4
  family: binding
  source: openfigi.security.v4
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: wait
  when:
  - primitive: evidence_present@1
    args:
      document: provenance.matching.found
    negate: true
  - primitive: identifier_match@1
    args:
      namespace: cusip
  - primitive: identifier_cardinality@1
    args:
      namespace: cusip
- rule_id: openfigi-not-found-isin
  version: 2026-11-10.source-v4
  family: binding
  source: openfigi.security.v4
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: wait
  when:
  - primitive: evidence_present@1
    args:
      document: provenance.matching.found
    negate: true
  - primitive: identifier_match@1
    args:
      namespace: isin
  - primitive: identifier_cardinality@1
    args:
      namespace: isin
- rule_id: openfigi-security-figi
  # "FIGI merges Securities" (ticket 138 part A2a; operator, 2026-10-25: two
  # Securities reached through a listing FIGI "consolidate them automatically,
  # the oldest id survives, then bind"; a pair a steward split stays apart,
  # "Steward splits + exclusion").
  version: 2026-11-10.source-v4
  family: binding
  source: openfigi.security.v4
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  on_several: merge
  when:
  - primitive: identifier_match@1
    args:
      namespace: figi
  - primitive: identifier_cardinality@1
    args:
      namespace: figi
# "A Form 4's symbol finds its Security" (ticket 24; operator, 2026-11-04, "Yes, Form 4 route
# only"): the trading symbol an issuer files with an insider filing, a cross-reference, finds
# the Security OpenFIGI gave that ticker to. The filing does not issue tickers, so the value is
# never that Security's: the rule creates nothing, merges nothing, waits when no Security holds
- rule_id: openfigi-security-share-class-figi
  # "Share class FIGI finds its Security" (ticket 206; operator, 2026-11-10: "step 3 agreed"): a record that states a
  # share class FIGI joins the Security that holds it, unless that Security holds another CUSIP or ISIN than the record
  # states. Then the record joins nothing and goes to review for a data steward (an old and a new CUSIP after a reverse
  # split, a redomicile, or two issuers that share a value). The share class never merges two Securities.
  version: 2026-11-10.source-v4
  family: binding
  source: openfigi.security.v4
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: share_class_figi
  - primitive: identifier_cardinality@1
    args:
      namespace: share_class_figi
# the ticker and sends several Securities (a reused ticker) to review. It needs OpenFIGI first.
- rule_id: form4-security-ticker
  version: 2026-11-07.one-record-per-filing
  family: binding
  source: sec.ownership.security.v2
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: wait
  on_several: review
  when:
  - primitive: identifier_match@1
    args:
      namespace: ticker
  - primitive: identifier_cardinality@1
    args:
      namespace: ticker
      max_per_10k: 5
# A Form 4 security no Security holds (operator, 2026-11-09: "This is not following step 1" on a Form 4 security stored
# without a golden record; then "Create by issuer and title (Recommended)"): the rule above finds the Security OpenFIGI
# gave the symbol, and when none holds it this rule creates one for the issuer and its symbol, which the same issuer's
# later filings join. The filing's issuer block states the issuer CIK and the symbol, not the security's title, so those
# two identify it; the symbol alone is not used, since one ticker names two securities (17,941 ticker and exchange pairs
# sit on two or more CUSIPs). The rule above runs first.
- rule_id: form4-security-issuer-symbol
  version: 2026-11-09.1
  family: exact_name_binding
  source: sec.ownership.security.v2
  holder_sources: []
  applies_to_verdict: security
  emits:
  - bind
  key: issuer_symbol_id@1
  cross_reference: issuer_symbol_id
  on_no_match: mint
  on_several: review
identifiers:
  cusip:
    authority: CUSIP Global Services (ANSI X9.6)
    sources:
    - sec.thirteenf.securities.v2
    - sec.nport.security.v2
    - openfigi.security.v4
    # rules/identifiers/cusip.yaml (ticket 81): 9 characters, the check digit
    # verified, upper-cased.
    normalizer: normalize_identifier@cusip-v1
    claim:
      forward: 1
      reverse: null
    compatibility:
      field: kind
      predicate: kind_equal@1
    # Re-verified with N-PORT among its sources (ticket 79, operator 2026-10-17
    # 21:03 ET): the part 1 Proving Run, which read 13F first, then N-PORT
    # (.scratch/onboarding/sec.nport/proving-run.json). It was verified before on
    # the SEC 13F Proving Run (52cb4469...fc80).
    verification:
      corpus_sha256: 0832f611736430d882303bd2417244572c1488a4fe95d2de92915591120878ae
      approved_by: operator
      approved_at: "2026-10-18T01:03:32Z"
      reason: "ticket 79 part 1, N-PORT 2026q2 Security Proving Run with 13F first, approved in the operator's words: Switch on all six (Recommended). 423,562 Securities, 393,645 CUSIPs and 380,790 ISINs held, 0 on two Securities, a second pass changed nothing"
    tolerance:
      unit: items
      warm_up_decisions: 10000
      max_per_10k: 5
  isin:
    authority: ISIN (ISO 6166), issued by each country's numbering agency
    sources:
    - sec.nport.security.v2
    - openfigi.security.v4
    # rules/identifiers/isin.yaml (ticket 81): 12 characters, the check digit
    # verified, upper-cased.
    normalizer: normalize_identifier@isin-v1
    claim:
      forward: 1
      reverse: null
    compatibility:
      field: kind
      predicate: kind_equal@1
    # The part 1 Proving Run (.scratch/onboarding/sec.nport/proving-run.json).
    verification:
      corpus_sha256: 0832f611736430d882303bd2417244572c1488a4fe95d2de92915591120878ae
      approved_by: operator
      approved_at: "2026-10-18T01:03:32Z"
      reason: "ticket 79 part 1, N-PORT 2026q2 Security Proving Run with 13F first, approved in the operator's words: Switch on all six (Recommended). 423,562 Securities, 393,645 CUSIPs and 380,790 ISINs held, 0 on two Securities, a second pass changed nothing"
    tolerance:
      unit: items
      warm_up_decisions: 10000
      max_per_10k: 5
  # A SEDOL and a LoanX (ticket 125; operator, 2026-10-20: "SEDOL, CINS, LoanX
  # (Recommended)"): the fund's own "other identifier" rows told apart by their
  # label and shape. Each joins the Security its holding already keys by its CUSIP
  # or ISIN, and, with neither, key a Security (ticket 190: rules nport-security-sedol and
  # nport-security-loanx, verified below on the limited test).
  # An issuer may hold one SEDOL for several listings, so no reverse limit.
  sedol:
    authority: SEDOL (London Stock Exchange), the Stock Exchange Daily Official List
    sources:
    - sec.nport.security.v2
    # rules/identifiers/sedol.yaml (ticket 125): seven characters, the check digit
    # verified, upper-cased.
    normalizer: normalize_identifier@sedol-v1
    claim:
      forward: 5
      reverse: null
    compatibility:
      field: kind
      predicate: kind_equal@1
    verification:
      corpus_sha256: 0c2be443fafca180026149ddb1dfb7ca6f76f84f521a8c6ca74ca4077c6e2555
      approved_by: operator
      approved_at: "2026-11-04T14:34:50Z"
      reason: "ticket 190 limited test (.scratch/rebuild-priorities/research/190_limited_test.json), approved under the operator's standing approval (2026-11-04: switch on for form 4 keep it standing approval for ticket 190 191). 2026 Q2 N-PORT: 1,122 Securities keyed by a SEDOL alone, of which 1,065 are also filed beside a CUSIP or an ISIN on another holding and so join an existing Security; of 26,081 SEDOLs filed on a keyed holding 1,590 sit on several Securities (at most 4), so the rule matches only a record keyed by it and one whose SEDOL several Securities hold goes to review. Published in a second batch after the CUSIP and ISIN records: 5 Securities, not 7 in one batch; a second pass changed nothing (tests/integration/test_nport_security_other_keys.py)"
    tolerance:
      unit: items
      warm_up_decisions: 10000
      max_per_10k: 5
  loanx:
    authority: LoanX, a loan-market data provider
    sources:
    - sec.nport.security.v2
    # rules/identifiers/loanx.yaml (ticket 125): LX and six digits, upper-cased.
    normalizer: normalize_identifier@loanx-v1
    claim:
      forward: 5
      reverse: null
    compatibility:
      field: kind
      predicate: kind_equal@1
    verification:
      corpus_sha256: 0c2be443fafca180026149ddb1dfb7ca6f76f84f521a8c6ca74ca4077c6e2555
      approved_by: operator
      approved_at: "2026-11-04T14:34:50Z"
      reason: "ticket 190 limited test (.scratch/rebuild-priorities/research/190_limited_test.json), approved under the operator's standing approval (2026-11-04: switch on for form 4 keep it standing approval for ticket 190 191). 2026 Q2 N-PORT: 2,238 Securities keyed by a LoanX alone, of which 202 are also filed beside a CUSIP or an ISIN on another holding and so join an existing Security; of 2,459 LoanX values filed on a keyed holding 204 sit on several Securities (at most 3), so the rule matches only a record keyed by it and one whose LoanX several Securities hold goes to review. Published in a second batch after the CUSIP and ISIN records; a second pass changed nothing (tests/integration/test_nport_security_other_keys.py)"
    tolerance:
      unit: items
      warm_up_decisions: 10000
      max_per_10k: 5
  # A listing's FIGI (ticket 138; operator, 2026-10-25): it matches like a
  # CUSIP or an ISIN, and only it shows two Securities are one. One Security
  # holds a FIGI for each listing, so no reverse limit. Verified on ticket
  # 138's limited test and switched on 2026-10-26 12:24 ET.
  figi:
    authority: FIGI (Object Management Group standard), issued by Bloomberg as its Registration Authority
    sources:
    - openfigi.security.v4
    # rules/identifiers/figi.yaml (ticket 107): 12 characters, the check
    # digit verified, upper-cased.
    normalizer: normalize_identifier@figi-v2
    # A listing FIGI consolidates: values leading to two Securities merge them
    # (ticket 138 part A2a; operator, 2026-10-25: "consolidate them
    # automatically, the oldest id survives, then bind"). A CUSIP or ISIN
    # never does ("cusip is a seperate than isin it can never be merges").
    consolidates: true
    claim:
      forward: 1
      reverse: null
    compatibility:
      field: kind
      predicate: kind_equal@1
    verification:
      corpus_sha256: a1ac543735547058302a7c3f633fdc87aa21979d13198a0fb74dc962cf4b3175
      approved_by: operator
      approved_at: "2026-10-26T16:24:52Z"
      reason: "ticket 138 limited test (.scratch/rebuild-priorities/research/138_switch_on_limited_test.json), approved in the operator's words: Do limited testing and switch on. 30 OpenFIGI CUSIP answer files and the 40 ISIN files sharing their FIGIs, with N-PORT's 3,000 CUSIPs: in both load orders 4,250 Securities, the same records each, 1 merge by a shared FIGI, 0 identifiers on two Securities, 0 open reviews, a second pass changed nothing"
    tolerance:
      unit: items
      warm_up_decisions: 10000
      max_per_10k: 5
  # A share class FIGI (ticket 206; operator, 2026-11-10: "step 3 agreed"): one value for every listing of a share
  # class in the world. It finds the Security that holds it, never merges two, and a Security that holds another
  # CUSIP or ISIN than the record states is a conflict for a data steward (`conflicts_with`).
  share_class_figi:
    authority: FIGI (Object Management Group standard), issued by Bloomberg as its Registration Authority
    sources:
    - openfigi.security.v4
    normalizer: normalize_identifier@figi-v2
    conflicts_with:
    - cusip
    - isin
    claim:
      forward: 1
      reverse: null
    compatibility:
      field: kind
      predicate: kind_equal@1
    verification:
      corpus_sha256: 2c696d2f2d469bb915c42561fb9dad1751255298728de35947a498c50e48d377
      approved_by: operator
      approved_at: "2026-11-10T12:10:00Z"
      reason: "ticket 206 limited test (.scratch/rebuild-priorities/research/206_share_class_limited_test.json), approved under the operator's standing approval (2026-10-15: \"Approved the rules always\") and his ruling \"step 3 agreed\" (2026-11-10). The 72 stored OpenFIGI records of the 25 share class values two Securities held: 50 Securities became 25, the 8 pairs with no conflicting CUSIP or ISIN joined, the 17 with a conflict sent their other 27 records to review, none merged"
    tolerance:
      unit: items
      warm_up_decisions: 10000
      max_per_10k: 5
  # A CUSIP as filed (ticket 204; operator, 2026-11-10): the last-resort key of an N-PORT security whose CUSIP fails
  # its check digit and which states no other identifier. One Security per value; it never merges two.
  filed_cusip:
    authority: the filer (a CUSIP as written, the check digit not verified)
    sources:
    - sec.nport.security.v2
    - sec.thirteenf.securities.v2
    normalizer: normalize_identifier@filed_cusip-v1
    claim:
      forward: 1
      reverse: null
    compatibility:
      field: kind
      predicate: kind_equal@1
    verification:
      corpus_sha256: 31d9a237f3a180bd30a3d1b63fe359b4a979b8e797cd2ab6bd93b4f6744a713e
