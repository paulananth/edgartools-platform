# Security merge rules (a new kind, ticket 79). Source: the SEC Form 13F
# information tables, one record per CUSIP over a data set
# (rules/sources/sec.thirteenf.information_table). Rulings it rests on
# (operator, 2026-10-14): "CUSIP and ISIN join" (one CUSIP is one Security;
# FIGI, ticker and SEDOL are lookup only); "Securities only, options aside";
# "A" (the Security carries the issuer name and class title as filed).
# Switched on (operator, 2026-10-15 06:27 ET, in their words: "merge 985 when green agreed for the rest"):
# the matching rule activates on its Identifier Contract, verified on the
# Proving Run's cohort (rules/merge/policy.yaml, automatic_rules).
version: security-2026-10-25.one-openfigi-load
defaults:
  # The first listed wins each field. Operator, 2026-10-18 (ticket 84): "make
  # openfigi priority 1 and 13f last", then "Name only (Recommended)". OpenFIGI
  # fills the name (name_of_issuer) and no title; N-PORT then 13F fill the
  # title as filed. Measured (rank_sources.py over the three sources' rows):
  # OpenFIGI states one name for 99.7% of its 353,491 CUSIPs, N-PORT for 62.4%
  # of 385,382 and 13F for 59.9% of 29,942.
  # Ticket 138 (operator, 2026-10-25: "this should be second source", then
  # "Load and priority"): OpenFIGI, then 13F, then N-PORT, replacing "make
  # openfigi priority 1 and 13f last" (2026-10-18).
  sources:
  - openfigi.security.v3
  - sec.thirteenf.information_table.security.v1
  - sec.nport.security.v2
  allow_unknown_effective: true
rules:
# Tier A: the issued CUSIP. A record joins the one Security that holds its
# CUSIP, or creates it. A CUSIP failing its check digit never reaches this
# rule: the Dataset Contract sets it aside (invalid_cusip_checksum).
- rule_id: security-cusip
  version: 2026-10-14.1
  family: binding
  source: sec.thirteenf.information_table.security.v1
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: cusip
  - primitive: identifier_cardinality@1
    args:
      namespace: cusip
- rule_id: nport-security-cusip
  version: 2026-10-20.1
  family: binding
  source: sec.nport.security.v2
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: cusip
  - primitive: identifier_cardinality@1
    args:
      namespace: cusip
# An N-PORT CUSIP record also joins by an ISIN filed with it; it carries every
# one (ticket 138, part B2; it replaces "Use FIGI to add pairs too",
# 2026-10-15). Its CUSIP and an ISIN pointing at two Securities defers to
# review until ticket 138's part A2 binds it by the CUSIP. A Security
# filed with no usable CUSIP, keyed by its ISIN in the same Dataset Contract
# (ticket 120; operator, 2026-10-20: "One master record"), joins by it too, or
# is created: this rule replaces nport-isin-security-isin.
- rule_id: nport-security-isin
  version: 2026-10-20.1
  family: binding
  source: sec.nport.security.v2
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: isin
  - primitive: identifier_cardinality@1
    args:
      namespace: isin
# OpenFIGI (ticket 138; operator, 2026-10-25: "there should be one processing
# with all the identifier and this is the first load", "first lookup if not
# exists then master"): one record per identifier asked, CUSIP or ISIN, with
# every listing's FIGI. It joins the Security holding any of them, else
# creates one; a CUSIP answer and an ISIN answer of one security meet by a
# shared listing FIGI. One rule per identifier kind, since a matching rule
# names one; all three mint. They replace the ticket 120 rules
# (openfigi-security-cusip 2026-10-23.1, openfigi-isin-security-cusip and
# openfigi-security-isin 2026-10-24.1) and wait for their switch-on.
- rule_id: openfigi-security-cusip
  version: 2026-10-25.1
  family: binding
  source: openfigi.security.v3
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: cusip
  - primitive: identifier_cardinality@1
    args:
      namespace: cusip
- rule_id: openfigi-security-isin
  version: 2026-10-25.1
  family: binding
  source: openfigi.security.v3
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: isin
  - primitive: identifier_cardinality@1
    args:
      namespace: isin
- rule_id: openfigi-security-figi
  version: 2026-10-25.1
  family: binding
  source: openfigi.security.v3
  applies_to_verdict: security
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: figi
  - primitive: identifier_cardinality@1
    args:
      namespace: figi
identifiers:
  cusip:
    authority: CUSIP Global Services (ANSI X9.6)
    sources:
    - sec.thirteenf.information_table.security.v1
    - sec.nport.security.v2
    - openfigi.security.v3
    # rules/identifiers/cusip.yaml (ticket 81): 9 characters, the check digit
    # verified, upper-cased.
    normalizer: normalize_identifier@cusip-v1
    claim:
      forward: 1
      reverse: null
    compatibility:
      field: kind
      predicate: kind_equal@1
    # Re-verified with N-PORT among its sources (ticket 79, operator 2026-10-17
    # 21:03 ET): the part 1 Proving Run, which read 13F first, then N-PORT
    # (.scratch/onboarding/sec.nport/proving-run.json). It was verified before on
    # the SEC 13F Proving Run (52cb4469...fc80).
    verification:
      corpus_sha256: 0832f611736430d882303bd2417244572c1488a4fe95d2de92915591120878ae
      approved_by: operator
      approved_at: "2026-10-18T01:03:32Z"
      reason: "ticket 79 part 1, N-PORT 2026q2 Security Proving Run with 13F first, approved in the operator's words: Switch on all six (Recommended). 423,562 Securities, 393,645 CUSIPs and 380,790 ISINs held, 0 on two Securities, a second pass changed nothing"
    tolerance:
      unit: items
      warm_up_decisions: 10000
      max_per_10k: 5
  isin:
    authority: ISIN (ISO 6166), issued by each country's numbering agency
    sources:
    - sec.nport.security.v2
    - openfigi.security.v3
    # rules/identifiers/isin.yaml (ticket 81): 12 characters, the check digit
    # verified, upper-cased.
    normalizer: normalize_identifier@isin-v1
    claim:
      forward: 1
      reverse: null
    compatibility:
      field: kind
      predicate: kind_equal@1
    # The part 1 Proving Run (.scratch/onboarding/sec.nport/proving-run.json).
    verification:
      corpus_sha256: 0832f611736430d882303bd2417244572c1488a4fe95d2de92915591120878ae
      approved_by: operator
      approved_at: "2026-10-18T01:03:32Z"
      reason: "ticket 79 part 1, N-PORT 2026q2 Security Proving Run with 13F first, approved in the operator's words: Switch on all six (Recommended). 423,562 Securities, 393,645 CUSIPs and 380,790 ISINs held, 0 on two Securities, a second pass changed nothing"
    tolerance:
      unit: items
      warm_up_decisions: 10000
      max_per_10k: 5
  # A listing's FIGI (ticket 138; operator, 2026-10-25): it matches like a
  # CUSIP or an ISIN, and only it shows two Securities are one. One Security
  # holds a FIGI for each listing, so no reverse limit. It waits for its
  # verification on ticket 138's proof and the operator's switch-on.
  figi:
    authority: FIGI (Object Management Group standard), issued by Bloomberg as its Registration Authority
    sources:
    - openfigi.security.v3
    # rules/identifiers/figi.yaml (ticket 107): 12 characters, the check
    # digit verified, upper-cased.
    normalizer: normalize_identifier@figi-v2
    claim:
      forward: 1
      reverse: null
    compatibility:
      field: kind
      predicate: kind_equal@1
    tolerance:
      unit: items
      warm_up_decisions: 10000
      max_per_10k: 5
