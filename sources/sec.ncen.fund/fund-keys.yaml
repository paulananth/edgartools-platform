pass:
  name: fund_keys
  units: {each: file}
  lookups:
    filed: {column: accession_number, from: sec.nport.registrant/submissions.yaml, max_input_bytes: 67108864, max_input_rows: 1000000, table: filed, value_column: filed}
# Each fund row's filing date and series (FUND_REPORTED_INFO.tsv), for the readings that name a fund row by its
# id: the advisers (sec.ncen.adviser) and the share classes (sec.ncen.class). It needs only the filing dates, so
# those readings read no registrant rows; the same columns as source.yaml's `fund_filed` and `filing` tables.
execution: {profile: source.read, workers: 1, max_artifacts: 1}
read:
  format: json
  limits: {max_bytes: 1048576, max_records: 1}
  lookup_sets:
    filed:
      max_values: 1000000
      max_bytes: 67108864
      max_value_bytes: 64
      pairs: true
  tables:
    # Every fund row's filing date, a row naming no series too.
    fund_filed:
      each: .
      columns:
        fund_id: {text: {path: FUND_ID}}
        # The filing date ("YYYY MM DD" in the filing pairs) as an instant.
        filed_at:
          transform:
            value: {member_value: {lookup: filed, key: {text: {path: ACCESSION_NUMBER}}, on_many: error}}
            transforms:
            - {regex_replace: {pattern: ' ', with: '-'}}
            - {pad: {left: '', right: 'T00:00:00+00:00'}}
    # Each fund row's series; a row naming no series is the registrant's own fund, with none.
    fund_series:
      each: .
      select: {test: {path: SERIES_ID, kind: truthy}}
      columns:
        fund_id: {text: {path: FUND_ID}}
        series_id: {text: {path: SERIES_ID, default: "", transforms: [{case: upper}], null_if: ["", "N/A"]}}
  stream:
    framing: delimited
    delimited: {format: tsv, encoding: utf-8}
    container: zip
    member: FUND_REPORTED_INFO.tsv
    # Profiling, 2026q1: 7,082 rows; four quarters 14,191.
    max_input_bytes: 1000000000
    max_bytes: 100000000
    max_record: 1048576
    max_records: 1000000
    max_depth: 64
    ordinal_context: null
    partition_bytes: 8388608
    partition_records: 100000
    max_partitions: 1000
    max_spool_bytes: 1073741824
    max_output_rows: 1000000
