pass:
  readings: {funds: {step: funds.yaml}, reported: {all: reported-csv.yaml}, listed: {all: listed-csv.yaml}}
# Each private fund of one monthly file (funds.yaml) with:
# - `reported`: its latest 7.B(1) row (the highest FilingID; a FilingID is seven
#   digits on every row of 2026-03, so text order is number order), for the
#   fund's name and its master fund; none for a fund only 7.B(2) lists;
# - `name`: the 7.B(1) name, else the 7.B(2) one (sources in that order);
# - `advisors` and `subadvisors`: every filing that reports or lists the fund,
#   in that capacity, so several advisers of one fund each get their own link.
# mdm.prepare reads table `fund`.
execution: {profile: source.combine}
combine:
  max_rows: 1000000
  groups:
    fund_reported: {source: reported, table: funds, key: fund_id, value: ., mode: last, order_by: [filing_id], distinct: false, skip_null_values: true, checks: {}, where: {}}
    fund_name: {source: [reported, listed], table: funds, key: fund_id, value: name, mode: first, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {}}
    fund_published: {source: [reported, listed], table: funds, key: fund_id, value: published, mode: first, order_by: [], distinct: false, skip_null_values: true, checks: {}, where: {}}
    fund_advisors: {source: [reported, listed], table: funds, key: fund_id, value: ., mode: collect, order_by: [filing_id], distinct: true, skip_null_values: true, checks: {}, where: {capacity: advisor}}
    fund_subadvisors: {source: [reported, listed], table: funds, key: fund_id, value: ., mode: collect, order_by: [filing_id], distinct: true, skip_null_values: true, checks: {}, where: {capacity: subadvisor}}
  tables:
    fund:
      source: funds
      table: fund
      checks: {}
      where: {}
      joins:
        reported: {group: fund_reported, key: fund_id, on_missing: skip, replace: false}
        name: {group: fund_name, key: fund_id, on_missing: skip, replace: false}
        published: {group: fund_published, key: fund_id, on_missing: error, replace: false}
        advisors: {group: fund_advisors, key: fund_id, on_missing: empty, replace: false}
        subadvisors: {group: fund_subadvisors, key: fund_id, on_missing: empty, replace: false}
