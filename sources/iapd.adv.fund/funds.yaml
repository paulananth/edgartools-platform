pass:
  name: funds
  readings: {reported: {all: reported-csv.yaml}, listed: {all: listed-csv.yaml}, era_reported: {all: era-reported-csv.yaml}, era_listed: {all: era-listed-csv.yaml}}
execution:
  profile: source.combine
# One row per private fund (PFID) in one monthly file, from 7.B(1) and 7.B(2)
# of the registered (IA) and exempt reporting (ERA) advisers together: the funds the combine (combine.yaml) makes one record each. Profile
# of 2026-03: 63,746 funds in 7.B(1), 3,407 in 7.B(2), every row with a PFID.
reduce:
  max_rows: 1000000
  max_input_bytes: 1073741824
  max_state_bytes: 268435456
  max_keys: 1000000
  max_members: 1000000
  max_output_rows: 1000000
  max_output_bytes: 268435456
  groups:
    fund:
      source: [reported, era_reported, listed, era_listed]
      table: funds
      keys: [fund_id]
      mode: count
      count: rows
      sample: null
      sample_limit: 0
