pass:
  name: series_keys
  units: {each: file}
# Each fund series' LEI with its SEC series id (FUND_REPORTED_INFO.tsv), the pair set by which a holding whose
# issuer is a fund series finds that series (source.yaml's `series` lookup). It needs no other reading, so it
# runs beside the holdings' own; the same rows and columns as sec.nport.fund's `filing` table gives them.
execution: {profile: source.read, workers: 1, max_artifacts: 1}
read:
  format: json
  limits: {max_bytes: 1048576, max_records: 1}
  tables:
    series_lei:
      each: .
      # A filing naming no series is the registrant's own fund.
      select: {test: {path: SERIES_ID, kind: truthy}}
      columns:
        series_id: {text: {path: SERIES_ID, default: "", transforms: [{case: upper}], null_if: ["", "N/A"]}}
        # The series' LEI as a key: none is empty text.
        lei_key:
          text:
            path: SERIES_LEI
            default: ""
            transforms:
            - {case: upper}
            - {regex_replace: {pattern: '^(N/A|0{20})$', with: ''}}
  stream:
    framing: delimited
    delimited: {format: tsv, encoding: utf-8}
    container: zip
    member: FUND_REPORTED_INFO.tsv
    # Profiling, 2026q2: 14,416 rows.
    max_input_bytes: 1000000000
    max_bytes: 100000000
    max_record: 1048576
    max_records: 1000000
    max_depth: 64
    ordinal_context: null
    partition_bytes: 8388608
    partition_records: 100000
    max_partitions: 1000
    max_spool_bytes: 1073741824
    max_output_rows: 1000000
