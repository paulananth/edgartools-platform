# The silver table of final prospectuses: one row per 424B1 to 424B5 main document captured, with the final
# terms its cover text states. Rows are the `offering` table of prospectus-page.yaml.
# Rulings: operator ("Look-up on mdm then silver"; "424B1 to 424B5, cover terms"). A term
# the page does not state is empty, never zero; numbers land as exact decimals or whole numbers from the text as filed.
# The Company is found by its CIK and the listed Security by its ticker; their names and facts are theirs, in MDM.
table: prospectus_offering
definition: The final offering terms one 424B1 to 424B5 cover states, linked to the registrant Company and the listed Security.
grain: one row per accession number
columns:
- name: accession_number
  type: VARCHAR
  nullable: false
  definition: The filing's accession number.
  source: capture metadata scope.accession_number
  sensitivity: none
- name: cik
  type: VARCHAR
  nullable: false
  definition: The registrant's CIK, by which its Company is found.
  source: capture metadata scope.cik
  sensitivity: none
- name: captured_at
  type: TIMESTAMP WITH TIME ZONE
  nullable: false
  definition: 'The moment the page was captured from the SEC archive: the row''s time in silver; the filing''s own date is not on the page.'
  source: capture metadata captured_at
  sensitivity: none
- name: title
  type: VARCHAR
  nullable: true
  definition: The page's title, when it has one.
  source: title
  sensitivity: none
- name: shares_offered
  type: BIGINT
  nullable: true
  definition: 'The number of shares, ADSs or units the cover offers: the first count the cover names before ''shares'', ''ordinary shares'', ''American depositary shares'', ''ADSs''
    or ''units''.'
  source: cover text
  sensitivity: none
- name: price_per_share
  type: DECIMAL(38,10)
  nullable: true
  definition: The final offering price per share, from 'offering price is $X per'.
  source: cover text
  sensitivity: none
- name: over_allotment_shares
  type: BIGINT
  nullable: true
  definition: The shares the underwriters may buy in addition, from 'option to purchase up to (an additional) N shares'.
  source: cover text
  sensitivity: none
- name: ticker
  type: VARCHAR
  nullable: true
  definition: The symbol the cover names; its Security is found by it once exactly one Security holds it as its ticker.
  source: cover text
  sensitivity: none
- name: exchange
  type: VARCHAR
  nullable: true
  definition: The exchange the cover names, as written (Nasdaq Stock Market, New York Stock Exchange, ...).
  source: cover text
  sensitivity: none
key:
- accession_number
links:
- columns:
  - cik
  kind: company
  source_code: sec.company.v1
  to_part: registrant
  source_key: cik
- columns:
  - ticker
  kind: security
  identifier: ticker
  to_part: listed_security
  source_key: ticker
time:
  as_of: null
  as_at: captured_at
  event_time: null
partition: []
load_mode: append
why: 'A final prospectus is transaction data: one row per filed document, keyed by its accession number, linked to the registrant Company and the listed Security by a join on master_binding, so no record
  of its own goes through the Merge Stage. Append, since a filed document never changes.'
checks: []
