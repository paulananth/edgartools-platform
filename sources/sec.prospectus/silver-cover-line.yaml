# The silver table of a final prospectus's price lines: the offering price, the underwriters' discount and the
# proceeds, per unit (a share, a note, a security) and in total. A cover writes them one of two ways: a row per line
# with its per-unit and total amounts (the `cover_line` table of prospectus-page.yaml), or a column per line with a row
# per unit and a row for the total (`turned_price`, `turned_discount`, `turned_proceeds`). The cover's own table comes
# first in the page (the lowest table number); a later section may repeat it.
# Rulings: operator ("Look-up on mdm then silver"; "424B1 to 424B5, cover terms"). A term
# the page does not state is empty, never zero; numbers land as exact decimals or whole numbers from the text as filed.
table: prospectus_cover_line
definition: 'One price line of a final prospectus: the offering price, the underwriters'' discount or the proceeds, per unit or in total.'
grain: one row per accession number, table, row and line
columns:
- name: accession_number
  type: VARCHAR
  nullable: false
  definition: The filing's accession number.
  source: capture metadata scope.accession_number
  sensitivity: none
- name: cik
  type: VARCHAR
  nullable: false
  definition: The registrant's CIK, by which its Company is found.
  source: capture metadata scope.cik
  sensitivity: none
- name: captured_at
  type: TIMESTAMP WITH TIME ZONE
  nullable: false
  definition: 'The moment the page was captured from the SEC archive: the row''s time in silver; the filing''s own date is not on the page.'
  source: capture metadata captured_at
  sensitivity: none
- name: table_number
  type: BIGINT
  nullable: false
  definition: The table's number in the page.
  source: page order
  sensitivity: none
- name: row_number
  type: BIGINT
  nullable: false
  definition: The row's number in its table.
  source: page order
  sensitivity: none
- name: label
  type: VARCHAR
  nullable: true
  definition: The row's label as filed.
  source: first cell
  sensitivity: none
- name: line
  type: VARCHAR
  nullable: false
  definition: 'Which price line: ''offering_price'', ''underwriting_discount'' or ''proceeds''.'
  source: the row's label, or the column's heading in a turned table
  sensitivity: none
- name: per_unit
  type: DECIMAL(38,10)
  nullable: true
  definition: The amount per share, note or security (where a cell gives two, as '$0.90 / $0.00', the first).
  source: row cells
  sensitivity: none
- name: total
  type: DECIMAL(38,10)
  nullable: true
  definition: The amount for everything offered.
  source: row cells
  sensitivity: none
key:
- accession_number
- table_number
- row_number
- line
links:
- columns:
  - cik
  kinds: [company]
  identifier: cik
  to_part: registrant
  source_key: cik
time:
  as_of: null
  as_at: captured_at
  event_time: null
partition: []
load_mode: append
why: 'A price line is a fact of a filed document: transaction data keyed by its place in the page, linked to the registrant Company by a join on master_binding. Append, since a filed document never changes.'
checks: []
