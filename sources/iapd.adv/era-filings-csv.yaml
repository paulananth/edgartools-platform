pass:
  name: read_era_filings
  files: '*.zip'
  units: {each: file}
  context: {published: {fact: published}}
# The reading of the exempt reporting advisers' Form ADV Part 1A (ERA_ADV_Base) in one
# monthly bulk file: one row per filing, with the columns adviser-filings-csv.yaml reads.
# A filing with an 801- SEC file number (a registered adviser's) is in IA_ADV_Base_A too and is
# read from there alone: 20 of 4,668 rows of 2026-03, 90 of 644 of 2026-06, every one in both
# files with the same CRD, name, SEC number, city and LEI. Every other row is read, the one
# without an SEC file number included. Operator, 2026-11-24: "IA first, then ERA (Recommended)".
execution: {profile: source.read, workers: 1, max_artifacts: 512}
read:
  format: csv
  container: zip
  member: "ERA_ADV_Base_*.csv"
  encoding: [utf-8, windows-1252]
  limits: {max_bytes: 33554432, max_member_bytes: 33554432, max_records: 100000}
  context:
    published: {type: text, max_bytes: 64}
  tables:
    filings:
      each: record
      # Kept when the text `registered` (what an 801- number becomes) is not found, so the extract is empty text.
      select:
        equal:
          left: {text: {path: "1D", path_mode: literal, transforms: [{regex_replace: {pattern: '^801-.*$', with: registered}}, {regex_extract: {pattern: '^(registered)$', group: 1}}]}}
          right: {const: {value: ""}}
      columns:
        filing_id: {text: {path: FilingID, path_mode: literal}}
        submitted: {text: {path: DateSubmitted, path_mode: literal, null_if: [""]}}
        legal_name: {text: {path: "1A", path_mode: literal, null_if: [""]}}
        business_name: {text: {path: "1B1", path_mode: literal, null_if: [""]}}
        sec_file_number: {text: {path: "1D", path_mode: literal, null_if: [""]}}
        crd: {text: {path: "1E1", path_mode: literal, null_if: [""]}}
        lei: {text: {path: "1P", path_mode: literal, null_if: [""]}}
        street: {text: {path: "1F1-Street 1", path_mode: literal, null_if: [""]}}
        street2: {text: {path: "1F1-Street 2", path_mode: literal, null_if: [""]}}
        city: {text: {path: "1F1-City", path_mode: literal, null_if: [""]}}
        region: {text: {path: "1F1-State", path_mode: literal, null_if: [""]}}
        country: {text: {path: "1F1-Country", path_mode: literal, null_if: [""]}}
        postcode: {text: {path: "1F1-Postal", path_mode: literal, null_if: [""]}}
        published: {context: {name: published}}
