[package]
name = "source-contract"
version = "0.1.0"
edition = "2021"
description = "The configured source engine: read one artifact by its rules-file contract."

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Only maturin turns this on (pyproject.toml), so `cargo test` links no Python.
python = ["dep:pyo3"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
csv = "1"
indexmap = { version = "2", features = ["serde"] }
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py312"], optional = true }
quick-xml = "0.37"
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
serde = "1"
serde_yaml = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Python 3.12 integer lexical compatibility uses Unicode 15.0 decimal digits.
unicode-general-category = "=0.6.0"
