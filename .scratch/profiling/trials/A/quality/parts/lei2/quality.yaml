    - id: shape_outlier_extension_leifr_fund_number
      test: pattern@1
      value: fields.extension_leifr_fund_number
      on_fail: flag
      args:
        regex: '[A-Z][A-Z][A-Z][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'
    - id: shape_outlier_extension_ext_cif
      test: pattern@1
      value: fields.extension_ext_cif
      on_fail: flag
      args:
        regex: '[A-Z][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'
    - id: check_digit_lei
      test: lei_check_digit@1
      value: fields.lei
      on_fail: withhold
    - id: code_list_entity_entity_category
      test: in_set@1
      value: fields.entity_entity_category
      on_fail: flag
      args:
        values:
        - BRANCH
        - FUND
        - GENERAL
        - INTERNATIONAL_ORGANIZATION
        - RESIDENT_GOVERNMENT_ENTITY
        - SOLE_PROPRIETOR
