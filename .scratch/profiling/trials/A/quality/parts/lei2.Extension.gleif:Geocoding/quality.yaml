version: Trial A-lei2.Extension.gleif:Geocoding-quality-trial
quality:
  lei2_extension_gleif_geocoding:
    checks:
    - id: placeholder_gleif_relevance
      test: placeholder@1
      value: fields.gleif_relevance
      on_fail: withhold
      args:
        values:
        - NONE
        - 'NULL'
        - UNKNOWN
        - TBD
        - NOTAPPLICABLE
        - NOTAVAILABLE
    - id: placeholder_gleif_lat
      test: placeholder@1
      value: fields.gleif_lat
      on_fail: withhold
      args:
        values:
        - NONE
        - 'NULL'
        - UNKNOWN
        - TBD
        - NOTAPPLICABLE
        - NOTAVAILABLE
    - id: placeholder_gleif_lng
      test: placeholder@1
      value: fields.gleif_lng
      on_fail: withhold
      args:
        values:
        - NONE
        - 'NULL'
        - UNKNOWN
        - TBD
        - NOTAPPLICABLE
        - NOTAVAILABLE
    - id: placeholder_gleif_mapped_city
      test: placeholder@1
      value: fields.gleif_mapped_city
      on_fail: withhold
      args:
        values:
        - NONE
        - 'NULL'
        - UNKNOWN
        - TBD
        - NOTAPPLICABLE
        - NOTAVAILABLE
    - id: code_list_gleif_match_type
      test: in_set@1
      value: fields.gleif_match_type
      on_fail: flag
      args:
        values:
        - interpolated
        - pointAddress
    - id: code_list_gleif_match_level
      test: in_set@1
      value: fields.gleif_match_level
      on_fail: flag
      args:
        values:
        - city
        - district
        - houseNumber
        - intersection
        - postalCode
        - state
        - street
    - id: code_list_gleif_geocoding_failed
