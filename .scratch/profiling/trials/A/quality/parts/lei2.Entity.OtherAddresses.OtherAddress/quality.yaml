version: Trial A-lei2.Entity.OtherAddresses.OtherAddress-quality-trial
quality:
  lei2_entity_otheraddresses_otheraddress:
    checks:
    - id: placeholder_postal_code
      test: placeholder@1
      value: fields.postal_code
      on_fail: withhold
      args:
        values:
        - NONE
        - 'NULL'
        - UNKNOWN
        - TBD
        - NOTAPPLICABLE
        - NOTAVAILABLE
    - id: code_list_xml_lang
      test: in_set@1
      value: fields.xml_lang
      on_fail: flag
      args:
        values:
        - ar
        - bg
        - de
        - el
        - en
        - en-IE
        - es
