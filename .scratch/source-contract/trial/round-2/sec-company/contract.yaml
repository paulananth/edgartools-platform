# yaml-language-server: $schema=../../engine/contract.schema.json
# Source Contract — SEC company profile (submissions JSON, one document per CIK).
source: sec.company_profile
version: "trial-1"
bronze: { family: sec.submissions_company }

read:
  format: json
  tables:
    sec_company_profile:
      each: "."
      columns:
        cik:                    { text: { path: cik, default: null } }
        name:                   { text: { path: name, default: null } }
        entity_type:            { text: { path: entityType, default: null } }
        sic:                    { steps: [ { text: { path: sic, default: null } }, { empty_to_null: {} } ] }
        sic_description:        { steps: [ { text: { path: sicDescription, default: null } }, { empty_to_null: {} } ] }
        state_of_incorporation: { steps: [ { text: { path: stateOfIncorporation, default: null } }, { empty_to_null: {} } ] }
        fiscal_year_end:        { steps: [ { text: { path: fiscalYearEnd, default: null } }, { empty_to_null: {} } ] }
        tickers:                { join: { each: tickers, parts: [ { text: { path: ".", default: "" } } ], separator: ",", default: null } }
        exchanges:              { join: { each: exchanges, parts: [ { text: { path: ".", default: "" } } ], separator: ",", default: null } }
        ticker_count:           { count: { each: tickers } }
        business_city:          { steps: [ { text: { path: addresses.business.city, default: null } }, { empty_to_null: {} } ] }
        business_state:         { steps: [ { text: { path: addresses.business.stateOrCountry, default: null } }, { empty_to_null: {} } ] }
        former_names:           { join: { each: formerNames, parts: [ { text: { path: name, default: "" } } ], separator: "; ", default: null } }
        former_name_count:      { count: { each: formerNames } }
    sec_company_former_name:
      each: formerNames
      columns:
        cik:        { text: { path: cik, from: document, default: null } }
        name_index: { ordinal: {} }
        former_name: { text: { path: name, default: null } }
        valid_from: { timestamp: { path: from, default: null } }
        valid_to:   { timestamp: { path: to, default: null } }

silver:
  sec_company_profile:
    key: [cik]
    columns: { cik: string, name: string, entity_type: string, sic: string?, sic_description: string?,
               state_of_incorporation: string?, fiscal_year_end: string?, tickers: string?, exchanges: string?,
               ticker_count: bigint, business_city: string?, business_state: string?, former_names: string?,
               former_name_count: bigint }
  sec_company_former_name:
    key: [cik, name_index]
    columns: { cik: string, name_index: bigint, former_name: string, valid_from: timestamp?, valid_to: timestamp? }

dataset:
  table: sec_company_profile
  contract:
    provider: SEC
    family: submissions
    schema_version: silver-sec_company_profile-v1
    record_key: zero-padded 10-digit CIK
    publication_key: capture run plus artifact sha256
    effective_time: unknown
    semantics: patch
    completeness: bounded_sample
    adapter:
      version: sec-company-profile-trial-1
      kind_field: entity_type
      kind_values: { operating: company }
      record_key: [cik]
      identifiers: { cik: cik }
      identifier_formats: { cik: sec_cik }
      fields: { name: name }
      field_shape: nullable_text
      source_record_provenance: true

checks:
  - not_null: { table: sec_company_profile, column: cik }
  - not_null: { table: sec_company_profile, column: name }
  - unique:   { table: sec_company_profile, columns: [cik] }
  - pattern:  { table: sec_company_profile, column: cik, regex: "^[0-9]{10}$" }
  - in_set:   { table: sec_company_profile, column: entity_type, values: [operating, other] }
  - pattern:  { table: sec_company_profile, column: fiscal_year_end, regex: "^(0[1-9]|1[0-2])[0-3][0-9]$" }
  - unique:   { table: sec_company_former_name, columns: [cik, name_index] }
  - not_null: { table: sec_company_former_name, column: former_name }

tests:
  - case: an operating company with one ticker and one former name maps to a Company keyed by CIK
    fixture: fixtures/1001385.json
    expect:
      silver:
        sec_company_profile:
          - { cik: "0001001385", name: "NWPX Infrastructure, Inc.", entity_type: operating, sic: "3317", state_of_incorporation: OR,
              fiscal_year_end: "1231", tickers: NWPX, exchanges: Nasdaq, ticker_count: 1, business_city: VANCOUVER, business_state: WA,
              former_names: NORTHWEST PIPE CO, former_name_count: 1 }
        sec_company_former_name:
          - { cik: "0001001385", name_index: 1, former_name: NORTHWEST PIPE CO, valid_from: "1996-11-12T05:00:00.000Z", valid_to: "2025-06-12T04:00:00.000Z" }
      mdm:
        - { kind: company, identifiers: { cik: "0001001385" }, fields: { name: "NWPX Infrastructure, Inc." } }
  - case: tickers and exchanges are lists of plain strings, joined in document order
    fixture: fixtures/1075415.json
    expect:
      silver:
        sec_company_profile:
          - { cik: "0001075415", tickers: "DHC,DHCNI,DHCNL", exchanges: "Nasdaq,Nasdaq,Nasdaq", ticker_count: 3 }
  - case: an operating company with no tickers gives null lists and a zero count, not an empty string
    fixture: fixtures/1954360.json
    expect:
      silver:
        sec_company_profile:
          - { cik: "0001954360", entity_type: operating, sic: null, tickers: null, exchanges: null, ticker_count: 0, former_name_count: 0 }
        sec_company_former_name: []
  - case: "trap: 'other' covers a person with empty-string and null fields, and a listed foreign company; both read, neither is operating"
    fixture: [fixtures/1034380.json, fixtures/1738699.json]
    expect:
      silver:
        sec_company_profile:
          - { cik: "0001034380", name: HALBERT DAVID D, entity_type: other, sic: null, state_of_incorporation: null, fiscal_year_end: null,
              tickers: null, business_city: null, business_state: null, former_names: null, former_name_count: 0 }
          - { cik: "0001738699", name: Wisekey International Holding S.A., entity_type: other, state_of_incorporation: V8,
              tickers: "WKEY,WSKEF", exchanges: "Nasdaq,OTC", ticker_count: 2 }
        sec_company_former_name: []
      mdm:                            # a kind value outside kind_values is deferred; the runner renders it as this kind
        - { kind: unsupported_identity_kind }
        - { kind: unsupported_identity_kind }
  - case: a record with a declared binding becomes that Company; an unbound operating company waits for binding
    fixture: [fixtures/1001385.json, fixtures/1075415.json]
    given:
      identities:
        nwpx: { fixture: fixtures/1001385.json, record: "0001001385" }
    expect:
      merge:
        - { record: "0001001385", outcome: bound, to: nwpx }
        - { record: "0001075415", outcome: binding_required }

gate:
  batch: { family: sec.submissions_company, select: all }
  limits:
    deferred: { max: 356, why: "356 of 400 documents are entityType 'other' (people and listed foreign companies such as Wisekey); only the 44 'operating' documents become Companies" }
    rows.sec_company_profile: { min: 400 }
    rows.sec_company_former_name: { min: 50 }
