# Person merge rules (DRAFT, cold trial person-feed-1; a new kind).
# Classification: rule C-J (docs/specs/person/consumer.md, policy-language.md 6),
# ported from .scratch/mastering-policy-language/prototype/policy-person.json to
# the raw submissions paths; step 0 (no submissions.json) cannot fire when the
# record IS the submissions document, so it is dropped. Not in automatic_rules:
# its measured proof (841/841) was taken on sec.ownership_reporting_owner, not
# this source. Binding: person-cik on the issued CIK. The Identifier Contract has
# no verification block: that needs a Proving Run corpus and the operator.
version: person-2026-09-30.1
defaults:
  sources:
  - sec.submissions.person.v1
  allow_unknown_effective: true
rules:
- rule_id: sec-person-candidate
  version: 2026-09-30.1
  family: classification
  source: sec.submissions.person.v1
  emits:
  - person
  - company
  - entity_undetermined
  - deferred
  steps:
  - step: "1"
    verdict: company
    when:
    - primitive: field_in_set@1
      args:
        field: entityType
        values:
        - operating
        - investment
  - step: 2-guard
    verdict: deferred
    when:
    - primitive: token_match@1
      args:
        field: name
        normalizer: conformed
        token_list: entity_legal_form
        min_count: 1
        max_count: 1
    - primitive: name_shape@1
      args:
        field: name
        normalizer: conformed
        min_tokens: 2
        max_tokens: 5
        suffix_list: person_suffix
        forbid_digits:
          value: true
          applies_to: raw
        forbid_characters:
          value:
          - "&"
          applies_to: raw
    - primitive: fields_all_empty@1
      args:
        fields: structural_fields
  - step: "2"
    verdict: entity_undetermined
    when:
    - primitive: token_match@1
      args:
        field: name
        normalizer: conformed
        token_list: entity_legal_form
        exclude_list: ambiguous
        min_count: 1
  - step: "3"
    verdict: person
    when:
    - primitive: token_match@1
      negate: true
      args:
        field: name
        normalizer: conformed
        token_list: entity_legal_form
        min_count: 1
    - primitive: fields_all_empty@1
      args:
        fields: structural_fields
    - primitive: name_shape@1
      args:
        field: name
        normalizer: conformed
        min_tokens: 2
        max_tokens: 5
        suffix_list: person_suffix
        forbid_digits:
          value: true
          applies_to: raw
        forbid_characters:
          value:
          - "&"
          applies_to: raw
  - step: "4"
    verdict: deferred
    otherwise: true
- rule_id: person-cik
  version: 2026-09-30.1
  family: binding
  source: sec.submissions.person.v1
  applies_to_verdict: person
  emits:
  - bind
  on_no_match: mint
  when:
  - primitive: identifier_match@1
    args:
      namespace: cik
  - primitive: identifier_cardinality@1
    args:
      namespace: cik
