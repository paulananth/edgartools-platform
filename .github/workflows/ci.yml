name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit + Architecture tests (fast, no external services) ─────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra mdm

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Run architecture tests
        run: uv run pytest tests/architecture/ -v --tb=short

  # ── MDM pipeline tests (need mdm extras) ───────────────────────────────────
  mdm:
    name: MDM tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra mdm

      - name: Run MDM tests
        run: uv run pytest tests/mdm/ -v --tb=short

  # ── Integration tests (real Postgres via Docker, no mocks) ─────────────────
  # Fresh Bookkeeping, Rules, Change Journal, and MDM integration tests use
  # disposable PostgreSQL 16 fixtures. Pull the image explicitly so the
  # database acceptance suite cannot pass by skipping a missing prerequisite.
  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      # MDM exercises the authenticated API as well as database runtime
      # behavior. Match the locked local acceptance dependencies.
      - name: Install dependencies
        run: uv sync --frozen --extra s3 --extra mdm-runtime --extra mdm

      # Fixtures inspect the image before starting their disposable databases.
      # Provision it explicitly so a fresh runner cannot skip/fail setup.
      # One public mirror often rate-limits a shared runner address.
      # Retry across mirrors, then tag the image the fixtures already run.
      - name: Pull PostgreSQL 16 test image
        run: bash scripts/ci/pull-postgres-16.sh

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --tb=short

  # ── The configured source engine: Rust behind Python (mastering to-do 15) ──
  # MDM extras also build the binding because archive consumers now use the
  # configured reader. This job exercises its dedicated acceptance suite.
  engine:
    name: Engine (Rust behind Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Run Rust acceptance tests
        run: |
          cargo test --locked --manifest-path crates/source-contract/Cargo.toml
          cargo test --locked --manifest-path crates/control-contract/Cargo.toml

      - name: Install dependencies with the engine
        run: uv sync --frozen --extra mdm --extra engine

      - name: Run engine tests
        # Worker qualification uses the real restricted-role PG16 task protocol.
        # Provision explicitly; a missing prerequisite must fail, never skip.
        # Retry across public mirrors when one address is rate-limited.
        run: |
          bash scripts/ci/pull-postgres-16.sh
          uv run --frozen --extra mdm --extra engine pytest tests/engine/ -v --tb=short

  # ── Infra script lint (bash -n syntax check) ──────────────────────────────
  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check infra scripts
        run: |
          find infra/scripts -name "*.sh" -print0 | xargs -0 -n1 bash -n
          find scripts -name "*.sh" -print0 | xargs -0 -n1 bash -n
          echo "All shell scripts pass syntax check."

  # Real database adapter parity belongs to the canonical CI test inventory.
  storage-adapters:
    name: Skill adapter (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [postgresql, mysql, mssql]
    env:
      SKILL_ADAPTER_TEST_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install shared merge engine and database clients
        run: |
          uv sync --frozen --extra mdm --extra mdm-runtime
          uv pip install 'PyMySQL[rsa]>=1.1,<2' 'pymssql>=2.3,<3'
      - name: Qualify the selected engine on a real disposable server
        run: uv run --no-sync pytest tests/storage_adapters/ -q --tb=short
      - name: Stop this job's disposable test servers
        if: always()
        run: |
          docker ps -aq --filter 'name=skill-adapter-proof-' | xargs -r docker stop --time 5

  reference-storage:
    name: Reference storage (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [postgresql, mysql]
    env:
      SKILL_ADAPTER_TEST_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install shared merge engine and database clients
        run: |
          uv sync --frozen --extra mdm --extra mdm-runtime
          uv pip install 'PyMySQL[rsa]>=1.1,<2' 'pymssql>=2.3,<3'
      - name: Qualify reference storage through its normal caller
        run: uv run --no-sync pytest tests/reference_storage/ -q --tb=short
      - name: Qualify MySQL reference migration recovery
        if: matrix.engine == 'mysql'
        run: uv run --no-sync pytest tests/reference_mysql/ -q --tb=short
      - name: Stop this job's disposable test servers
        if: always()
        run: |
          docker ps -aq --filter 'name=skill-adapter-proof-' | xargs -r docker stop --time 5

  silver-storage:
    name: Silver storage (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [postgresql, mysql]
    env:
      SKILL_ADAPTER_TEST_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install shared merge engine and database clients
        run: |
          uv sync --frozen --extra mdm --extra mdm-runtime
          uv pip install 'PyMySQL[rsa]>=1.1,<2' 'pymssql>=2.3,<3'
      - name: Qualify Silver through its normal caller
        run: uv run --no-sync pytest tests/silver_storage/ -q --tb=short
      - name: Qualify MySQL Silver migration recovery
        if: matrix.engine == 'mysql'
        run: uv run --no-sync pytest tests/silver_mysql/ -q --tb=short
      - name: Stop this job's disposable test servers
        if: always()
        run: |
          docker ps -aq --filter 'name=skill-adapter-proof-' | xargs -r docker stop --time 5

  # ── Gate: all checks must pass before merge ────────────────────────────────
  installed-workflow:
    name: Installed MDM workflow (${{ matrix.engine }}, ${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [postgresql, mysql]
        group: [merge, readers, boundaries, workers]
    env:
      SKILL_ADAPTER_TEST_ENGINE: ${{ matrix.engine }}
      MDM_WORKFLOW_SHARD: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install shared engine and selected database clients
        run: |
          uv sync --frozen --extra mdm --extra mdm-runtime
          uv pip install 'PyMySQL[rsa]>=1.1,<2'
      - name: Qualify independently installed normal callers
        env:
          PYTEST_DEBUG_TEMPROOT: ${{ runner.temp }}
        run: uv run --no-sync pytest tests/installed_workflow/ -q --tb=short
      - name: Retain counts and outcomes only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-mdm-${{ matrix.engine }}-${{ matrix.group }}
          path: ${{ runner.temp }}/pytest-of-*/**/installed-workflow-outcome.json
          retention-days: 7
          if-no-files-found: warn
      - name: Stop this job's disposable test servers
        if: always()
        run: |
          docker ps -aq --filter 'name=skill-adapter-proof-' | xargs -r docker stop --time 5

  ci-gate:
    name: CI gate
    if: always()
    needs: [unit, mdm, integration, engine, shellcheck, storage-adapters, reference-storage, silver-storage, installed-workflow]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          results=( \
            "${{ needs.unit.result }}" \
            "${{ needs.mdm.result }}" \
            "${{ needs.integration.result }}" \
            "${{ needs.engine.result }}" \
            "${{ needs.shellcheck.result }}" \
            "${{ needs.storage-adapters.result }}" \
            "${{ needs.reference-storage.result }}" \
            "${{ needs.silver-storage.result }}" \
            "${{ needs.installed-workflow.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "CI gate failed: one or more jobs did not succeed."
              exit 1
            fi
          done
          echo "All CI checks passed."
