[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "edgartools-platform"
version = "0.1.0"
description = "Data platform for SEC EDGAR: warehouse ETL, Snowflake dbt gold layer, dashboards"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Paul Ananth", email = "thepaulananth@gmail.com" },
]
dependencies = [
    "edgartools>=5.29.0",
    "pyarrow>=17.0.0",
    "fsspec>=2023.1.0",
    "pytz>=2024.1",
    "zstandard>=0.20.0",
    "httpx>=0.25.0",
    "PyYAML>=6.0.2",
    # spaCy 3.8 imports click from spacy.cli even for `import spacy` (not only CLI
    # entrypoints). Newer typer vendors click and no longer pulls it transitively,
    # so warehouse images that install only --extra s3 (no streamlit) were missing
    # click and crashed Item 5.02 parse with ModuleNotFoundError. Pin explicitly.
    "click>=8.1",
    "spacy>=3.8.14",
    "en-core-web-sm",
]

[project.optional-dependencies]
s3 = [
    "boto3>=1.42.91",
    "fsspec>=2023.1.0",
    "s3fs>=2023.1.0",
]
snowflake = [
    "snowflake-connector-python>=3.7",
]
dashboard = [
    "streamlit>=1.32",
    "plotly>=5.20",
    "pandas>=2.1",
    "snowflake-connector-python>=3.7",
]
mdm = [
    "source-contract",
    "ijson>=3.3,<4",
    "lxml>=5.3",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "sqladmin>=0.16.0",
    "jellyfish>=1.0.0",
    "splink>=3.9.0",
    "pydantic>=2.7.0",
    "boto3>=1.34.0",
    "openpyxl>=3.1",
]
mdm-runtime = [
    "source-contract",
    "ijson>=3.3,<4",
    "lxml>=5.3",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "snowflake-connector-python>=3.7",
    "jellyfish>=1.0.0",
    "pydantic>=2.7.0",
    "boto3>=1.34.0",
]
# The configured source engine: Rust behind Python (mastering to-do 15). A
# separate extra, so a plain `uv sync` builds no Rust. MDM extras also require
# it: archive consumers use configured reading. Dependency images install a
# prebuilt wheel; MDM and engine CI jobs build the binding.
engine = [
    "source-contract",
]
market = [
    "yfinance>=0.2.40",
    "fredapi>=0.5.2",
    "pandas>=2.1",
]

[project.scripts]
edgar-warehouse = "edgar_warehouse.cli:main"

[project.urls]
Homepage = "https://github.com/paulananth/edgartools-platform"
Source = "https://github.com/paulananth/edgartools-platform"

[tool.hatch.build]
include = [
  "edgar_warehouse/**/*.py",
  "edgar_warehouse/mdm/migrations/*.sql",
  "edgar_warehouse/bookkeeping/clean/migrations/*.sql",
  "edgar_warehouse/rules/migrations/*.sql",
  "edgar_warehouse/change_journal/migrations/*.sql",
  "edgar_warehouse/rdm/migrations/*.sql",
  "edgar_warehouse/silver_writer/migrations/*.sql",
  "rules/**/*.yaml",
  "rules/reference/published/**/*.jsonl",
  "rules/reference/published/**/*.json",
]

[tool.hatch.build.targets.wheel.force-include]
"crates/source-contract/contracts/thirteenf/contract.yaml" = "edgar_warehouse/config/source_contracts/thirteenf.yaml"

[tool.pytest.ini_options]
markers = []
filterwarnings = [
    # `edgartools` (our third-party PyPI dependency, not our code -- see
    # CLAUDE.md's "edgartools Dependency" note) still imports its own
    # deprecated internal modules (edgar.files.html_documents, edgar.files.html,
    # edgar.files.htmltools) from several of its own top-level modules
    # (edgar/_filings.py, edgar/_markdown.py, edgar/files/markdown.py) --
    # every one of these DeprecationWarnings fires purely from `import edgar`
    # itself, regardless of what this codebase calls. Confirmed still present,
    # unchanged, in the latest available release (5.53.0, checked 2026-08-25
    # by inspecting its wheel directly against our pinned 5.30.0) -- so
    # upgrading the dependency does not resolve this; it's an upstream lag
    # between deprecating a module and migrating the library's own internal
    # callers off it. Pure test-output noise, not actionable in our code --
    # filtered narrowly by message (each pattern names the specific deprecated
    # module), not by blanket-ignoring every DeprecationWarning, so a real
    # deprecation warning from our own code or another dependency still surfaces.
    "ignore:edgar\\.files\\.html_documents module.*is deprecated:DeprecationWarning",
    "ignore:edgar\\.files\\.html module.*is deprecated:DeprecationWarning",
    "ignore:edgar\\.files\\.htmltools module.*is deprecated:DeprecationWarning",
]

[tool.uv.sources]
source-contract = { path = "crates/source-contract" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-testmon>=2.2.0",
]
